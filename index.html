.sheet{box-shadow:none;border:0;padding-left:20px} .sheet::before{display:none}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"bar\">\n    <div class=\"logo\" onclick=\"go('home')\"><b>Ф<\/b>Олимпиада тренажері<\/div>\n    <span class=\"chip\">Физика · 8 сынып · жасөспірімдер олимпиадасы<\/span>\n    <span class=\"sp\"><\/span>\n    <span class=\"chip\" id=\"whoChip\" hidden><\/span>\n    <div class=\"lang\" title=\"Сұрақтардың тілі\">\n      <button data-l=\"kk\" class=\"on\">ҚАЗ<\/button><button data-l=\"ru\">РУС<\/button>\n    <\/div>\n  <\/div>\n  <main id=\"app\"><\/main>\n<\/div>\n<div class=\"modal\" id=\"modal\" hidden><div class=\"sheet\" id=\"modalBox\"><\/div><\/div>\n\n<script>\n/* ═════════════════════ құралдар ═════════════════════ */\nconst $ = id => document.getElementById(id);\nconst R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;\nconst pick = a => a[Math.floor(Math.random() * a.length)];\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst LET = ['A', 'B', 'C', 'D', 'E'];\n/* сан: үтірмен, үлкен сандар бос орынмен */\nconst fmt = (x, d = 2) => Number(Number(x).toFixed(d)).toLocaleString('ru-RU', { maximumFractionDigits: d }).replace(/ /g, ' ');\nconst fr = (a, b) => `<span class=\"fr\"><span>${a}<\/span><span>${b}<\/span><\/span>`;\nconst sq = a => `<span class=\"sq\">√<span>${a}<\/span><\/span>`;\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n/* сандық жауапқа 5 нұсқа: дұрысы + жиі жіберілетін қателер */\nfunction numOpts(val, alts, unit, d = 2) {\n  const f = v => fmt(v, d) + (unit ? ' ' + unit : '');\n  const set = [f(val)];\n  for (const a of alts) { if (!isFinite(a)) continue; const s = f(a); if (!set.includes(s)) set.push(s); if (set.length === 5) break; }\n  const mul = [1.5, .5, 2, .8, 1.25, 3, .25, 1.1, .9, 4];\n  for (let k = 0; set.length < 5 && k < 40; k++) { const s = f(val === 0 ? k + 1 : val * mul[k % mul.length] * (k >= mul.length ? 1.05 : 1)); if (!set.includes(s)) set.push(s); }\n  const order = shuffle([0, 1, 2, 3, 4]);\n  return { opts: order.map(i => set[i]), a: order.indexOf(0) };\n}\nfunction txtOpts(right, wrongs) {\n  const set = [right];\n  for (const w of wrongs) if (!set.includes(w) && set.length < 5) set.push(w);\n  const order = shuffle(set.map((_, i) => i));\n  return { opts: order.map(i => set[i]), a: order.indexOf(0) };\n}\n\n/* ═════════════════════ суреттер (SVG) ═════════════════════ */\nconst SVG = {\n  vessels: `<svg width=\"300\" height=\"150\" viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Serif,serif\" font-size=\"15\" fill=\"none\" stroke=\"#1f3a68\" stroke-width=\"3\">\n    <rect x=\"22\" y=\"56\" width=\"56\" height=\"78\" fill=\"#cfe2f7\" stroke=\"none\"/><path d=\"M22 30 V134 H78 V30\"/>\n    <path d=\"M118 56 L182 56 L172 134 L128 134 Z\" fill=\"#cfe2f7\" stroke=\"none\"/><path d=\"M114 30 L128 134 H172 L186 30\"/>\n    <path d=\"M232 56 L268 56 L278 134 L222 134 Z\" fill=\"#cfe2f7\" stroke=\"none\"/><path d=\"M236 30 L222 134 H278 L264 30\"/>\n    <line x1=\"8\" y1=\"56\" x2=\"292\" y2=\"56\" stroke-dasharray=\"7 5\" stroke-width=\"1.5\"/>\n    <line x1=\"8\" y1=\"136\" x2=\"292\" y2=\"136\" stroke-width=\"2\"/>\n    <text x=\"45\" y=\"22\" fill=\"#1f3a68\" stroke=\"none\" font-weight=\"700\">1<\/text><text x=\"146\" y=\"22\" fill=\"#1f3a68\" stroke=\"none\" font-weight=\"700\">2<\/text><text x=\"246\" y=\"22\" fill=\"#1f3a68\" stroke=\"none\" font-weight=\"700\">3<\/text><\/svg>`,\n  xt11: `<svg width=\"240\" height=\"190\" viewBox=\"0 0 240 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Serif,serif\" font-size=\"14\">\n    <g stroke=\"#d8e0ee\">${[0, 1, 2, 3, 4].map(i => `<line x1=\"${40 + i * 45}\" y1=\"20\" x2=\"${40 + i * 45}\" y2=\"160\"/>`).join('')}${[0, 1, 2, 3].map(i => `<line x1=\"40\" y1=\"${160 - i * 45}\" x2=\"225\" y2=\"${160 - i * 45}\"/>`).join('')}<\/g>\n    <path d=\"M40 165 V12 M35 160 H232\" stroke=\"#1f3a68\" stroke-width=\"1.8\" fill=\"none\"/>\n    <line x1=\"40\" y1=\"115\" x2=\"215\" y2=\"36\" stroke=\"#c8352b\" stroke-width=\"3\"/><line x1=\"40\" y1=\"160\" x2=\"215\" y2=\"81\" stroke=\"#c8352b\" stroke-width=\"3\"/>\n    <path d=\"M130 70 V160 M40 70 H130 M40 115 H130\" stroke=\"#1f3a68\" stroke-dasharray=\"4 4\" fill=\"none\"/>\n    <text x=\"218\" y=\"32\" fill=\"#c8352b\">1<\/text><text x=\"218\" y=\"78\" fill=\"#c8352b\">2<\/text>\n    <text x=\"24\" y=\"164\" fill=\"#1f3a68\">0<\/text><text x=\"26\" y=\"120\" fill=\"#1f3a68\">1<\/text><text x=\"26\" y=\"75\" fill=\"#1f3a68\">2<\/text><text x=\"126\" y=\"178\" fill=\"#1f3a68\">2<\/text>\n    <text x=\"46\" y=\"16\" fill=\"#1f3a68\" font-style=\"italic\">x, м<\/text><text x=\"200\" y=\"178\" fill=\"#1f3a68\" font-style=\"italic\">t, с<\/text><\/svg>`,\n  cube12: `<svg width=\"260\" height=\"190\" viewBox=\"0 0 260 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Serif,serif\" font-size=\"16\">\n    <rect x=\"10\" y=\"10\" width=\"200\" height=\"170\" fill=\"#cfe2f7\" stroke=\"#1f3a68\" stroke-width=\"2\"/>\n    <rect x=\"60\" y=\"58\" width=\"70\" height=\"70\" fill=\"#2b2b2b\"/>\n    <g stroke=\"#1f3a68\" stroke-width=\"1.4\"><line x1=\"175\" y1=\"12\" x2=\"175\" y2=\"56\"/><line x1=\"175\" y1=\"60\" x2=\"175\" y2=\"126\"/><line x1=\"175\" y1=\"130\" x2=\"175\" y2=\"178\"/>\n    <line x1=\"130\" y1=\"58\" x2=\"185\" y2=\"58\" stroke-dasharray=\"3 3\"/><line x1=\"130\" y1=\"128\" x2=\"185\" y2=\"128\" stroke-dasharray=\"3 3\"/><\/g>\n    <text x=\"222\" y=\"40\" fill=\"#1f3a68\" font-style=\"italic\">a<\/text><text x=\"222\" y=\"98\" fill=\"#1f3a68\" font-style=\"italic\">b<\/text><text x=\"222\" y=\"160\" fill=\"#1f3a68\" font-style=\"italic\">c<\/text>\n    <g stroke=\"#1f3a68\" stroke-width=\"1.5\">${[[25, 30], [120, 24], [30, 150], [140, 160], [40, 95], [150, 95]].map(([x, y]) => `<line x1=\"${x}\" y1=\"${y}\" x2=\"${x + 18}\" y2=\"${y}\"/>`).join('')}<\/g>\n    <text x=\"214\" y=\"22\" fill=\"#1f3a68\" font-size=\"13\">P₀<\/text><\/svg>`\n};\nconst IMG = {};\n\n/* ═════════════════════ олимпиаданың 30 сұрағы ═════════════════════ */\nconst Q = [\n { n: 1, lvl: 1, t: 'mkt', kk: 'Қандай заттарда диффузия жылдам жүреді?', o: ['сұйық', 'газ', 'қатты дене', 'барлығында', 'сұйық және газ'], a: 1,\n   sol: ['Диффузия — молекулалардың жылулық қозғалысы салдарынан заттардың бір-біріне өздігінен араласуы.', 'Газ молекулаларының арасы ең үлкен және олар ең жылдам, еркін қозғалады.', 'Сондықтан диффузия <b>газдарда<\/b> ең жылдам, қатты денелерде ең баяу жүреді.'] },\n { n: 2, lvl: 1, t: 'mkt', kk: 'Заттың ішкі энергиясы неге нөлге тең бола алмайды?', o: ['молекулалар соқтығыспағандықтан', 'молекулалар тепе-теңдік күйде болғандықтан', 'молекулалар үнемі қозғалыста болғандықтан', 'заттардың молекулалары тыныштықта болғандықтан', 'молекулалар тербелетіндіктен'], a: 2,\n   sol: ['Ішкі энергия — молекулалардың жылулық қозғалысының кинетикалық энергиясы мен өзара әсерлесуінің потенциалдық энергиясының қосындысы.', 'Молекулалар <b>үнемі, тоқтаусыз қозғалыста<\/b> болады, сондықтан олардың кинетикалық энергиясы нөлге тең бола алмайды.'] },\n { n: 3, lvl: 1, t: 'kin', kk: 'Шамасы 54 км/сағ жылдамдықпен қозғалған автомобиль 1200 м қашықтықты қанша уақытта жүріп өтеді?', o: ['60 с', '45 с', '48 с', '80 с', '40 с'], a: 3,\n   sol: ['Бірліктерді СИ-ге келтіреміз: 54 км/сағ = 54/3,6 = 15 м/с.', '<i>t<\/i> = <i>s<\/i>/<i>v<\/i> = 1200/15 = <b>80 с<\/b>.'] },\n { n: 4, lvl: 1, t: 'meas', kk: 'Барлығы 40 бөлікке бөлінген, ұзындығы 20 см сызғышпен өлшеу қателігі қандай?', o: ['5 мм', '2,5 мм', '1 см', '0,5 см', '0,75 см'], a: 1,\n   sol: ['Бөлік құны: 20 см / 40 = 0,5 см = 5 мм.', 'Өлшеу қателігі бөлік құнының жартысына тең: 5 мм / 2 = <b>2,5 мм<\/b>.'] },\n { n: 5, lvl: 1, t: 'kin', kk: 'Моторлы қайық өзен ағысына қарсы 5 км жолды 30 минутта жүріп өтеді. Ағыс жылдамдығы 5 км/сағ. Суға қатысты қайықтың жылдамдығы қандай?', o: ['5 км/сағ', '10 км/сағ', '15 км/сағ', '20 км/сағ', '25 км/сағ'], a: 2,\n   sol: ['Жағаға қатысты жылдамдық: 5 км / 0,5 сағ = 10 км/сағ.', 'Ағысқа қарсы: <i>v<\/i><sub>жаға<\/sub> = <i>v<\/i><sub>қайық<\/sub> − <i>v<\/i><sub>ағыс<\/sub> ⇒ <i>v<\/i><sub>қайық<\/sub> = 10 + 5 = <b>15 км/сағ<\/b>.'] },\n { n: 6, lvl: 1, t: 'dens', kk: 'Болат кубтың массасы 200 г. Қабырғасы екі есе үлкен кубтың массасы қандай болады?', o: ['1,2 кг', '1,6 кг', '0,8 кг', '0,4 кг', '3,2 кг'], a: 1,\n   sol: ['Кубтың көлемі <i>V<\/i> = <i>a<\/i><sup>3<\/sup>. Қабырғасы 2 есе артса, көлемі 2<sup>3<\/sup> = 8 есе артады.', 'Зат бірдей ⇒ масса да 8 есе: 200 г · 8 = 1600 г = <b>1,6 кг<\/b>.'] },\n { n: 7, lvl: 1, t: 'dens', kk: 'Көлемдері 45 см³ және 25 см³ болатын екі тау жынысы үлгілерінің бірге алғандағы массасы 175 г. Жыныс материалының тығыздығы қандай?', o: ['1200 кг/м³', '1500 кг/м³', '2500 кг/м³', '3500 кг/м³', '3000 кг/м³'], a: 2,\n   sol: ['Жалпы көлем: 45 + 25 = 70 см³.', '<i>ρ<\/i> = <i>m<\/i>/<i>V<\/i> = 175/70 = 2,5 г/см³ = <b>2500 кг/м³<\/b>.'] },\n { n: 8, lvl: 1, t: 'press', svg: 'vessels', kk: 'Суретте суы бар үш ыдыс кескінделген. Ыдыстар түбінің аудандары тең. Ыдыстың түбіне әсер ететін <i>p<\/i><sub>1<\/sub>, <i>p<\/i><sub>2<\/sub> және <i>p<\/i><sub>3<\/sub> қысымдарды салыстырыңдар.',\n   o: ['<i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &lt; <i>p<\/i><sub>2<\/sub> &lt; <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &lt; <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &gt; <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>2<\/sub> &lt; <i>p<\/i><sub>3<\/sub>'], a: 0,\n   sol: ['Сұйықтың түбіне қысымы <i>p<\/i> = <i>ρgh<\/i> — тек сұйықтың тығыздығы мен деңгейінің биіктігіне тәуелді.', 'Үш ыдыста да су, деңгейі бірдей (үзік сызық) ⇒ <b><i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub><\/b>. Ыдыстың пішіні мен судың көлемі маңызды емес.'] },\n { n: 9, lvl: 1, t: 'dens', kk: 'Құрамы 30 % ауа қуыстарымен толтырылған кварцтың орташа тығыздығы қандай? Кварц тығыздығы 2500 кг/м³.', o: ['2000 кг/м³', '1750 кг/м³', '1900 кг/м³', '1550 кг/м³', '1850 кг/м³'], a: 1,\n   sol: ['Көлемнің тек 70 %-ын кварц алады (ауаның массасын ескермейміз).', '<i>ρ<\/i><sub>орт<\/sub> = 0,7 · 2500 = <b>1750 кг/м³<\/b>.'] },\n { n: 10, lvl: 1, t: 'force', kk: 'Көлемі 100 см³ болатын алюминий үлгі астына қойылған сүйемелге қандай күшпен қысым жасайды? Алюминий тығыздығы 2700 кг/м³.', o: ['2,7 кН', '270 Н', '27 Н', '2,7 Н', '27 кН'], a: 3,\n   sol: ['<i>V<\/i> = 100 см³ = 10<sup>−4<\/sup> м³; <i>m<\/i> = <i>ρV<\/i> = 2700 · 10<sup>−4<\/sup> = 0,27 кг.', 'Салмағы: <i>P<\/i> = <i>mg<\/i> = 0,27 · 10 = <b>2,7 Н<\/b>.'] },\n { n: 11, lvl: 1, t: 'graph', svg: 'xt11', kk: 'Суретте екі дененің координаталарының уақыттан тәуелділік графиктері келтірілген. Олар қандай қозғалыс жасайды?', o: ['бірқалыпты', 'бірқалыпты үдемелі', 'бірқалыпты кемімелі', 'шеңбер бойымен', 'бұрандалы сызық бойымен'], a: 0,\n   sol: ['<i>x<\/i>(<i>t<\/i>) графигі — түзу сызық. Демек координата уақытқа тура пропорционал өзгереді: жылдамдық тұрақты.', 'Екі түзу параллель — жылдамдықтары бірдей: <i>v<\/i> = (2 − 1)/2 = 0,5 м/с. Қозғалыс — <b>бірқалыпты<\/b>.'] },\n { n: 12, lvl: 1, t: 'press', svg: 'cube12', kk: 'Тығыздығы <i>ρ<\/i> сұйығы бар ашық ыдыстың ішінде кубик орналасқан (суретте). Атмосфералық қысым <i>P<\/i><sub>0<\/sub>. Кубиктің жоғарғы бетіндегі қысым неге тең?',\n   o: ['<i>ρga<\/i>', '<i>ρg<\/i>(<i>b<\/i> + <i>c<\/i>)', `<i>P<\/i><sub>0<\/sub> + <i>ρgc<\/i><sup>3<\/sup>/<i>ab<\/i>`, '<i>P<\/i><sub>0<\/sub> + <i>ρga<\/i>', '<i>P<\/i><sub>0<\/sub> + <i>ρgc<\/i><sup>3<\/sup>'], a: 3,\n   sol: ['Кубиктің жоғарғы беті сұйық бетінен <i>a<\/i> тереңдікте тұр.', 'Ыдыс ашық — сұйықтың бетіне атмосфера <i>P<\/i><sub>0<\/sub> қысым түсіреді, ол Паскаль заңы бойынша барлық нүктеге беріледі.', '<i>p<\/i> = <b><i>P<\/i><sub>0<\/sub> + <i>ρga<\/i><\/b>.'] },\n { n: 13, lvl: 1, t: 'spring', kk: 'Қатаңдығы 800 Н/м болатын серіппені жүк өз салмағымен 8 мм-ге созады. Қатаңдығы 500 Н/м серіппені дәл осы жүк қаншаға созады?', o: ['25 мм', '12,8 мм', '4 мм', '6,25 мм', '50 мм'], a: 1,\n   sol: ['Жүктің салмағы: <i>F<\/i> = <i>k<\/i><sub>1<\/sub><i>x<\/i><sub>1<\/sub> = 800 · 0,008 = 6,4 Н.', '<i>x<\/i><sub>2<\/sub> = <i>F<\/i>/<i>k<\/i><sub>2<\/sub> = 6,4/500 = 0,0128 м = <b>12,8 мм<\/b>.', '<i>Ескерту: түпнұсқада бұл нұсқа «12,5 мм» деп берілген (кілт — B), дәл есептеу 12,8 мм береді.<\/i>'] },\n { n: 14, lvl: 1, t: 'force', kk: 'Бір ғаламшарда массасы 15 кг жүкті үйкеліс коэффициенті 0,3 болатын кедір-бұдырлы бет бойымен бірқалыпты сүйреу үшін 27 Н күш қажет. Осы ғаламшардағы еркін түсу үдеуі <i>g<\/i> қандай?', o: ['10 Н/кг', '3 Н/кг', '6 Н/кг', '8 Н/кг', '18 Н/кг'], a: 2,\n   sol: ['Бірқалыпты қозғалыс: тарту күші = үйкеліс күші: <i>F<\/i> = <i>μmg<\/i>.', '<i>g<\/i> = <i>F<\/i>/(<i>μm<\/i>) = 27/(0,3 · 15) = 27/4,5 = <b>6 Н/кг<\/b>.'] },\n { n: 15, lvl: 1, t: 'heat', kk: 'Массасы <i>m<\/i> сұйық <i>Q<\/i> жылу мөлшерін алғанда оның температурасы Δ<i>T<\/i>-ға артты. Осы сұйықтың меншікті жылусыйымдылығын қай теңдік анықтайды?',\n   o: ['<i>Qm<\/i>Δ<i>T<\/i>', fr('<i>m<\/i>Δ<i>T<\/i>', '<i>Q<\/i>'), '<i>Qm<\/i>/Δ<i>T<\/i>', fr('<i>Q<\/i>', '<i>m<\/i>Δ<i>T<\/i>'), '<i>Q<\/i>Δ<i>T<\/i>/<i>m<\/i>'], a: 3,\n   sol: ['<i>Q<\/i> = <i>cm<\/i>Δ<i>T<\/i> формуласынан <i>c<\/i>-ны өрнектейміз.', `<i>c<\/i> = <b>${fr('<i>Q<\/i>', '<i>m<\/i>Δ<i>T<\/i>')}<\/b>; өлшем бірлігі Дж/(кг·К).`] },\n { n: 16, lvl: 2, t: 'kin', kk: 'Сағат 14:00-де жүрген автобус белгіленген пунктке 17:00 мен 17:30 аралығында жетеді. Ол жүрген жол 210 км-ден көп, бірақ 240 км-ден аз. Автобустың орташа жылдамдығы қандай болуы мүмкін?', o: ['60 км/сағ', '85 км/сағ', '75 км/сағ', '80 км/сағ', '50 км/сағ'], a: 2,\n   sol: ['Жолдағы уақыт: 3 сағ-тан 3,5 сағ-қа дейін.', 'Ең кіші жылдамдық: 210/3,5 = 60 км/сағ; ең үлкені: 240/3 = 80 км/сағ. Шекаралар кірмейді («көп», «аз»).', '60 &lt; <i>v<\/i> &lt; 80 ⇒ тек <b>75 км/сағ<\/b> сәйкес келеді.'] },\n { n: 17, lvl: 2, t: 'spring', kk: 'Серіппені 4 мм-ге созу үшін 0,02 Дж жұмыс жасау қажет. Осы серіппені 4 см-ге созу үшін қандай жұмыс жасау қажет?', o: ['1 Дж', '2 Дж', '2,5 Дж', '4 Дж', '5 Дж'], a: 1,\n   sol: [`Серіппені созу жұмысы: <i>A<\/i> = ${fr('<i>kx<\/i><sup>2<\/sup>', 2)} — созылудың <b>квадратына<\/b> пропорционал.`, '4 см = 40 мм — созылу 10 есе артты ⇒ жұмыс 10<sup>2<\/sup> = 100 есе артады.', '<i>A<\/i> = 0,02 · 100 = <b>2 Дж<\/b>.'] },\n { n: 18, lvl: 2, t: 'kin', kk: 'Пойыздың 10 минутқа кестеден қалып келе жатқан кешігуін жою үшін машинист келу пунктіне 30 км қалғанда жылдамдығын арттырады. Бастапқыда 80 км/сағ болған жылдамдық қаншаға өсті?', o: ['60 км/сағ-қа', '45 км/сағ-қа', '40 км/сағ-қа', '64 км/сағ-қа', '30 км/сағ-қа'], a: 3,\n   sol: ['Кесте бойынша 30 км-ге кететін уақыт: 30/80 сағ = 22,5 мин.', 'Кешікпеу үшін 10 мин аз жүру керек: 12,5 мин = 12,5/60 сағ.', '<i>v<\/i> = 30/(12,5/60) = 144 км/сағ ⇒ өсімі 144 − 80 = <b>64 км/сағ<\/b>.'] },\n { n: 19, lvl: 2, t: 'cap', kk: 'Өзара параллель қосылған екі конденсатордан тұратын батареяның сыйымдылығын табыңыз. Әрбір конденсатордың сыйымдылығы 3 мкФ.', o: ['9 мкФ', '1,5 мкФ', '6 мкФ', '4,5 мкФ', '7,5 мкФ'], a: 2,\n   sol: ['Параллель жалғауда сыйымдылықтар <b>қосылады<\/b>: <i>C<\/i> = <i>C<\/i><sub>1<\/sub> + <i>C<\/i><sub>2<\/sub>.', '<i>C<\/i> = 3 + 3 = <b>6 мкФ<\/b>.', '<i>Ескерту: ресми кілтте B (1,5 мкФ) берілген — бұл тізбектей жалғаудың жауабы, шартқа сәйкес емес.<\/i>'] },\n { n: 20, lvl: 2, t: 'dens', kk: 'Салмағы 3,12 кг болатын және 500 см³ көлемді алып тұратын болат бұйымдағы қуыстардың көлемі қандай? Болат тығыздығы 7800 кг/м³.', o: ['30 см³', '80 см³', '100 см³', '40 см³', '50 см³'], a: 2,\n   sol: ['Болаттың өз көлемі: <i>V<\/i><sub>б<\/sub> = <i>m<\/i>/<i>ρ<\/i> = 3120 г / 7,8 г/см³ = 400 см³.', 'Қуыстар: 500 − 400 = <b>100 см³<\/b>.'] },\n { n: 21, lvl: 2, t: 'dens', kk: 'Тығыздықтары 400 кг/м³ және 600 кг/м³ болатын, бірдей массада алынған ұнтақтар қоспасының тығыздығы қандай? Қоспа көлемі құраушылары көлемдерінің қосындысына тең деп алыңыз.', o: ['480 кг/м³', '500 кг/м³', '540 кг/м³', '450 кг/м³', '900 кг/м³'], a: 0,\n   sol: [`Массалар бірдей <i>m<\/i>: <i>V<\/i> = ${fr('<i>m<\/i>', 400)} + ${fr('<i>m<\/i>', 600)}.`, `<i>ρ<\/i> = ${fr('2<i>m<\/i>', '<i>V<\/i>')} = ${fr('2·400·600', '400 + 600')} = <b>480 кг/м³<\/b>.`, 'Жиі қате: орта арифметикалық (500) — ол тек көлемдер бірдей болғанда дұрыс.'] },\n { n: 22, lvl: 2, t: 'cap', kk: 'Сыйымдылығы <i>C<\/i><sub>1<\/sub> конденсатор <i>U<\/i><sub>1<\/sub> = 500 В кернеуге дейін зарядталған. Бұл конденсаторды сыйымдылығы <i>C<\/i><sub>2<\/sub> = 4 мкФ зарядталмаған конденсатормен параллель қосқанда вольтметр <i>U<\/i><sub>2<\/sub> = 100 В кернеуді көрсетті. <i>C<\/i><sub>1<\/sub>-ді табыңыз.', o: ['0,5 мкФ', '2 мкФ', '0,4 мкФ', '1 мкФ', '4 мкФ'], a: 3,\n   sol: ['Заряд сақталады: <i>q<\/i> = <i>C<\/i><sub>1<\/sub><i>U<\/i><sub>1<\/sub> = (<i>C<\/i><sub>1<\/sub> + <i>C<\/i><sub>2<\/sub>)<i>U<\/i><sub>2<\/sub>.', '500<i>C<\/i><sub>1<\/sub> = 100(<i>C<\/i><sub>1<\/sub> + 4) ⇒ 400<i>C<\/i><sub>1<\/sub> = 400 ⇒ <i>C<\/i><sub>1<\/sub> = <b>1 мкФ<\/b>.'] },\n { n: 23, lvl: 2, t: 'spring', kk: 'Қатаңдықтары 15 кН/м және 25 кН/м болатын екі серіппе тізбектей жалғанған. Жүйені қандай да бір күшпен созады. Бірінші серіппенің ұзаруы 5 мм. Жүйені қандай күшпен созады және екінші серіппенің ұзаруы қандай?', o: ['50 Н, 5 мм', '75 Н, 5 мм', '50 Н, 3 мм', '75 Н, 3 мм', '50 Н, 15 мм'], a: 3,\n   sol: ['Тізбектей жалғауда екі серіппеге де <b>бірдей күш<\/b> әсер етеді.', '<i>F<\/i> = <i>k<\/i><sub>1<\/sub><i>x<\/i><sub>1<\/sub> = 15000 · 0,005 = 75 Н.', '<i>x<\/i><sub>2<\/sub> = <i>F<\/i>/<i>k<\/i><sub>2<\/sub> = 75/25000 = 0,003 м = 3 мм ⇒ <b>75 Н, 3 мм<\/b>.'] },\n { n: 24, lvl: 2, t: 'force', kk: 'Массасы 5 кг білікше кедір-бұдырлы бетте жатыр. Білікше мен бет арасындағы үйкеліс коэффициенті 0,3. Денені 10 Н және 20 Н күшпен орнынан қозғалтуға тырысқанда, оған қандай үйкеліс күші әсер етеді? <i>g<\/i> = 10 м/с².', o: ['10 Н, 20 Н', '15 Н, 15 Н', '10 Н, 15 Н', '15 Н, 20 Н', '15 Н, 30 Н'], a: 2,\n   sol: ['Тыныштық үйкелісінің ең үлкен мәні (сырғанау үйкелісі): <i>F<\/i><sub>max<\/sub> = <i>μmg<\/i> = 0,3 · 5 · 10 = 15 Н.', '10 Н &lt; 15 Н — дене қозғалмайды, тыныштық үйкелісі түсірілген күшке тең: <b>10 Н<\/b>.', '20 Н &gt; 15 Н — дене сырғанайды, үйкеліс <b>15 Н<\/b>. Жауабы: 10 Н, 15 Н.', '<i>Ескерту: ресми кілтте B (15 Н, 15 Н) берілген — бірақ 10 Н күш денені қозғалта алмайды, сондықтан үйкеліс 15 Н бола алмайды.<\/i>'] },\n { n: 25, lvl: 2, t: 'heat', kk: 'Кастрөлге температурасы <i>t<\/i><sub>0<\/sub> = 10 °C су құйып, плитаға қойған. 10 минуттан кейін су қайнаған болса, ол қанша уақытта толығымен буға айналады? <i>L<\/i> = 2,26·10<sup>6<\/sup> Дж/кг, <i>c<\/i> = 4,18·10<sup>3<\/sup> Дж/(кг·°C).', o: ['30 мин', '10 мин', '45 мин', '60 мин', '75 мин'], a: 3,\n   sol: ['Плита қуаты тұрақты: <i>P<\/i> = <i>cm<\/i>(100 − 10)/τ<sub>1<\/sub>.', 'Буландыру: <i>Lm<\/i> = <i>P<\/i>τ<sub>2<\/sub> ⇒ τ<sub>2<\/sub> = τ<sub>1<\/sub>·<i>L<\/i>/(<i>c<\/i>·90).', 'τ<sub>2<\/sub> = 10 · 2,26·10<sup>6<\/sup>/(4180 · 90) ≈ 10 · 6,0 = <b>60 мин<\/b>.'] },\n { n: 26, lvl: 3, t: 'kin', kk: 'Жолдың қандай да бір бөлігіндегі автомобильдің орташа жылдамдығы 60 км/сағ. Бастапқы үштен бір бөлігін 40 км/сағ жылдамдықпен өтті. Қалған үштен екі бөлігін қандай жылдамдықпен жүріп өтті?', o: ['80 км/сағ', '70 км/сағ', '72 км/сағ', '64 км/сағ', '128 км/сағ'], a: 0,\n   sol: ['Жолды 3<i>s<\/i> деп алайық. Жалпы уақыт: 3<i>s<\/i>/60 = <i>s<\/i>/20.', `<i>s<\/i>/40 + 2<i>s<\/i>/<i>v<\/i> = <i>s<\/i>/20 ⇒ ${fr(2, '<i>v<\/i>')} = ${fr(1, 20)} − ${fr(1, 40)} = ${fr(1, 40)}.`, '<i>v<\/i> = <b>80 км/сағ<\/b>. Жиі қате: орта арифметикамен есептеу.'] },\n { n: 27, lvl: 3, t: 'elec', kk: 'Электрон кернеулігі <i>E<\/i> = 200 кВ/м біртекті электр өрісінде орналасқан. Электронның бастапқы жылдамдығы нөлге тең болса, ол <i>t<\/i> = 1 нс уақытта қанша жол жүреді? <i>e<\/i> = 1,6·10<sup>−19<\/sup> Кл, <i>m<\/i> = 9,1·10<sup>−31<\/sup> кг.', o: ['1,92·10<sup>−2<\/sup> м', '1,02·10<sup>−2<\/sup> м', '2,06·10<sup>−2<\/sup> м', '1,76·10<sup>−2<\/sup> м', '2,02·10<sup>−2<\/sup> м'], a: 3,\n   sol: ['Өрістің күші: <i>F<\/i> = <i>eE<\/i>; үдеу: <i>a<\/i> = <i>eE<\/i>/<i>m<\/i> = 1,6·10<sup>−19<\/sup>·2·10<sup>5<\/sup>/9,1·10<sup>−31<\/sup> ≈ 3,52·10<sup>16<\/sup> м/с².', '<i>s<\/i> = <i>at<\/i><sup>2<\/sup>/2 = 3,52·10<sup>16<\/sup>·10<sup>−18<\/sup>/2 ≈ <b>1,76·10<sup>−2<\/sup> м<\/b>.'] },\n { n: 28, lvl: 3, t: 'energy', kk: 'Массасы <i>m<\/i> = 1000 т пойыз <i>a<\/i> = 0,2 м/с² үдеумен тежеле отырып, <i>t<\/i> = 100 с уақыттан кейін тоқтайды. Тежелу кезінде қанша жылу мөлшері бөлініп шықты?', o: ['1·10<sup>8<\/sup> Дж', '0,2·10<sup>6<\/sup> Дж', '2·10<sup>8<\/sup> Дж', '1·10<sup>7<\/sup> Дж', '4·10<sup>8<\/sup> Дж'], a: 2,\n   sol: ['Бастапқы жылдамдық: <i>v<\/i><sub>0<\/sub> = <i>at<\/i> = 0,2 · 100 = 20 м/с.', 'Барлық кинетикалық энергия жылуға айналады: <i>Q<\/i> = <i>mv<\/i><sub>0<\/sub><sup>2<\/sup>/2 = 10<sup>6<\/sup> · 400/2 = <b>2·10<sup>8<\/sup> Дж<\/b>.'] },\n { n: 29, lvl: 3, t: 'spring', kk: 'Қатаңдықтары 10 кН/м және 20 кН/м болатын серіппелер жүктердің әсерінен сәйкесінше 5 мм және 4 мм созылады. Жүктердің орнын ауыстырса, серіппелердің созылуы қандай болады?', o: ['4 мм, 5 мм', '8 мм, 2,5 мм', '8 мм, 10 мм', '6 мм, 3 мм', '16 мм, 5 мм'], a: 1,\n   sol: ['Жүктердің салмағы: <i>F<\/i><sub>1<\/sub> = 10000·0,005 = 50 Н, <i>F<\/i><sub>2<\/sub> = 20000·0,004 = 80 Н.', 'Ауыстырғанда: <i>x<\/i><sub>1<\/sub>′ = 80/10000 = 8 мм, <i>x<\/i><sub>2<\/sub>′ = 50/20000 = 2,5 мм ⇒ <b>8 мм, 2,5 мм<\/b>.'] },\n { n: 30, lvl: 3, t: 'elec', kk: '<i>q<\/i><sub>1<\/sub> = 4 мКл және <i>q<\/i><sub>2<\/sub> = −2 мКл екі нүктелік заряд бір-бірінен <i>l<\/i> қашықтықта орналасқан. Егер екінші заряд оң болса (+2 мКл), зарядтар арақашықтығының ортасындағы нүктеде өріс кернеулігі қалай және неше есе өзгереді?', o: ['кернеулік өзгермейді', '3 есе кемиді', '3 есе артады', '2 есе артады', '2 есе кемиді'], a: 1,\n   sol: ['Ортада екі зарядтан қашықтық бірдей, сондықтан <i>E<\/i> ∝ |<i>q<\/i>|.', 'Басында: оң заряд өрісі одан <b>сыртқа<\/b>, теріс заряд өрісі <b>өзіне қарай<\/b> — екеуі бір бағытта: <i>E<\/i> ∝ 4 + 2 = 6.', 'Екінші заряд оң болса — өрістер қарама-қарсы: <i>E<\/i> ∝ 4 − 2 = 2. Кернеулік <b>3 есе кемиді<\/b>.', '<i>Ескерту: ресми кілтте C (3 есе артады) берілген — бағыттарды ескерсек, кернеулік керісінше кемиді.<\/i>'] }\n];\nQ.forEach(q => { q.set = '2023'; });\n\n/* x(t) графигі (қосымша тестке) */\nfunction xtSvg(lines, tmax, xmax) {\n  const W = 300, H = 210, L = 36, B = 26, T = 14, R = 14;\n  const sx = t => L + t / tmax * (W - L - R), sy = x => T + (xmax - x) / xmax * (H - T - B);\n  let s = `<svg width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Sans,sans-serif\" font-size=\"12\">`;\n  for (let t = 0; t <= tmax; t++) s += `<line x1=\"${sx(t)}\" y1=\"${T}\" x2=\"${sx(t)}\" y2=\"${H - B}\" stroke=\"#d8e0ee\"/><text x=\"${sx(t)}\" y=\"${H - B + 15}\" text-anchor=\"middle\" fill=\"#1f3a68\">${t}<\/text>`;\n  const step = xmax > 20 ? 5 : xmax > 10 ? 2 : 1;\n  for (let x = 0; x <= xmax; x += step) s += `<line x1=\"${L}\" y1=\"${sy(x)}\" x2=\"${W - R}\" y2=\"${sy(x)}\" stroke=\"#d8e0ee\"/><text x=\"${L - 5}\" y=\"${sy(x) + 4}\" text-anchor=\"end\" fill=\"#1f3a68\">${x}<\/text>`;\n  s += `<path d=\"M${L} ${H - B} H${W - 4} M${L} ${H - B} V4\" stroke=\"#1f3a68\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"${W - 6}\" y=\"${H - B - 6}\" text-anchor=\"end\" fill=\"#1f3a68\" font-style=\"italic\">t, с<\/text><text x=\"${L + 6}\" y=\"12\" fill=\"#1f3a68\" font-style=\"italic\">x, м<\/text>`;\n  lines.forEach((l, i) => { s += `<line x1=\"${sx(0)}\" y1=\"${sy(l[0])}\" x2=\"${sx(tmax)}\" y2=\"${sy(l[1])}\" stroke=\"#c8352b\" stroke-width=\"3\"/>`; if (lines.length > 1) s += `<text x=\"${sx(tmax) - 10}\" y=\"${sy(l[1]) - 6}\" fill=\"#c8352b\" font-weight=\"700\">${i + 1}<\/text>`; });\n  return s + '<\/svg>';\n}\n\n/* ═════════════════════ тақырыптар: конспект + ұқсас есептер ═════════════════════ */\nconst T = {\n mkt: { title: 'Молекулалық-кинетикалық теория, ішкі энергия', q: [1, 2],\n  c: `<p><b>МКТ-ның негізгі қағидалары:<\/b> 1) заттар молекулалардан тұрады; 2) молекулалар үздіксіз, ретсіз (жылулық) қозғалыста; 3) молекулалар бір-бірімен тартылады және тебіледі.<\/p>\n   <p><b>Диффузия<\/b> — молекулалардың жылулық қозғалысы салдарынан заттардың өздігінен араласуы. Жылдамдығы: газ &gt; сұйық &gt; қатты дене. Температура артқанда диффузия жылдамдайды.<\/p>\n   <p><b>Ішкі энергия<\/b> — барлық молекулалардың кинетикалық және потенциалдық энергияларының қосындысы. Молекулалар ешқашан тоқтамайтындықтан, ішкі энергия ешқашан нөлге тең болмайды. Оны <b>жылу беру<\/b> немесе <b>жұмыс жасау<\/b> арқылы өзгертуге болады.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> ішкі энергияны дененің механикалық энергиясымен (жылдамдығы, биіктігі) шатастыру; «сұйық пен газда бірдей» деп жауап беру.<\/div>`,\n  g: [\n   () => { const B = [['Диффузия ең баяу қай күйде жүреді?', 'қатты денеде', ['газда', 'сұйықта', 'барлығында бірдей', 'вакуумда']],\n       ['Температура артқанда диффузия қалай өзгереді?', 'жылдамдайды', ['баяулайды', 'өзгермейді', 'тоқтайды', 'алдымен баяулап, сосын жылдамдайды']],\n       ['Дененің ішкі энергиясын қалай өзгертуге болады?', 'жылу беру немесе жұмыс жасау арқылы', ['тек денені жоғары көтеру арқылы', 'тек жылдамдығын арттыру арқылы', 'оны өзгерту мүмкін емес', 'тек массасын азайту арқылы']],\n       ['Ішкі энергия неге тәуелді?', 'температураға және агрегаттық күйге', ['дененің биіктігіне', 'дененің жылдамдығына', 'дененің пішініне', 'тек түсіне']],\n       ['Иіс бөлмеге неге тез таралады?', 'газдардағы диффузия жылдам жүретіндіктен', ['ауа қысымы жоғары болғандықтан', 'молекулалар тыныштықта тұрғандықтан', 'ауырлық күші әсер еткендіктен', 'жарық әсерінен']]];\n     const [q, r, w] = pick(B); return { q, ...txtOpts(r, w), sol: ['МКТ: молекулалар үздіксіз жылулық қозғалыста; газда ең еркін, қатты денеде ең баяу.', `Жауабы: <b>${r}<\/b>.`] }; }\n  ] },\n kin: { title: 'Жылдамдық, орташа жылдамдық, салыстырмалы қозғалыс', q: [3, 5, 16, 18, 26],\n  c: `<div class=\"fbox\"><i>v<\/i> = <i>s<\/i>/<i>t<\/i> &nbsp;&nbsp; 1 м/с = 3,6 км/сағ &nbsp;&nbsp; <i>v<\/i><sub>орт<\/sub> = ${fr('<i>s<\/i><sub>барлық<\/sub>', '<i>t<\/i><sub>барлық<\/sub>')}<\/div>\n   <p><b>Орташа жылдамдық<\/b> — бүкіл жолды бүкіл уақытқа бөлу. Ол жылдамдықтардың орта арифметикасына тең <b>емес<\/b>! Жол екі тең бөлікке бөлінсе: <i>v<\/i><sub>орт<\/sub> = 2<i>v<\/i><sub>1<\/sub><i>v<\/i><sub>2<\/sub>/(<i>v<\/i><sub>1<\/sub> + <i>v<\/i><sub>2<\/sub>).<\/p>\n   <p><b>Өзендегі қайық:<\/b> ағыспен — <i>v<\/i> + <i>u<\/i>, ағысқа қарсы — <i>v<\/i> − <i>u<\/i> (<i>v<\/i> — суға қатысты жылдамдық, <i>u<\/i> — ағыс).<\/p>\n   <div class=\"ex\"><b>Кешігуді жою:<\/b> алдымен кесте бойынша уақытты тап (<i>s<\/i>/<i>v<\/i>), одан кешігуді азайт, сосын жаңа жылдамдық = <i>s<\/i>/(жаңа уақыт).<\/div>\n   <div class=\"warn\"><b>Жиі қате:<\/b> км/сағ пен м-ді аралас қолдану; минутты сағатқа айналдырмау (30 мин = 0,5 сағ); орташа жылдамдықты (<i>v<\/i><sub>1<\/sub> + <i>v<\/i><sub>2<\/sub>)/2 деп алу.<\/div>`,\n  g: [\n   () => { const v = pick([36, 54, 72, 90, 108]), vs = v / 3.6, t = pick([20, 30, 40, 50, 60, 80, 120]), s = vs * t; const o = numOpts(t, [s / v, s / (v * 3.6), t * 2, t / 2], 'с', 1); return { q: `Автомобиль ${v} км/сағ жылдамдықпен қозғалып, ${fmt(s, 0)} м жол жүрді. Қанша уақыт кетті?`, ...o, sol: [`${v} км/сағ = ${v}/3,6 = ${fmt(vs)} м/с.`, `<i>t<\/i> = ${fmt(s, 0)}/${fmt(vs)} = <b>${fmt(t, 1)} с<\/b>.`] }; },\n   () => { const u = R(2, 6), w = pick([6, 8, 10, 12, 15]), tm = pick([20, 30, 40, 60]), s = w * tm / 60, up = Math.random() < .5; const ans = up ? w + u : w - u;\n     if (!up && ans <= 0) return T.kin.g[1](); const o = numOpts(ans, [w, up ? w - u : w + u, w + 2 * u, 2 * w], 'км/сағ', 1);\n     return { q: `Моторлы қайық өзен ағысымен ${up ? 'қарсы' : 'бағыттас'} ${fmt(s, 1)} км жолды ${tm} минутта жүрді. Ағыс жылдамдығы ${u} км/сағ. Қайықтың суға қатысты жылдамдығы қандай?`, ...o,\n       sol: [`Жағаға қатысты: ${fmt(s, 1)} км / ${fmt(tm / 60, 3)} сағ = ${w} км/сағ.`, up ? `Ағысқа қарсы: <i>v<\/i> − ${u} = ${w} ⇒ <i>v<\/i> = <b>${ans} км/сағ<\/b>.` : `Ағыспен: <i>v<\/i> + ${u} = ${w} ⇒ <i>v<\/i> = <b>${ans} км/сағ<\/b>.`] }; },\n   () => { const [v1, v2] = pick([[40, 60], [30, 60], [60, 90], [40, 120], [20, 30], [36, 54]]); const half = Math.random() < .5;\n     if (half) { const ans = 2 * v1 * v2 / (v1 + v2); const o = numOpts(ans, [(v1 + v2) / 2, v1 * v2 / (v1 + v2), Math.sqrt(v1 * v2) + 3, (v1 + v2)], 'км/сағ', 1); return { q: `Автомобиль жолдың бірінші жартысын ${v1} км/сағ, екінші жартысын ${v2} км/сағ жылдамдықпен жүрді. Орташа жылдамдығы қандай?`, ...o, sol: [`<i>t<\/i> = <i>s<\/i>/(2·${v1}) + <i>s<\/i>/(2·${v2}).`, `<i>v<\/i><sub>орт<\/sub> = ${fr(`2·${v1}·${v2}`, `${v1} + ${v2}`)} = <b>${fmt(ans, 1)} км/сағ<\/b>.`] }; }\n     const vavg = 3 / (1 / v1 + 2 / v2); const o = numOpts(vavg, [(v1 + 2 * v2) / 3, (v1 + v2) / 2, 2 * v1 * v2 / (v1 + v2), vavg + 8], 'км/сағ', 1);\n     return { q: `Велосипедші жолдың алғашқы үштен бір бөлігін ${v1} км/сағ, қалған үштен екі бөлігін ${v2} км/сағ жылдамдықпен жүрді. Орташа жылдамдығы қандай?`, ...o, sol: [`Жол 3<i>s<\/i>: <i>t<\/i> = <i>s<\/i>/${v1} + 2<i>s<\/i>/${v2}.`, `<i>v<\/i><sub>орт<\/sub> = 3<i>s<\/i>/<i>t<\/i> = <b>${fmt(vavg, 1)} км/сағ<\/b>.`] }; },\n   () => { const v = pick([60, 72, 80, 90]), s = pick([20, 30, 40, 60]), tPlan = s / v * 60, d = pick([3, 4, 5, 6, 8, 10].filter(x => x < tPlan - 4)); const vn = s / ((tPlan - d) / 60), dv = vn - v;\n     const o = numOpts(dv, [vn, s / (d / 60) - v, dv / 2, s / ((tPlan + d) / 60)], 'км/сағ', 1);\n     return { q: `Пойыз ${d} минутқа кешігіп келеді. Келу пунктіне ${s} км қалғанда машинист жылдамдығын ${v} км/сағ-тан арттырып, кешігуді жойды. Жылдамдық қаншаға өсті?`, ...o, sol: [`Кесте бойынша: ${s}/${v} сағ = ${fmt(tPlan, 1)} мин. Жаңа уақыт: ${fmt(tPlan - d, 1)} мин.`, `<i>v<\/i> = ${s}/(${fmt(tPlan - d, 1)}/60) ≈ ${fmt(vn, 1)} км/сағ ⇒ өсімі <b>${fmt(dv, 1)} км/сағ<\/b>.`] }; }\n  ] },\n meas: { title: 'Өлшеу құралдары, бөлік құны, қателік', q: [4],\n  c: `<div class=\"fbox\">бөлік құны = ${fr('шкала аралығы', 'бөліктер саны')} &nbsp;&nbsp; өлшеу қателігі = ½ · бөлік құны<\/div>\n   <p>Бөлік құнын табу үшін сандары жазылған екі көрші сызықтың айырмасын олардың арасындағы бөліктер санына бөлеміз. Өлшеу нәтижесі: <i>x<\/i> = <i>x<\/i><sub>өлш<\/sub> ± Δ<i>x<\/i>.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> бөлік құнын қателікпен шатастыру (қателік — оның жартысы); см мен мм-ді шатастыру.<\/div>`,\n  g: [\n   () => { const [L, N] = pick([[20, 40], [30, 60], [10, 20], [50, 100], [15, 30], [25, 100], [40, 80]]), div = L / N * 10; const ask = pick(['err', 'div']); const ans = ask === 'err' ? div / 2 : div;\n     const o = numOpts(ans, ask === 'err' ? [div, div / 4, L / N, div * 2] : [div / 2, L / N, div * 2, N / L], 'мм', 2);\n     return { q: `Ұзындығы ${L} см сызғыш ${N} бөлікке бөлінген. ${ask === 'err' ? 'Өлшеу қателігі' : 'Бөлік құны'} неге тең?`, ...o, sol: [`Бөлік құны: ${L} см / ${N} = ${fmt(L / N, 2)} см = ${fmt(div, 2)} мм.`, ask === 'err' ? `Қателік — жартысы: <b>${fmt(div / 2, 2)} мм<\/b>.` : `Жауабы: <b>${fmt(div, 2)} мм<\/b>.`] }; },\n   () => { const [a, b, n] = pick([[20, 40, 10], [0, 50, 5], [100, 200, 10], [10, 20, 5], [0, 1, 10]]); const div = (b - a) / n; const o = numOpts(div, [div / 2, (b - a), n / (b - a), div * 2], 'мл', 2); return { q: `Мензуркадағы сандары жазылған екі көрші сызық ${a} мл және ${b} мл, олардың арасында ${n} бөлік бар. Мензурканың бөлік құны қандай?`, ...o, sol: [`(${b} − ${a}) / ${n} = <b>${fmt(div, 2)} мл<\/b>.`] }; }\n  ] },\n dens: { title: 'Тығыздық, масса, көлем, қуыс денелер', q: [6, 7, 9, 20, 21],\n  c: `<div class=\"fbox\"><i>ρ<\/i> = ${fr('<i>m<\/i>', '<i>V<\/i>')} &nbsp;&nbsp; 1 г/см³ = 1000 кг/м³ &nbsp;&nbsp; 1 см³ = 10<sup>−6<\/sup> м³<\/div>\n   <p><b>Кубтың қабырғасы <i>k<\/i> есе артса<\/b>, көлемі мен массасы <i>k<\/i><sup>3<\/sup> есе артады.<\/p>\n   <p><b>Қуысы бар дене:<\/b> заттың өз көлемі <i>V<\/i><sub>з<\/sub> = <i>m<\/i>/<i>ρ<\/i>; қуыс = <i>V<\/i> − <i>V<\/i><sub>з<\/sub>. Ауа қуыстары <i>p<\/i> % болса: <i>ρ<\/i><sub>орт<\/sub> = (1 − <i>p<\/i>)<i>ρ<\/i>.<\/p>\n   <p><b>Қоспа:<\/b> <i>ρ<\/i> = (<i>m<\/i><sub>1<\/sub> + <i>m<\/i><sub>2<\/sub>)/(<i>V<\/i><sub>1<\/sub> + <i>V<\/i><sub>2<\/sub>). Массалары тең болса: <i>ρ<\/i> = 2<i>ρ<\/i><sub>1<\/sub><i>ρ<\/i><sub>2<\/sub>/(<i>ρ<\/i><sub>1<\/sub> + <i>ρ<\/i><sub>2<\/sub>); көлемдері тең болса: (<i>ρ<\/i><sub>1<\/sub> + <i>ρ<\/i><sub>2<\/sub>)/2.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> қабырға 2 есе артқанда массаны 2 есе арттыру (8 есе болу керек!); г/см³ пен кг/м³-ті шатастыру.<\/div>`,\n  g: [\n   () => { const m = pick([100, 150, 200, 250, 50]), k = pick([2, 3]), M = m * k ** 3; const o = numOpts(M / 1000, [m * k / 1000, m * k * k / 1000, M / 100, m * (k + 1) / 1000], 'кг', 3); return { q: `Мыс кубтың массасы ${m} г. Қабырғасы ${k} есе үлкен мыс кубтың массасы қандай?`, ...o, sol: [`Көлем ${k}<sup>3<\/sup> = ${k ** 3} есе артады.`, `<i>m<\/i> = ${m}·${k ** 3} = ${M} г = <b>${fmt(M / 1000, 3)} кг<\/b>.`] }; },\n   () => { const rho = pick([1.5, 2, 2.5, 2.7, 3]), V1 = R(2, 9) * 5, V2 = R(2, 9) * 5, M = rho * (V1 + V2); const o = numOpts(rho * 1000, [M / V1 * 1000, M / (V1 * V2) * 1000, rho * 100, M * 1000 / Math.max(V1, V2)], 'кг/м³', 0); return { q: `Көлемдері ${V1} см³ және ${V2} см³ бір заттан жасалған екі үлгінің жалпы массасы ${fmt(M, 1)} г. Заттың тығыздығы қандай?`, ...o, sol: [`<i>V<\/i> = ${V1 + V2} см³; <i>ρ<\/i> = ${fmt(M, 1)}/${V1 + V2} = ${fmt(rho, 2)} г/см³ = <b>${fmt(rho * 1000, 0)} кг/м³<\/b>.`] }; },\n   () => { const p = pick([10, 20, 25, 30, 40]), [nm, r] = pick([['кварц', 2500], ['кірпіш', 1800], ['шыны', 2600], ['мәрмәр', 2700]]), ans = r * (1 - p / 100); const o = numOpts(ans, [r * p / 100, r * (1 + p / 100), r - p, r / (1 - p / 100)], 'кг/м³', 0); return { q: `Көлемінің ${p} %-ы ауа қуыстары болатын ${nm}тың орташа тығыздығы қандай? Тұтас ${nm}тың тығыздығы ${r} кг/м³.`, ...o, sol: [`Көлемнің ${100 - p} %-ын зат алады.`, `<i>ρ<\/i> = ${fmt(1 - p / 100, 2)}·${r} = <b>${fmt(ans, 0)} кг/м³<\/b>.`] }; },\n   () => { const [nm, r] = pick([['болат', 7.8], ['алюминий', 2.7], ['мыс', 8.9]]), Vs = R(4, 12) * 50, cav = R(1, 6) * 20, m = r * Vs; const o = numOpts(cav, [Vs, Vs + cav, cav * 2, m / 1000], 'см³', 0); return { q: `Массасы ${fmt(m / 1000, 3)} кг ${nm} бұйымның сыртқы көлемі ${Vs + cav} см³. Ішіндегі қуыстың көлемі қандай? <i>ρ<\/i> = ${fmt(r * 1000, 0)} кг/м³.`, ...o, sol: [`Заттың көлемі: ${fmt(m, 0)} г / ${fmt(r, 1)} г/см³ = ${Vs} см³.`, `Қуыс: ${Vs + cav} − ${Vs} = <b>${cav} см³<\/b>.`] }; },\n   () => { const [r1, r2] = pick([[400, 600], [800, 1200], [1000, 1500], [600, 900], [500, 1000]]), eq = pick(['m', 'V']); const ans = eq === 'm' ? 2 * r1 * r2 / (r1 + r2) : (r1 + r2) / 2; const other = eq === 'm' ? (r1 + r2) / 2 : 2 * r1 * r2 / (r1 + r2);\n     const o = numOpts(ans, [other, r1 + r2, Math.sqrt(r1 * r2) + 7, r2 - r1], 'кг/м³', 0); return { q: `Тығыздықтары ${r1} кг/м³ және ${r2} кг/м³ екі ұнтақты бірдей ${eq === 'm' ? 'массада' : 'көлемде'} алып араластырды. Қоспаның тығыздығы қандай?`, ...o, sol: [eq === 'm' ? `<i>ρ<\/i> = ${fr(`2·${r1}·${r2}`, `${r1} + ${r2}`)}` : `<i>ρ<\/i> = (${r1} + ${r2})/2`, `= <b>${fmt(ans, 0)} кг/м³<\/b>.`] }; }\n  ] },\n press: { title: 'Қысым, сұйықтың қысымы, Паскаль заңы', q: [8, 12],\n  c: `<div class=\"fbox\"><i>p<\/i> = ${fr('<i>F<\/i>', '<i>S<\/i>')} &nbsp;&nbsp; <i>p<\/i> = <i>ρgh<\/i> &nbsp;&nbsp; ашық ыдыста: <i>p<\/i> = <i>P<\/i><sub>0<\/sub> + <i>ρgh<\/i><\/div>\n   <p>Сұйықтың қысымы тек тығыздық пен <b>тереңдікке<\/b> тәуелді (гидростатикалық парадокс): деңгейі бірдей ыдыстардың түбінде қысым бірдей, ыдыстың пішіні маңызды емес.<\/p>\n   <p><b>Паскаль заңы:<\/b> сұйыққа (газға) түсірілген қысым барлық бағытта өзгеріссіз беріледі — сондықтан атмосфералық қысым <i>P<\/i><sub>0<\/sub> әр тереңдіктегі қысымға қосылады.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> тереңдікті ыдыстың түбінен өлшеу (бетінен өлшеу керек!); ашық ыдыста <i>P<\/i><sub>0<\/sub>-ді ұмыту; см-ді м-ге аудармау.<\/div>`,\n  g: [\n   () => { const [nm, r] = pick([['су', 1000], ['керосин', 800], ['спирт', 800], ['теңіз суы', 1030]]), a = R(2, 20) * 5, p0 = 100; const ans = p0 + r * 10 * a / 100 / 1000; const o = numOpts(ans, [r * 10 * a / 100 / 1000, p0 + r * 10 * a / 1000, p0, p0 + r * a / 100 / 1000], 'кПа', 2); return { q: `Ашық ыдыстағы ${nm}та (<i>ρ<\/i> = ${r} кг/м³) кубик тұр, оның жоғарғы беті сұйық бетінен ${a} см тереңдікте. Атмосфералық қысым 100 кПа. Кубиктің жоғарғы бетіне түсетін қысым қандай? <i>g<\/i> = 10 Н/кг.`, ...o, sol: [`<i>ρgh<\/i> = ${r}·10·${fmt(a / 100)} = ${fmt(r * 10 * a / 100, 0)} Па.`, `<i>p<\/i> = <i>P<\/i><sub>0<\/sub> + <i>ρgh<\/i> = <b>${fmt(ans, 2)} кПа<\/b>.`] }; },\n   () => { const h = R(5, 60), [nm, r] = pick([['су', 1000], ['сынап', 13600], ['керосин', 800]]), p = r * 10 * h / 100; const o = numOpts(p, [r * 10 * h, r * h / 100, p / 10, p * 2], 'Па', 0); return { q: `${nm[0].toUpperCase() + nm.slice(1)} бағанының биіктігі ${h} см. Оның ыдыс түбіне түсіретін қысымы қандай (атмосфералық қысымсыз)? <i>ρ<\/i> = ${r} кг/м³, <i>g<\/i> = 10 Н/кг.`, ...o, sol: [`<i>p<\/i> = <i>ρgh<\/i> = ${r}·10·${fmt(h / 100)} = <b>${fmt(p, 0)} Па<\/b>.`] }; },\n   () => { const o = txtOpts('<i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', ['<i>p<\/i><sub>1<\/sub> &gt; <i>p<\/i><sub>2<\/sub> &gt; <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &lt; <i>p<\/i><sub>2<\/sub> &lt; <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>2<\/sub> &gt; <i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>3<\/sub>', 'анықтауға болмайды']); return { q: 'Пішіндері әр түрлі үш ыдысқа бірдей деңгейге дейін керосин құйылған. 1-ыдыстағы керосиннің көлемі ең көп, 3-ыдыстағысы ең аз. Ыдыстардың түбіндегі қысымды салыстырыңыз.', ...o, sol: ['<i>p<\/i> = <i>ρgh<\/i> — сұйық бірдей, биіктік бірдей.', 'Көлем мен пішін маңызды емес ⇒ <b>қысымдар тең<\/b>.'] }; }\n  ] },\n force: { title: 'Ауырлық күші, салмақ, үйкеліс күші', q: [10, 14, 24],\n  c: `<div class=\"fbox\"><i>F<\/i><sub>а<\/sub> = <i>mg<\/i> &nbsp;&nbsp; <i>P<\/i> = <i>mg<\/i> (тірек тыныштықта) &nbsp;&nbsp; <i>F<\/i><sub>үйк<\/sub> = <i>μN<\/i> = <i>μmg<\/i><\/div>\n   <p><b>Салмақ<\/b> — дененің тірекке немесе аспаға әсер ететін күші. Массаны көлем мен тығыздықтан табамыз: <i>m<\/i> = <i>ρV<\/i>.<\/p>\n   <p><b>Тыныштық үйкелісі<\/b> түсірілген күшке тең және одан аспайды: дене қозғалмаса, <i>F<\/i><sub>үйк<\/sub> = <i>F<\/i>. Дене сырғанаса ғана <i>F<\/i><sub>үйк<\/sub> = <i>μmg<\/i>.<\/p>\n   <div class=\"ex\"><b>Мысал.<\/b> <i>μmg<\/i> = 15 Н. 10 Н күшпен итерсек — дене орнында, үйкеліс 10 Н. 20 Н-мен итерсек — сырғанайды, үйкеліс 15 Н.<\/div>\n   <div class=\"warn\"><b>Жиі қате:<\/b> үйкеліс күшін әрдайым <i>μmg<\/i> деп алу; см³-ті м³-ке аудармау (1 см³ = 10<sup>−6<\/sup> м³).<\/div>`,\n  g: [\n   () => { const [nm, r] = pick([['алюминий', 2700], ['болат', 7800], ['мыс', 8900], ['мұз', 900]]), V = pick([50, 100, 200, 250, 500]); const P = r * V * 1e-6 * 10; const o = numOpts(P, [P * 10, P / 10, r * V * 10, r * V * 1e-6], 'Н', 3); return { q: `Көлемі ${V} см³ ${nm} дененің үстелге түсіретін салмағы қандай? <i>ρ<\/i> = ${r} кг/м³, <i>g<\/i> = 10 Н/кг.`, ...o, sol: [`<i>m<\/i> = <i>ρV<\/i> = ${r}·${V}·10<sup>−6<\/sup> = ${fmt(r * V * 1e-6, 4)} кг.`, `<i>P<\/i> = <i>mg<\/i> = <b>${fmt(P, 3)} Н<\/b>.`] }; },\n   () => { const m = pick([5, 10, 12, 15, 20]), mu = pick([.2, .25, .3, .4, .5]), g = pick([2, 4, 6, 8, 12, 15]), F = mu * m * g; const o = numOpts(g, [F / m, F * mu / m, F / mu, mu * m / F * 10], 'Н/кг', 2); return { q: `Бір ғаламшарда массасы ${m} кг жүкті үйкеліс коэффициенті ${fmt(mu)} бет бойымен бірқалыпты сүйреу үшін ${fmt(F, 2)} Н күш керек. Ғаламшардағы еркін түсу үдеуі қандай?`, ...o, sol: [`<i>F<\/i> = <i>μmg<\/i> ⇒ <i>g<\/i> = <i>F<\/i>/(<i>μm<\/i>) = ${fmt(F, 2)}/(${fmt(mu)}·${m}) = <b>${fmt(g, 2)} Н/кг<\/b>.`] }; },\n   () => { const m = pick([2, 4, 5, 8, 10]), mu = pick([.2, .3, .4, .5]), Fm = mu * m * 10; const F1 = Math.max(1, Math.round(Fm * R(3, 8) / 10)), F2 = Math.round(Fm * R(13, 20) / 10);\n     const f = (a, b) => `${fmt(a)} Н, ${fmt(b)} Н`; const o = txtOpts(f(F1, Fm), [f(Fm, Fm), f(F1, F2), f(Fm, F2), f(0, Fm)]);\n     return { q: `Массасы ${m} кг жәшік еденде жатыр, үйкеліс коэффициенті ${fmt(mu)}. Оны алдымен ${F1} Н, содан кейін ${F2} Н горизонталь күшпен итерді. Әр жағдайда үйкеліс күші қандай? <i>g<\/i> = 10 Н/кг.`, ...o, sol: [`Ең үлкен тыныштық үйкелісі: <i>μmg<\/i> = ${fmt(Fm)} Н.`, `${F1} Н &lt; ${fmt(Fm)} Н — жәшік қозғалмайды, үйкеліс = ${F1} Н. ${F2} Н &gt; ${fmt(Fm)} Н — сырғанайды, үйкеліс = ${fmt(Fm)} Н.`, `Жауабы: <b>${f(F1, Fm)}<\/b>.`] }; }\n  ] },\n graph: { title: 'Қозғалыс графиктері x(t)', q: [11],\n  c: `<p><b><i>x<\/i>(<i>t<\/i>) графигі түзу<\/b> болса — қозғалыс <b>бірқалыпты<\/b>, жылдамдық тұрақты: <i>v<\/i> = Δ<i>x<\/i>/Δ<i>t<\/i> (графиктің көлбеулігі). Параллель түзулер — жылдамдықтары бірдей денелер.<\/p>\n   <p>Қисық (парабола) <i>x<\/i>(<i>t<\/i>) графигі — үдемелі қозғалыс. Горизонталь түзу — дене тыныштықта.<\/p>\n   <div class=\"fbox\"><i>x<\/i> = <i>x<\/i><sub>0<\/sub> + <i>vt<\/i><\/div>\n   <div class=\"warn\"><b>Жиі қате:<\/b> <i>x<\/i>(<i>t<\/i>) мен <i>v<\/i>(<i>t<\/i>) графиктерін шатастыру: көлбеу түзу <i>x<\/i>(<i>t<\/i>)-да бірқалыпты, ал <i>v<\/i>(<i>t<\/i>)-да үдемелі қозғалысты білдіреді. Жылдамдықты <i>x<\/i>/<i>t<\/i> деп есептеп, <i>x<\/i><sub>0<\/sub>-ді ұмыту.<\/div>`,\n  g: [\n   () => { const tm = pick([4, 5, 6]), x0 = R(0, 4), v = pick([1, 2, 3]) * (Math.random() < .3 && x0 > 0 ? 0 : 1) || 1, x1 = x0 + v * tm; const o = numOpts(v, [x1 / tm, x1, v * 2, (x1 - x0)], 'м/с', 2); return { q: `Графикте дененің координатасының уақытқа тәуелділігі берілген. Дененің жылдамдығы қандай?`, svg: xtSvg([[x0, x1]], tm, Math.ceil(x1 / 2) * 2 + 2), ...o, sol: [`Түзу — бірқалыпты қозғалыс. <i>v<\/i> = Δ<i>x<\/i>/Δ<i>t<\/i> = (${x1} − ${x0})/${tm}.`, `<i>v<\/i> = <b>${v} м/с<\/b>${x0 ? ` (бастапқы координата ${x0} м-ді азайтуды ұмытпа!)` : ''}.`] }; },\n   () => { const tm = 4, a = R(0, 3), b = R(0, 3), va = pick([1, 2]), vb = va + pick([1, 2]); const L = [[a, a + va * tm], [b, b + vb * tm]]; const o = txtOpts('2-дене жылдамырақ, екеуі де бірқалыпты', ['1-дене жылдамырақ, екеуі де бірқалыпты', 'жылдамдықтары бірдей', '2-дене үдемелі қозғалады', 'екеуі де тыныштықта']); return { q: 'Графикте екі дененің координаталарының уақытқа тәуелділігі берілген. Олардың қозғалысын салыстырыңыз.', svg: xtSvg(L, tm, Math.max(L[0][1], L[1][1]) + 2), ...o, sol: ['Екі график те түзу — қозғалыстар бірқалыпты.', `Көлбеулігі (жылдамдығы) үлкені — 2-түзу: ${vb} м/с &gt; ${va} м/с ⇒ <b>2-дене жылдамырақ<\/b>.`] }; }\n  ] },\n spring: { title: 'Серпімділік күші, Гук заңы, серіппелер', q: [13, 17, 23, 29],\n  c: `<div class=\"fbox\"><i>F<\/i> = <i>kx<\/i> &nbsp;&nbsp; <i>A<\/i> = <i>E<sub>p<\/sub><\/i> = ${fr('<i>kx<\/i><sup>2<\/sup>', 2)}<\/div>\n   <p>Бір жүк әр түрлі серіппелерде: салмағы бірдей, <i>k<\/i><sub>1<\/sub><i>x<\/i><sub>1<\/sub> = <i>k<\/i><sub>2<\/sub><i>x<\/i><sub>2<\/sub>. Созу жұмысы созылудың <b>квадратына<\/b> пропорционал: созылу 10 есе — жұмыс 100 есе.<\/p>\n   <p><b>Тізбектей жалғау:<\/b> екі серіппеге бірдей күш әсер етеді: <i>F<\/i> = <i>k<\/i><sub>1<\/sub><i>x<\/i><sub>1<\/sub> = <i>k<\/i><sub>2<\/sub><i>x<\/i><sub>2<\/sub>. Параллель жалғауда созылулары бірдей.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> кН/м-ді Н/м-ге (×1000), мм-ді м-ге аудармау; жұмысты созылуға тура пропорционал деп алу.<\/div>`,\n  g: [\n   () => { const k1 = pick([400, 500, 600, 800, 1000]), k2 = pick([200, 250, 400, 500, 1000].filter(x => x !== k1)), x1 = pick([5, 8, 10, 12, 15]), x2 = k1 * x1 / k2; const o = numOpts(x2, [k2 * x1 / k1, x1, x1 * k2 / 1000, x2 * 2], 'мм', 2); return { q: `Жүк қатаңдығы ${k1} Н/м серіппені ${x1} мм-ге созады. Дәл осы жүк қатаңдығы ${k2} Н/м серіппені қаншаға созады?`, ...o, sol: [`<i>F<\/i> = ${k1}·${fmt(x1 / 1000, 3)} = ${fmt(k1 * x1 / 1000, 2)} Н.`, `<i>x<\/i> = <i>F<\/i>/<i>k<\/i> = <b>${fmt(x2, 2)} мм<\/b>.`] }; },\n   () => { const x1 = pick([2, 4, 5]), n = pick([2, 3, 5, 10]), W1 = pick([.01, .02, .05, .1]), W2 = W1 * n * n; const o = numOpts(W2, [W1 * n, W1 * n * n * n, W1 * 2 * n, W2 / 10], 'Дж', 3); return { q: `Серіппені ${x1} мм-ге созу үшін ${fmt(W1)} Дж жұмыс керек. Оны ${x1 * n} мм-ге созу үшін қандай жұмыс керек?`, ...o, sol: [`Созылу ${n} есе артты ⇒ жұмыс ${n}<sup>2<\/sup> = ${n * n} есе артады.`, `<i>A<\/i> = ${fmt(W1)}·${n * n} = <b>${fmt(W2, 3)} Дж<\/b>.`] }; },\n   () => { const k1 = pick([10, 15, 20, 30]), k2 = pick([20, 25, 40, 60].filter(x => x !== k1)), x1 = pick([2, 4, 5, 6]), F = k1 * x1, x2 = F / k2; const f = (a, b) => `${fmt(a)} Н, ${fmt(b, 2)} мм`; const o = txtOpts(f(F, x2), [f(F, x1), f(k2 * x1, x1), f(F, k2 * x1 / k1), f(F / 2, x2), f(F * 2, x2), f(k2 * x1, x2), f(F, x2 * 2)]); return { q: `Қатаңдықтары ${k1} кН/м және ${k2} кН/м екі серіппе тізбектей жалғанған. Бірінші серіппенің ұзаруы ${x1} мм. Жүйені қандай күшпен созады және екінші серіппенің ұзаруы қандай?`, ...o, sol: [`<i>F<\/i> = ${k1}000·${fmt(x1 / 1000, 3)} = ${F} Н (тізбектей — күш бірдей).`, `<i>x<\/i><sub>2<\/sub> = ${F}/${k2}000 = ${fmt(x2 / 1000, 5)} м ⇒ <b>${f(F, x2)}<\/b>.`] }; },\n   () => { const k1 = pick([10, 20, 25]), k2 = pick([20, 40, 50].filter(x => x !== k1)), x1 = pick([4, 5, 6, 8]), x2 = pick([2, 3, 4, 5]); const F1 = k1 * x1, F2 = k2 * x2; const a1 = F2 / k1, a2 = F1 / k2; const f = (a, b) => `${fmt(a, 2)} мм, ${fmt(b, 2)} мм`; const o = txtOpts(f(a1, a2), [f(x2, x1), f(a2, a1), f(x1, x2), f(a1 * 2, a2), f(a1, a2 * 2), f(a1 / 2, a2 / 2), f(x1 * 2, x2 / 2), f(a1 + 1, a2 + 1)]); return { q: `Қатаңдықтары ${k1} кН/м және ${k2} кН/м серіппелер ілінген жүктердің әсерінен сәйкесінше ${x1} мм және ${x2} мм созылды. Жүктердің орнын ауыстырса, серіппелердің созылуы қандай болады?`, ...o, sol: [`<i>F<\/i><sub>1<\/sub> = ${F1} Н, <i>F<\/i><sub>2<\/sub> = ${F2} Н.`, `<i>x<\/i><sub>1<\/sub>′ = ${F2}/${k1} = ${fmt(a1, 2)} мм; <i>x<\/i><sub>2<\/sub>′ = ${F1}/${k2} = ${fmt(a2, 2)} мм.`] }; }\n  ] },\n heat: { title: 'Жылу мөлшері, меншікті жылусыйымдылық, булану', q: [15, 25],\n  c: `<div class=\"fbox\"><i>Q<\/i> = <i>cm<\/i>Δ<i>t<\/i> &nbsp;&nbsp; <i>c<\/i> = ${fr('<i>Q<\/i>', '<i>m<\/i>Δ<i>t<\/i>')} &nbsp;&nbsp; <i>Q<\/i> = <i>Lm<\/i> (булану) &nbsp;&nbsp; <i>Q<\/i> = <i>Pt<\/i><\/div>\n   <p>Плитаның қуаты тұрақты болса, берілген жылу уақытқа пропорционал. Сондықтан уақыттардың қатынасы жылу мөлшерлерінің қатынасына тең: τ<sub>2<\/sub>/τ<sub>1<\/sub> = <i>Q<\/i><sub>2<\/sub>/<i>Q<\/i><sub>1<\/sub> — масса қысқарады.<\/p>\n   <div class=\"ex\"><b>Мысал.<\/b> Суды 10 °C-тан 100 °C-қа дейін қыздыруға 10 мин кетсе, буландыруға: 10·<i>L<\/i>/(<i>c<\/i>·90) ≈ 60 мин.<\/div>\n   <div class=\"warn\"><b>Жиі қате:<\/b> формуладан шаманы өрнектегенде бөлшекті қате аудару; температура айырмасын (Δ<i>t<\/i>) емес, соңғы температураны алу.<\/div>`,\n  g: [\n   () => { const ask = pick(['m', 't']); if (ask === 'm') { const o = txtOpts(fr('<i>Q<\/i>', '<i>c<\/i>Δ<i>t<\/i>'), ['<i>Qc<\/i>Δ<i>t<\/i>', fr('<i>c<\/i>Δ<i>t<\/i>', '<i>Q<\/i>'), fr('<i>Q<\/i>Δ<i>t<\/i>', '<i>c<\/i>'), fr('<i>Qc<\/i>', 'Δ<i>t<\/i>')]); return { q: 'Дене <i>Q<\/i> жылу алып, температурасы Δ<i>t<\/i>-ға артты. Заттың меншікті жылусыйымдылығы <i>c<\/i>. Дененің массасы қандай?', ...o, sol: [`<i>Q<\/i> = <i>cm<\/i>Δ<i>t<\/i> ⇒ <i>m<\/i> = <b>${fr('<i>Q<\/i>', '<i>c<\/i>Δ<i>t<\/i>')}<\/b>.`] }; }\n     const o = txtOpts(fr('<i>Q<\/i>', '<i>cm<\/i>'), ['<i>Qcm<\/i>', fr('<i>cm<\/i>', '<i>Q<\/i>'), fr('<i>Qm<\/i>', '<i>c<\/i>'), fr('<i>Qc<\/i>', '<i>m<\/i>')]); return { q: 'Массасы <i>m<\/i> денеге <i>Q<\/i> жылу берілді, меншікті жылусыйымдылығы <i>c<\/i>. Температурасы қаншаға артады?', ...o, sol: [`Δ<i>t<\/i> = <b>${fr('<i>Q<\/i>', '<i>cm<\/i>')}<\/b>.`] }; },\n   () => { const t0 = pick([10, 20, 25, 30, 40]), tau = pick([5, 8, 10, 12, 15]), L = 2.26e6, c = 4200, T2 = tau * L / (c * (100 - t0)); const o = numOpts(T2, [tau * L / (c * 100), tau * c * (100 - t0) / L, tau, T2 + tau], 'мин', 1); return { q: `Плитадағы ${t0} °C су ${tau} минутта қайнады. Ол тағы қанша уақытта толық буға айналады? <i>L<\/i> = 2,26·10<sup>6<\/sup> Дж/кг, <i>c<\/i> = 4200 Дж/(кг·°C).`, ...o, sol: [`τ<sub>2<\/sub> = τ<sub>1<\/sub>·<i>L<\/i>/(<i>c<\/i>·${100 - t0}) = ${tau}·2,26·10<sup>6<\/sup>/(4200·${100 - t0}).`, `τ<sub>2<\/sub> ≈ <b>${fmt(T2, 1)} мин<\/b>.`] }; },\n   () => { const [nm, c] = pick([['су', 4200], ['алюминий', 920], ['мыс', 400], ['болат', 500]]), m = pick([.2, .5, 1, 2, 3]), dt = R(2, 8) * 10, Q = c * m * dt; const o = numOpts(Q / 1000, [c * m / 1000, c * dt / 1000, Q / 100, c * m * (dt + 20) / 1000], 'кДж', 2); return { q: `Массасы ${fmt(m)} кг ${nm}ды ${dt} °C-қа қыздыру үшін қанша жылу керек? <i>c<\/i> = ${c} Дж/(кг·°C).`, ...o, sol: [`<i>Q<\/i> = <i>cm<\/i>Δ<i>t<\/i> = ${c}·${fmt(m)}·${dt} = ${fmt(Q, 0)} Дж = <b>${fmt(Q / 1000, 2)} кДж<\/b>.`] }; }\n  ] },\n energy: { title: 'Кинетикалық энергия, жұмыс және жылу', q: [28],\n  c: `<div class=\"fbox\"><i>E<sub>k<\/sub><\/i> = ${fr('<i>mv<\/i><sup>2<\/sup>', 2)} &nbsp;&nbsp; <i>v<\/i> = <i>v<\/i><sub>0<\/sub> − <i>at<\/i> &nbsp;&nbsp; <i>Q<\/i> = Δ<i>E<sub>k<\/sub><\/i><\/div>\n   <p>Тежелу кезінде дененің бүкіл кинетикалық энергиясы үйкеліс арқылы жылуға (ішкі энергияға) айналады. Бастапқы жылдамдықты тоқтау уақыты мен үдеуден табамыз: <i>v<\/i><sub>0<\/sub> = <i>at<\/i>.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> тоннаны килограмға аудармау (1 т = 1000 кг); <i>v<\/i><sup>2<\/sup>-тың орнына <i>v<\/i> алу; ½ көбейткішін ұмыту.<\/div>`,\n  g: [\n   () => { const m = pick([200, 500, 800, 1000, 1500]), a = pick([.1, .2, .25, .5]), t = pick([40, 60, 80, 100]), v = a * t, Q = m * 1000 * v * v / 2; const o = numOpts(Q / 1e6, [m * 1000 * v * v / 1e6, m * 1000 * v / 2 / 1e6, m * v * v / 2 / 1e6, Q / 1e6 * 4], 'МДж', 2); return { q: `Массасы ${m} т пойыз ${fmt(a)} м/с² үдеумен тежеліп, ${t} с-тан кейін тоқтады. Қанша жылу бөлінді?`, ...o, sol: [`<i>v<\/i><sub>0<\/sub> = <i>at<\/i> = ${fmt(v)} м/с.`, `<i>Q<\/i> = <i>mv<\/i><sup>2<\/sup>/2 = ${m}000·${fmt(v)}<sup>2<\/sup>/2 = <b>${fmt(Q / 1e6, 2)} МДж<\/b>.`] }; },\n   () => { const m = pick([800, 1000, 1200, 1500]), vk = pick([36, 54, 72, 90]), v = vk / 3.6, Q = m * v * v / 2; const o = numOpts(Q / 1000, [m * vk * vk / 2 / 1000, m * v / 2 / 1000, m * v * v / 1000, Q / 1000 / 3.6], 'кДж', 1); return { q: `Массасы ${m} кг автомобиль ${vk} км/сағ жылдамдықтан тежеліп тоқтады. Тежегіштерде қанша жылу бөлінді?`, ...o, sol: [`<i>v<\/i> = ${vk}/3,6 = ${fmt(v)} м/с.`, `<i>Q<\/i> = <i>mv<\/i><sup>2<\/sup>/2 = <b>${fmt(Q / 1000, 1)} кДж<\/b>.`] }; }\n  ] },\n elec: { title: 'Электр өрісі, кернеулік, зарядталған бөлшек', q: [27, 30],\n  c: `<div class=\"fbox\"><i>E<\/i> = ${fr('<i>F<\/i>', '<i>q<\/i>')} &nbsp;&nbsp; <i>E<\/i> = <i>k<\/i>${fr('|<i>q<\/i>|', '<i>r<\/i><sup>2<\/sup>')} &nbsp;&nbsp; <i>a<\/i> = ${fr('<i>eE<\/i>', '<i>m<\/i>')} &nbsp;&nbsp; <i>s<\/i> = ${fr('<i>at<\/i><sup>2<\/sup>', 2)}<\/div>\n   <p>Кернеулік векторы оң зарядтан <b>сыртқа<\/b>, теріс зарядқа <b>қарай<\/b> бағытталады. Бірнеше заряд өрісі <b>векторлық<\/b> қосылады (суперпозиция).<\/p>\n   <p>Екі зарядтың ортасында: таңбалары әр түрлі — өрістер бір бағытта, модульдері қосылады; таңбалары бірдей — өрістер қарама-қарсы, азаяды.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> кернеуліктерді бағытын ескермей қосу; кВ/м-ді В/м-ге, нс-ты с-қа аудармау (1 нс = 10<sup>−9<\/sup> с).<\/div>`,\n  g: [\n   () => { const E = pick([50, 100, 150, 200, 300]), t = pick([.5, 1, 2]), a = 1.6e-19 * E * 1e3 / 9.1e-31, s = a * (t * 1e-9) ** 2 / 2; const sc = s * 100; const o = numOpts(sc, [sc * 2, sc / 2, a * t * 1e-9 * 100 / 1e6, sc * 1.6], 'см', 2); return { q: `Электрон кернеулігі ${E} кВ/м біртекті өрісте тыныштықтан қозғала бастады. ${fmt(t)} нс ішінде қанша жол жүреді? <i>e<\/i> = 1,6·10<sup>−19<\/sup> Кл, <i>m<\/i> = 9,1·10<sup>−31<\/sup> кг.`, ...o, sol: [`<i>a<\/i> = <i>eE<\/i>/<i>m<\/i> ≈ ${fmt(a / 1e16, 2)}·10<sup>16<\/sup> м/с².`, `<i>s<\/i> = <i>at<\/i><sup>2<\/sup>/2 ≈ <b>${fmt(sc, 2)} см<\/b>.`] }; },\n   () => { const q1 = pick([3, 4, 5, 6, 8]), q2 = pick([1, 2, 3].filter(x => x < q1)); const before = q1 + q2, after = q1 - q2, k = before / after;\n     const ans = Number.isInteger(k) ? `${k} есе кемиді` : `${fmt(k, 2)} есе кемиді`; const o = txtOpts(ans, [Number.isInteger(k) ? `${k} есе артады` : `${fmt(k, 2)} есе артады`, 'өзгермейді', `${fmt(q1 / q2, 2)} есе кемиді`, '2 есе артады', `${fmt(k + 1, 2)} есе кемиді`, '4 есе артады']);\n     return { q: `+${q1} мкКл және −${q2} мкКл нүктелік зарядтар бір-бірінен <i>l<\/i> қашықтықта тұр. Екінші заряд таңбасын өзгертіп, +${q2} мкКл болды. Олардың ортасындағы өріс кернеулігі қалай өзгереді?`, ...o, sol: [`Басында өрістер бір бағытта: <i>E<\/i> ∝ ${q1} + ${q2} = ${before}.`, `Кейін қарама-қарсы: <i>E<\/i> ∝ ${q1} − ${q2} = ${after}. Кернеулік <b>${ans}<\/b>.`] }; }\n  ] },\n cap: { title: 'Конденсаторлар, электр сыйымдылығы', q: [19, 22],\n  c: `<div class=\"fbox\"><i>C<\/i> = ${fr('<i>q<\/i>', '<i>U<\/i>')} &nbsp;&nbsp; параллель: <i>C<\/i> = <i>C<\/i><sub>1<\/sub> + <i>C<\/i><sub>2<\/sub> &nbsp;&nbsp; тізбектей: ${fr(1, '<i>C<\/i>')} = ${fr(1, '<i>C<\/i><sub>1<\/sub>')} + ${fr(1, '<i>C<\/i><sub>2<\/sub>')}<\/div>\n   <p>Конденсаторларды жалғау формулалары резисторларға <b>керісінше<\/b>: параллель жалғауда сыйымдылықтар қосылады.<\/p>\n   <p><b>Зарядты бөлісу:<\/b> зарядталған конденсаторды зарядталмағанмен параллель қосқанда заряд сақталады: <i>C<\/i><sub>1<\/sub><i>U<\/i><sub>1<\/sub> = (<i>C<\/i><sub>1<\/sub> + <i>C<\/i><sub>2<\/sub>)<i>U<\/i>.<\/p>\n   <div class=\"warn\"><b>Жиі қате:<\/b> параллель мен тізбектей жалғаудың формулаларын шатастыру (резисторлардағыдай деп ойлау).<\/div>`,\n  g: [\n   () => { const c = pick([2, 3, 4, 6, 10]), n = pick([2, 3, 4]), par = Math.random() < .5; const ans = par ? c * n : c / n; const o = numOpts(ans, [par ? c / n : c * n, c, c * n * n, c + n], 'мкФ', 2); return { q: `Сыйымдылығы ${c} мкФ ${n} бірдей конденсатор ${par ? 'параллель' : 'тізбектей'} жалғанған. Батареяның сыйымдылығы қандай?`, ...o, sol: [par ? `Параллель: <i>C<\/i> = ${n}·${c}` : `Тізбектей: <i>C<\/i> = ${c}/${n}`, `= <b>${fmt(ans, 2)} мкФ<\/b>.`] }; },\n   () => { const C1 = pick([1, 2, 3, 4, 5]), C2 = pick([1, 2, 3, 4, 6]), U1 = pick([100, 200, 300, 600]), U = C1 * U1 / (C1 + C2); const o = numOpts(U, [U1, U1 / 2, C2 * U1 / (C1 + C2), U1 * C1 / C2], 'В', 1); return { q: `Сыйымдылығы ${C1} мкФ конденсатор ${U1} В-қа дейін зарядталған. Оны ${C2} мкФ зарядталмаған конденсатормен параллель қосты. Кернеу қандай болады?`, ...o, sol: [`<i>q<\/i> = ${C1}·${U1} = ${C1 * U1} мкКл сақталады.`, `<i>U<\/i> = <i>q<\/i>/(<i>C<\/i><sub>1<\/sub> + <i>C<\/i><sub>2<\/sub>) = ${C1 * U1}/${C1 + C2} = <b>${fmt(U, 1)} В<\/b>.`] }; }\n  ] }\n};\n\n/* ═════════════════════ 2025–2026 олимпиадасының суреттері ═════════════════════ */\n(function () {\n  /* 6: бес сызғыш */\n  const rulers = [['A', 100, 50, 5, 'см'], ['B', 30, 10, 5, 'см'], ['C', 40, 20, 4, 'см'], ['D', 16, 8, 8, 'см'], ['E', 2, 1, 4, 'см']];\n  let r = '<svg width=\"300\" height=\"210\" viewBox=\"0 0 300 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Sans,sans-serif\" font-size=\"12\">';\n  rulers.forEach(([L, max, lab, sub, u], i) => {\n    const y = 14 + i * 40, x0 = 34, w = 200, n = max / lab * sub;\n    r += `<text x=\"4\" y=\"${y + 20}\" fill=\"#1f3a68\" font-weight=\"700\" font-family=\"PT Serif,serif\">${L})<\/text>`;\n    r += `<line x1=\"${x0}\" y1=\"${y + 22}\" x2=\"${x0 + w}\" y2=\"${y + 22}\" stroke=\"#1f3a68\" stroke-width=\"1.6\"/>`;\n    for (let k = 0; k <= n; k++) { const x = x0 + w * k / n, major = k % sub === 0; r += `<line x1=\"${x}\" y1=\"${y + 22}\" x2=\"${x}\" y2=\"${y + (major ? 10 : 15)}\" stroke=\"#1f3a68\" stroke-width=\"${major ? 1.6 : 1}\"/>`; if (major) r += `<text x=\"${x}\" y=\"${y + 7}\" text-anchor=\"middle\" fill=\"#1f3a68\">${k / sub * lab}<\/text>`; }\n    r += `<text x=\"${x0 + w + 8}\" y=\"${y + 9}\" fill=\"#1f3a68\">${u}<\/text>`;\n  });\n  SVG.rulers6 = r + '<\/svg>';\n\n  /* мензурка: x, ені, шкаласы, деңгейі */\n  function beaker(x, y, w, h, max, step, label, level, num, extra = '') {\n    const sy = v => y + h - v / max * h;\n    let s = `<rect x=\"${x}\" y=\"${sy(level)}\" width=\"${w}\" height=\"${y + h - sy(level)}\" fill=\"#cfe2f7\"/>`;\n    s += `<path d=\"M${x} ${y - 6} V${y + h} H${x + w} V${y - 6}\" fill=\"none\" stroke=\"#1f3a68\" stroke-width=\"2.2\"/>`;\n    for (let v = step; v <= max; v += step) { const big = v % (step * 5) === 0 || step >= 10; s += `<line x1=\"${x}\" y1=\"${sy(v)}\" x2=\"${x + (big ? 12 : 6)}\" y2=\"${sy(v)}\" stroke=\"#1f3a68\" stroke-width=\"${big ? 1.3 : .8}\"/>`; if (v % label === 0) s += `<text x=\"${x + 15}\" y=\"${sy(v) + 4}\" font-size=\"11\" fill=\"#1f3a68\">${v}<\/text>`; }\n    s += `<text x=\"${x + w - 18}\" y=\"${y - 10}\" font-size=\"10\" fill=\"#1f3a68\">мл<\/text>` + extra;\n    if (num) s += `<circle cx=\"${x + w - 9}\" cy=\"${y + h - 10}\" r=\"8\" fill=\"#fff\" stroke=\"#1f3a68\"/><text x=\"${x + w - 9}\" y=\"${y + h - 6}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1f3a68\">${num}<\/text>`;\n    return s;\n  }\n  SVG.beakers7 = `<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Sans,sans-serif\">\n    ${beaker(10, 24, 60, 160, 60, 2, 10, 30, '1')}${beaker(100, 24, 60, 160, 60, 2, 10, 50, '2')}${beaker(190, 24, 100, 160, 150, 10, 50, 30, '3')}<\/svg>`;\n\n  /* 16: гайкалар */\n  const nut = (cx, cy) => `<polygon points=\"${[0, 1, 2, 3, 4, 5].map(k => { const a = Math.PI / 3 * k; return (cx + 7 * Math.cos(a)).toFixed(1) + ',' + (cy + 7 * Math.sin(a)).toFixed(1); }).join(' ')}\" fill=\"#8a8a8a\" stroke=\"#2b2b2b\"/><circle cx=\"${cx}\" cy=\"${cy}\" r=\"2.6\" fill=\"#cfe2f7\" stroke=\"#2b2b2b\" stroke-width=\".8\"/>`;\n  const nutsAt = (x0, n) => { let s = ''; for (let i = 0; i < n; i++) s += nut(x0 + 9 + (i % 4) * 15, 176 - Math.floor(i / 4) * 13); return s; };\n  SVG.nuts16 = `<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Sans,sans-serif\">\n    ${beaker(20, 24, 72, 160, 50, 1, 10, 27, '', nutsAt(22, 5))}${beaker(170, 24, 72, 160, 50, 1, 10, 41, '', nutsAt(172, 10))}\n    <text x=\"56\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1f3a68\">5 гайка<\/text><text x=\"206\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1f3a68\">10 гайка<\/text><\/svg>`;\n\n  /* 9: циферблатты термометр, 0…120 °C, 1 бөлік = 1 °C */\n  const cx = 110, cy = 110, R0 = 92, A0 = 225, SPAN = 270;\n  const ang = t => (A0 - SPAN * t / 120) * Math.PI / 180;\n  let d = `<svg width=\"220\" height=\"220\" viewBox=\"0 0 220 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Sans,sans-serif\">\n    <circle cx=\"${cx}\" cy=\"${cy}\" r=\"104\" fill=\"#f1f1f1\" stroke=\"#555\" stroke-width=\"5\"/><circle cx=\"${cx}\" cy=\"${cy}\" r=\"96\" fill=\"#fff\" stroke=\"#999\"/>`;\n  for (let t = 0; t <= 120; t++) { const a = ang(t), big = t % 10 === 0, len = big ? 14 : (t % 5 === 0 ? 10 : 6);\n    d += `<line x1=\"${cx + R0 * Math.cos(a)}\" y1=\"${cy - R0 * Math.sin(a)}\" x2=\"${cx + (R0 - len) * Math.cos(a)}\" y2=\"${cy - (R0 - len) * Math.sin(a)}\" stroke=\"#222\" stroke-width=\"${big ? 1.8 : .8}\"/>`;\n    if (t % 20 === 0) d += `<text x=\"${cx + (R0 - 26) * Math.cos(a)}\" y=\"${cy - (R0 - 26) * Math.sin(a) + 5}\" text-anchor=\"middle\" font-size=\"13\" fill=\"#222\">${t}<\/text>`; }\n  const an = ang(21);\n  d += `<text x=\"${cx}\" y=\"${cy - 30}\" text-anchor=\"middle\" font-size=\"14\" fill=\"#222\">°C<\/text>\n    <line x1=\"${cx - 16 * Math.cos(an)}\" y1=\"${cy + 16 * Math.sin(an)}\" x2=\"${cx + (R0 - 6) * Math.cos(an)}\" y2=\"${cy - (R0 - 6) * Math.sin(an)}\" stroke=\"#c8352b\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <circle cx=\"${cx}\" cy=\"${cy}\" r=\"7\" fill=\"#333\"/><\/svg>`;\n  SVG.thermo9 = d;\n\n  SVG.alc8 = `<svg width=\"200\" height=\"170\" viewBox=\"0 0 200 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"PT Sans,sans-serif\" font-size=\"12\">\n    <rect x=\"22\" y=\"50\" width=\"50\" height=\"95\" fill=\"#cfe2f7\"/><path d=\"M22 14 V145 H72 V14\" fill=\"none\" stroke=\"#1f3a68\" stroke-width=\"2.2\"/>\n    <rect x=\"122\" y=\"50\" width=\"50\" height=\"95\" fill=\"#f3e9c6\"/><path d=\"M122 14 V145 H172 V14\" fill=\"none\" stroke=\"#1f3a68\" stroke-width=\"2.2\"/>\n    <text x=\"47\" y=\"44\" text-anchor=\"middle\" fill=\"#1f3a68\">100<\/text><text x=\"147\" y=\"44\" text-anchor=\"middle\" fill=\"#1f3a68\">100<\/text>\n    <text x=\"97\" y=\"96\" text-anchor=\"middle\" font-size=\"22\" fill=\"#1f3a68\">+<\/text>\n    <text x=\"47\" y=\"162\" text-anchor=\"middle\" fill=\"#1f3a68\">су<\/text><text x=\"147\" y=\"162\" text-anchor=\"middle\" fill=\"#1f3a68\">спирт<\/text><\/svg>`;\n})();\nQ.forEach(q => { if (typeof q.svg === 'string' && SVG[q.svg]) q.svg = SVG[q.svg]; });\n\n/* ═════════════════════ 2025–2026 оқу жылы, аудандық кезең ═════════════════════ */\nconst S23 = n => Q.find(q => q.n === n && q.set === '2023');\nconst Q25 = [\n { n: 1, lvl: 1, t: 'force', from: 14, kk: 'Қандай да бір ғаламшарда массасы 15 кг жүкті үйкеліс коэффициенті 0,3 болатын кедір-бұдырлы бет бойымен орнынан қозғалту үшін 27 Н күш қажет. Осы ғаламшардағы еркін түсу үдеуі <i>g<\/i> қандай?',\n   ru: 'На некой планете для перемещения груза массой 15 кг по шероховатой поверхности с коэффициентом трения 0,3 требуется сила 27 Н. Каково ускорение свободного падения <i>g<\/i> на этой планете?', o: ['10 Н/кг', '3 Н/кг', '6 Н/кг', '8 Н/кг', '5 Н/кг'], a: 2 },\n { n: 2, lvl: 1, t: 'force', kk: 'Үстел бетімен білікшені бірқалыпты сүйреу үшін 30 Н күш қажет болса, білікше мен үстел беті арасындағы үйкеліс коэффициенті қандай? Білікше массасы 5 кг, <i>g<\/i> = 10 Н/кг.',\n   ru: 'Если для равномерного перемещения бруска по столу необходимо приложить силу 30 Н, то каков коэффициент трения бруска о стол? Масса бруска 5 кг, <i>g<\/i> = 10 Н/кг.', o: ['0,3', '0,5', '0,6', '0,9', '0,4'], a: 2,\n   sol: ['Бірқалыпты қозғалыста тарту күші үйкеліс күшіне тең: <i>F<\/i> = <i>μmg<\/i>.', '<i>μ<\/i> = <i>F<\/i>/(<i>mg<\/i>) = 30/(5·10) = <b>0,6<\/b>.'] },\n { n: 3, lvl: 1, t: 'kin', from: 3, kk: S23(3).kk, ru: 'За какое время автомобиль, движущийся со скоростью 54 км/ч, проходит расстояние 1200 м?', o: ['60 с', '45 с', '48 с', '80 с', '90 с'], a: 3 },\n { n: 4, lvl: 1, t: 'kin', from: 5, kk: S23(5).kk, ru: 'Против течения реки моторная лодка проходит путь 5 км за 30 мин. Скорость течения 5 км/ч. Какова скорость лодки относительно воды?', o: ['5 км/сағ', '10 км/сағ', '15 км/сағ', '20 км/сағ', '25 км/сағ'], a: 2 },\n { n: 5, lvl: 1, t: 'dens', from: 6, kk: S23(6).kk, ru: 'Масса стального куба 200 г. Какова масса стального куба с вдвое большим ребром?', o: ['1,2 кг', '1,6 кг', '0,8 кг', '0,4 кг', '0,5 кг'], a: 1 },\n { n: 6, lvl: 1, t: 'meas', svg: SVG.rulers6, kk: 'Бөлік құны ең кіші сызғышты анықтаңыз.', ru: 'Определите линейку с наименьшей ценой деления.', o: ['A', 'B', 'C', 'D', 'E'], a: 4,\n   sol: ['Бөлік құны = (екі көрші санның айырмасы) / (олардың арасындағы бөліктер саны).', 'A: 50/5 = 10 см; B: 10/5 = 2 см; C: 20/4 = 5 см; D: 8/8 = 1 см; E: 1/4 = 0,25 см.', 'Ең кішісі — <b>E<\/b> (0,25 см). <i>Ескерту: сурет түпнұсқа бойынша қайта салынған.<\/i>'] },\n { n: 7, lvl: 1, t: 'meas', svg: SVG.beakers7, kk: 'Үш түрлі мензуркаға әр түрлі көлемдегі сұйық құйылған (суретті қараңыз). Бірінші және екінші мензуркадағы сұйықтар үшінші мензуркаға құйылды. Үшінші мензуркадағы сұйықтың көлемін анықтаңыз.',\n   ru: 'В три разные мензурки налили жидкость разного объёма (см. рисунок). В третью мензурку перелили жидкость из первой и второй. Определите объём жидкости в третьей мензурке.', o: ['75 мл', '100 дм³', '110 см³', '125 мл', '150 дм³'], a: 2,\n   sol: ['Мензуркалардың көрсетуі: 1 — 30 мл, 2 — 50 мл, 3 — 30 мл.', 'Барлығы: 30 + 50 + 30 = 110 мл. 1 мл = 1 см³ ⇒ <b>110 см³<\/b>.', 'Назар аудар: дм³ — литр (1 дм³ = 1000 мл), сондықтан 100 дм³ және 150 дм³ мүлде басқа шамалар. <i>Сурет қайта салынған.<\/i>'] },\n { n: 8, lvl: 1, t: 'mkt', svg: SVG.alc8, kk: 'Екі бірдей мензуркада 100 мл-ден су мен спирт бар. Су мен спиртті араластырғанда қоспаның қандай <i>V<\/i> көлемін алуға болады?',\n   ru: 'В двух одинаковых мензурках находится по 100 мл воды и спирта. Какой объём <i>V<\/i> смеси можно получить при смешивании воды и спирта?', o: ['<i>V<\/i> = 200 мл', '<i>V<\/i> &gt; 200 мл', '<i>V<\/i> &lt; 200 мл', '<i>V<\/i> = 100 мл', '<i>V<\/i> = 150 мл'], a: 2,\n   sol: ['Молекулалардың арасында <b>аралықтар<\/b> бар. Араластырғанда спирттің ұсақ молекулалары су молекулаларының арасына еніп кетеді (және керісінше).', 'Сондықтан қоспаның көлемі қосындыдан аз: <b><i>V<\/i> &lt; 200 мл<\/b> (шамамен 190–195 мл). Бұл — молекулалар арасында бос орын бар екенінің дәлелі.'] },\n { n: 9, lvl: 1, t: 'meas', svg: SVG.thermo9, kk: 'Суретте зертханаға орнатылған термометр келтірілген. Оның көрсеткішін анықтаңыз.', ru: 'На рисунке представлен термометр, установленный в лаборатории. Определите его показание.', o: ['20 °C', '20,5 °C', '21 °C', '21,5 °C', '22 °C'], a: 2,\n   sol: ['Сандар 20 °C сайын жазылған, олардың арасында 20 кіші бөлік бар ⇒ бөлік құны 1 °C.', 'Тіл 20-дан кейінгі бірінші сызықта тұр ⇒ <b>21 °C<\/b>. <i>Сурет түпнұсқа бойынша қайта салынған.<\/i>'] },\n { n: 10, lvl: 1, t: 'press', from: 8, svg: SVG.vessels, kk: S23(8).kk, ru: 'На рисунке изображены три сосуда с водой. Площади дна сосудов равны. Сравните давления <i>p<\/i><sub>1<\/sub>, <i>p<\/i><sub>2<\/sub> и <i>p<\/i><sub>3<\/sub> на дно сосудов.',\n   o: ['<i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &lt; <i>p<\/i><sub>2<\/sub> &lt; <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &lt; <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> &gt; <i>p<\/i><sub>2<\/sub> = <i>p<\/i><sub>3<\/sub>', '<i>p<\/i><sub>1<\/sub> = <i>p<\/i><sub>2<\/sub> &gt; <i>p<\/i><sub>3<\/sub>'], a: 0 },\n { n: 11, lvl: 1, t: 'dens', from: 9, kk: S23(9).kk, ru: 'Какова средняя плотность кварцевого образца, на 30 % заполненного воздушными пустотами? Плотность кварца 2500 кг/м³.', o: ['2000 кг/м³', '1750 кг/м³', '1900 кг/м³', '1550 кг/м³', '2500 кг/м³'], a: 1 },\n { n: 12, lvl: 1, t: 'force', from: 10, kk: S23(10).kk, ru: 'С какой силой давит на подставку алюминиевый образец объёмом 100 см³? Плотность алюминия 2700 кг/м³.', o: ['2,7 кН', '270 Н', '27 Н', '2,7 Н', '27 мН'], a: 3 },\n { n: 13, lvl: 1, t: 'graph', from: 11, svg: SVG.xt11, kk: S23(11).kk, ru: 'На рисунке представлены графики зависимости координаты двух тел от времени. Какой вид движения они совершают?', o: ['бірқалыпты / равномерное', 'бірқалыпты үдемелі / равноускоренное', 'бірқалыпты кемімелі / равнозамедленное', 'шеңбер бойымен / круговое', 'анықтау мүмкін емес / невозможно определить'], a: 0 },\n { n: 14, lvl: 1, t: 'press', from: 12, svg: SVG.cube12, kk: S23(12).kk, ru: 'В открытом сосуде с жидкостью плотностью <i>ρ<\/i> расположен кубик (как показано на рисунке). Атмосферное давление <i>P<\/i><sub>0<\/sub>. Чему равно давление у верхней поверхности кубика?',\n   o: ['<i>ρga<\/i>', '<i>ρg<\/i>(<i>b<\/i> + <i>c<\/i>)', '<i>P<\/i><sub>0<\/sub> + <i>ρgc<\/i><sup>3<\/sup>/<i>ab<\/i>', '<i>P<\/i><sub>0<\/sub> + <i>ρga<\/i>', '<i>ρg<\/i>(<i>b<\/i> − <i>c<\/i>)'], a: 3 },\n { n: 15, lvl: 1, t: 'spring', from: 13, kk: S23(13).kk, ru: 'Груз под своим весом растягивает пружину жёсткостью 800 Н/м на 8 мм. На сколько он растянет пружину жёсткостью 500 Н/м?', o: ['25 мм', '12,8 мм', '4 мм', '6,25 мм', '25 см'], a: 1 },\n { n: 16, lvl: 2, t: 'meas', svg: SVG.nuts16, kk: 'Мензурканың ішіне ішінара мөлдір сұйық құйылған. Алидар тәжірибе жүргізбекші болып, алдымен мензуркаға 5 гайка салды, содан кейін тағы да дәл сонша гайка салып, көлемнің өзгерісін тіркеді (суретті қараңыз). Барлық гайкалар бірдей деп есептеп, бір гайканың көлемін анықтаңыз.',\n   ru: 'Мензурка частично заполнена прозрачной жидкостью. Алидар решил провести опыт и вначале опустил в мензурку 5 гаек, затем ещё столько же и зафиксировал изменение объёма (см. рисунок). Считая, что все гайки одинаковые, определите объём одной гайки.', o: ['5,4 см³', '4,1 см³', '2,8 см³', '2,1 см³', '1,4 см³'], a: 2,\n   sol: ['5 гайкамен деңгей 27 мл, 10 гайкамен 41 мл.', 'Қосымша 5 гайка ығыстырған көлем: 41 − 27 = 14 мл = 14 см³.', 'Бір гайка: 14/5 = <b>2,8 см³<\/b>. Жиі қате: 41/10 = 4,1 — бастапқы сұйықтың көлемін ескермеу. <i>Сурет қайта салынған.<\/i>'] },\n { n: 17, lvl: 2, t: 'spring', from: 17, kk: S23(17).kk, ru: 'Для растяжения пружины на 4 мм необходимо совершить работу 0,02 Дж. Какую работу надо совершить, чтобы растянуть эту пружину на 4 см?', o: ['1 Дж', '2 Дж', '2,5 Дж', '4 Дж', '5 Дж'], a: 1 },\n { n: 18, lvl: 2, t: 'kin', from: 18, kk: S23(18).kk, ru: 'За 30 км до пункта прибытия машинист поезда увеличил скорость, чтобы перекрыть опоздание в 10 мин. На сколько выросла скорость, изначально равная 80 км/ч?', o: ['60 км/сағ-қа', '45 км/сағ-қа', '40 км/сағ-қа', '64 км/сағ-қа', '75 км/сағ-қа'], a: 3 },\n { n: 19, lvl: 2, t: 'cap', kk: 'Өзара <b>тізбектей<\/b> қосылған екі конденсатордан тұратын батареяның сыйымдылығын табыңыз. Әрбір конденсатордың сыйымдылығы 3 мкФ.', ru: 'Найдите ёмкость батареи, состоящей из двух <b>последовательно<\/b> соединённых конденсаторов. Ёмкость каждого конденсатора 3 мкФ.', o: ['9 мкФ', '1,5 мкФ', '6 мкФ', '4,5 мкФ', '5 мкФ'], a: 1,\n   sol: [`Тізбектей жалғауда: ${fr(1, '<i>C<\/i>')} = ${fr(1, '<i>C<\/i><sub>1<\/sub>')} + ${fr(1, '<i>C<\/i><sub>2<\/sub>')}.`, `${fr(1, '<i>C<\/i>')} = ${fr(1, 3)} + ${fr(1, 3)} = ${fr(2, 3)} ⇒ <i>C<\/i> = <b>1,5 мкФ<\/b>. (Параллель жалғанса, 6 мкФ болар еді.)`] },\n { n: 20, lvl: 2, t: 'dens', from: 20, kk: S23(20).kk, ru: 'Каков объём пустот в стальной детали массой 3,12 кг, занимающей объём 500 см³? Плотность стали 7800 кг/м³.', o: ['30 см³', '80 см³', '100 см³', '40 см³', '120 см³'], a: 2 },\n { n: 21, lvl: 2, t: 'dens', from: 21, kk: S23(21).kk, ru: 'Какова плотность смеси порошков удобрений с плотностями 400 кг/м³ и 600 кг/м³, взятых в равных массах? Объём смеси равен сумме объёмов составляющих.', o: ['480 кг/м³', '500 кг/м³', '540 кг/м³', '450 кг/м³', '300 кг/м³'], a: 0 },\n { n: 22, lvl: 2, t: 'cap', from: 22, kk: S23(22).kk, ru: 'Конденсатор ёмкостью <i>C<\/i><sub>1<\/sub> зарядили до напряжения <i>U<\/i><sub>1<\/sub> = 500 В. При параллельном подключении к незаряженному конденсатору ёмкостью <i>C<\/i><sub>2<\/sub> = 4 мкФ вольтметр показал <i>U<\/i><sub>2<\/sub> = 100 В. Найдите <i>C<\/i><sub>1<\/sub>.', o: ['0,5 мкФ', '2 мкФ', '0,4 мкФ', '1 мкФ', '2,5 мкФ'], a: 3 },\n { n: 23, lvl: 2, t: 'spring', from: 23, kk: S23(23).kk, ru: 'Две пружины жёсткостями 15 кН/м и 25 кН/м соединены последовательно. Удлинение первой пружины 5 мм. С какой силой растягивают систему и чему равно удлинение второй пружины?', o: ['50 Н, 5 мм', '75 Н, 5 мм', '50 Н, 3 мм', '75 Н, 3 мм', '60 Н, 2,5 мм'], a: 3 },\n { n: 24, lvl: 2, t: 'force', from: 24, kk: S23(24).kk, ru: 'Брусок массой 5 кг лежит на шероховатой поверхности, коэффициент трения 0,3. Какая сила трения действует на тело, если его пытаться сдвинуть силами 10 Н и 20 Н? <i>g<\/i> = 10 м/с².', o: ['10 Н, 20 Н', '15 Н, 15 Н', '10 Н, 15 Н', '15 Н, 20 Н', '25 Н, 30 Н'], a: 2 },\n { n: 25, lvl: 2, t: 'heat', from: 25, kk: S23(25).kk, ru: 'В кастрюлю налили воду при температуре <i>t<\/i><sub>0<\/sub> = 10 °C и поставили на плиту. Через τ = 10 мин вода закипела. Через какое время она полностью превратится в пар? <i>L<\/i> = 2,26·10<sup>6<\/sup> Дж/кг, <i>c<\/i> = 4,18·10<sup>3<\/sup> Дж/(кг·°C).', o: ['30 мин', '10 мин', '45 мин', '60 мин', '50 мин'], a: 3 },\n { n: 26, lvl: 3, t: 'kin', from: 26, kk: S23(26).kk, ru: 'Средняя скорость автомобиля на некотором участке пути равна 60 км/ч. Первая треть пройдена со скоростью 40 км/ч. С какой скоростью пройдены оставшиеся две трети пути?', o: ['80 км/сағ', '70 км/сағ', '72 км/сағ', '64 км/сағ', '75 км/сағ'], a: 0 },\n { n: 27, lvl: 3, t: 'elec', from: 27, kk: S23(27).kk, ru: 'Электрон находится в однородном электрическом поле напряжённостью <i>E<\/i> = 200 кВ/м. Какой путь пройдёт электрон за время <i>t<\/i> = 1 нс, если его начальная скорость равна нулю? <i>e<\/i> = 1,6·10<sup>−19<\/sup> Кл, <i>m<\/i> = 9,1·10<sup>−31<\/sup> кг.', o: ['1,92·10<sup>−2<\/sup> м', '1,02·10<sup>−2<\/sup> м', '2,06·10<sup>−2<\/sup> м', '1,76·10<sup>−2<\/sup> м', '2,04·10<sup>−2<\/sup> м'], a: 3 },\n { n: 28, lvl: 3, t: 'energy', from: 28, kk: S23(28).kk, ru: 'Поезд массой <i>m<\/i> = 1000 т при торможении с ускорением <i>a<\/i> = 0,2 м/с² остановился через <i>t<\/i> = 100 с. Какое количество теплоты выделилось при торможении?', o: ['1·10<sup>8<\/sup> Дж', '0,2·10<sup>6<\/sup> Дж', '2·10<sup>8<\/sup> Дж', '1·10<sup>7<\/sup> Дж', '4·10<sup>7<\/sup> Дж'], a: 2 },\n { n: 29, lvl: 3, t: 'spring', from: 29, kk: S23(29).kk, ru: 'Под действием грузов две пружины жёсткостями 10 кН/м и 20 кН/м растянуты на 5 мм и 4 мм соответственно. Каковы будут растяжения пружин, если грузы поменять местами?', o: ['4 мм, 5 мм', '8 мм, 2,5 мм', '8 мм, 10 мм', '6 мм, 3 мм', '5 мм, 2,5 мм'], a: 1 },\n { n: 30, lvl: 3, t: 'elec', from: 30, kk: S23(30).kk, ru: 'Два точечных заряда <i>q<\/i><sub>1<\/sub> = 4 мКл и <i>q<\/i><sub>2<\/sub> = −2 мКл находятся на расстоянии <i>l<\/i>. Как и во сколько раз изменится напряжённость поля в точке посередине между зарядами, если второй заряд будет положительным?', o: ['кернеулік өзгермейді / не изменится', '3 есе кемиді / уменьшится в 3 раза', '3 есе артады / увеличится в 3 раза', '2 есе артады / увеличится в 2 раза', '4 есе артады / увеличится в 4 раза'], a: 1 }\n];\nQ25.forEach(q => {\n  q.set = '2025';\n  if (!q.sol) q.sol = S23(q.from).sol.map(s => s.replace(/<i>Ескерту: ресми кілтте[^<]*<\\/i>/, '').replace(/<i>Ескерту: түпнұсқада[^<]*<\\/i>/, '<i>Ескерту: түпнұсқада бұл нұсқа «12,5 мм» деп берілген, дәл есептеу 12,8 мм береді.<\/i>')).filter(Boolean);\n});\nQ.push(...Q25);\nQ.forEach(q => { q.opts = q.o; q.pts = q.lvl; });\n\n/* ─── өлшеу тақырыбына қосымша генераторлар ─── */\nT.meas.q = [4];\nT.meas.g.push(\n  () => { const v = [R(1, 5) * 5, R(2, 9) * 5, R(1, 6) * 5]; const ans = v[0] + v[1] + v[2]; const o = numOpts(ans, [v[0] + v[1], ans * 1000, ans / 10, ans + 10], 'мл', 0); return { q: `Бірінші мензуркада ${v[0]} мл, екіншісінде ${v[1]} мл су бар. Екеуін де ішінде ${v[2]} мл су бар үшінші мензуркаға құйды. Үшінші мензуркада қанша су болады?`, ...o, sol: [`${v[0]} + ${v[1]} + ${v[2]} = <b>${ans} мл<\/b> (= ${ans} см³). Үшінші мензуркадағы бастапқы суды ұмытпа!`] }; },\n  () => { const n = pick([3, 4, 5, 6]), v1 = R(2, 6) * 5, vn = pick([1.5, 2, 2.4, 3, 4]); const v2 = v1 + n * vn; const o = numOpts(vn, [v2 / n, (v2 - v1), v2 / (2 * n), vn * 2], 'см³', 2); return { q: `Мензуркада ${v1} мл су бар. Оған ${n} бірдей шарик салғанда деңгей ${fmt(v2, 1)} мл-ге көтерілді. Бір шариктің көлемі қандай?`, ...o, sol: [`Шариктер ығыстырған көлем: ${fmt(v2, 1)} − ${v1} = ${fmt(v2 - v1, 1)} мл.`, `Бір шарик: ${fmt(v2 - v1, 1)}/${n} = <b>${fmt(vn, 2)} см³<\/b>.`] }; }\n);\nT.mkt.g.push(() => { const a = pick([50, 100, 150, 200]); const o = txtOpts(`${2 * a} мл-ден аз`, [`дәл ${2 * a} мл`, `${2 * a} мл-ден көп`, `${a} мл`, 'анықтау мүмкін емес']); return { q: `${a} мл суға ${a} мл спирт құйып араластырды. Қоспаның көлемі қандай болады?`, ...o, sol: ['Молекулалар арасында аралықтар бар: спирт молекулалары су молекулаларының арасына енеді.', `Сондықтан көлем <b>${2 * a} мл-ден аз<\/b> болады.`] }; });\n\n\n/* ═════════════════════ күй ═════════════════════ */\nconst S = { lang: 'kk', name: '', screen: 'home', test: null, review: null, extra: null };\nconst LOGKEY = 'olymp8_junior_log';\nfunction loadLog() { try { return JSON.parse(localStorage.getItem(LOGKEY)) || []; } catch (e) { return []; } }\nfunction saveLog(entry) { try { const l = loadLog(); l.unshift(entry); localStorage.setItem(LOGKEY, JSON.stringify(l.slice(0, 40))); } catch (e) {} }\ntry { S.name = localStorage.getItem('olymp8_name') || ''; S.lang = localStorage.getItem('olymp8_lang') || 'kk'; } catch (e) {}\n\ndocument.querySelectorAll('.lang button').forEach(b => b.onclick = () => { S.lang = b.dataset.l; try { localStorage.setItem('olymp8_lang', S.lang); } catch (e) {} markLang(); render(); });\nfunction markLang() { document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang)); }\nmarkLang();\n\nlet timerId = null;\nfunction go(screen) {\n  if (screen === 'home' && S.test && S.test.phase === 'run' && !confirm('Тест аяқталмады. Басты бетке шығасыз ба? Жауаптар сақталмайды.')) return;\n  if (screen === 'home') { S.test = null; S.review = null; S.extra = null; }\n  S.screen = screen; render(); scrollTo(0, 0);\n}\nfunction render() {\n  clearInterval(timerId);\n  $('whoChip').hidden = !S.name; $('whoChip').textContent = '✎ ' + S.name;\n  const f = { home: viewHome, test: viewTest, result: viewResult, review: viewReview, extra: viewTest, lib: viewLib, topic: viewTopic }[S.screen];\n  $('app').innerHTML = f();\n  bind();\n  if (S.screen === 'test' || S.screen === 'extra') timerId = setInterval(tick, 1000);\n}\nconst qText = q => (S.lang === 'ru' && q.ru) ? q.ru : q.kk;\nfunction figHtml(q) { if (q.svg) return `<div class=\"fig\">${q.svg}<\/div>`; const k = q.img; return k ? `<div class=\"fig\"><img src=\"${IMG[k]}\" alt=\"сурет\"><\/div>` : ''; }\n\n/* ─────────────── басты бет ─────────────── */\nfunction viewHome() {\n  const log = loadLog().slice(0, 8);\n  const card = (set, title, sub) => `<div class=\"sheet\"><h2>${title}<\/h2><p class=\"muted\">${sub}<\/p><div class=\"modes\">\n    <button class=\"mode\" data-m=\"${set}-all\"><span class=\"num\">30<\/span><span><b>Толық олимпиада<\/b><small>30 тапсырма · 90 минут · 50 ұпай<\/small><\/span><\/button>\n    <button class=\"mode\" data-m=\"${set}-1\"><span class=\"num\">1<\/span><span><b>Бір ұпайлық тапсырмалар<\/b><small>1–15<\/small><\/span><\/button>\n    <button class=\"mode\" data-m=\"${set}-2\"><span class=\"num\">2<\/span><span><b>Екі ұпайлық тапсырмалар<\/b><small>16–25<\/small><\/span><\/button>\n    <button class=\"mode\" data-m=\"${set}-3\"><span class=\"num\">3<\/span><span><b>Үш ұпайлық тапсырмалар<\/b><small>26–30<\/small><\/span><\/button><\/div><\/div>`;\n  return `<div class=\"start\">\n  <section>\n    <div class=\"sheet\">\n      <h1>Жасөспірімдер олимпиадасына дайындық<\/h1>\n      <p class=\"muted\">Физика, 8 сынып, аудандық кезең. Тест біткен соң — <span class=\"hand\">қатемен жұмыс<\/span>: әр қатенің шешуі, тақырып бойынша конспект және жаңа сандармен қосымша тест.<\/p>\n      <label class=\"field\"><span>Аты-жөнің<\/span><input id=\"nm\" value=\"${esc(S.name)}\" placeholder=\"Мысалы: Алидар Серікұлы\" autocomplete=\"off\"><\/label>\n    <\/div>\n    ${card('2025', '2025–2026 оқу жылы', 'Аудандық кезең · сұрақтар қазақша және орысша (жоғарыдағы ҚАЗ / РУС)')}\n    ${card('2023', '2023 жыл', 'Олимпиаданың екінші (аудандық) кезеңі · қазақша')}\n  <\/section>\n  <section>\n    <div class=\"sheet\">\n      <h2>Конспектілер<\/h2>\n      <p class=\"muted\">Олимпиаданың ${Object.keys(T).length} тақырыбы бойынша қысқа теория, формулалар және жиі кездесетін қателер.<\/p>\n      <button class=\"btn ghost\" id=\"toLib\">Конспектілерді ашу<\/button>\n    <\/div>\n    <div class=\"sheet\">\n      <h2>Нәтижелер журналы<\/h2>\n      ${log.length ? `<table class=\"log\">${log.map(e => `<tr><td>${esc(e.name || '—')}<br><small class=\"muted\">${e.date} · ${e.mode}<\/small><\/td><td>${
