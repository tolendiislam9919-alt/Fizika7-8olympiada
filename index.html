<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Физика олимпиадасы 7–8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Layout: жоғарғы жіңішке жолақ (сынып ауыстыру) + астында таңдалған тренажер толық биіктікте */
:root{
  --paper:#f4f6f5; --sheet:#ffffff; --grid:rgba(40,110,100,.12); --ink:#1c2840; --muted:#5d6878; --line:#d5dcdb;
  --accent:#2452a3; --accent-soft:#e3ebf8; --pen:#c4302a;
  --serif:"PT Serif",Georgia,serif; --sans:"PT Sans","Segoe UI",Arial,sans-serif; --mono:"PT Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111615; --sheet:#1a201f; --grid:rgba(120,200,185,.08); --ink:#e2e8ee; --muted:#9aa5b1; --line:#2f3937;
  --accent:#8db0ff; --accent-soft:#1f2b44; --pen:#ff8075; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111615; --sheet:#1a201f; --grid:rgba(120,200,185,.08); --ink:#e2e8ee; --muted:#9aa5b1; --line:#2f3937;
  --accent:#8db0ff; --accent-soft:#1f2b44; --pen:#ff8075; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;display:flex;flex-direction:column;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:var(--sheet);border-bottom:2px solid var(--ink)}
.top .name{font-family:var(--serif);font-weight:700;font-size:1.05rem;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.top .sp{flex:1}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:transparent;color:var(--ink);padding:5px 14px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--sheet)}

.home{flex:1;overflow:auto;padding:32px 16px 48px}
.home .in{max-width:860px;margin:0 auto}
.home .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.home h1{font-family:var(--serif);font-size:clamp(1.8rem,4.5vw,2.6rem);margin:4px 0 8px;text-wrap:balance}
.home p{max-width:62ch;margin:0 0 22px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{display:grid;gap:10px;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:20px;color:var(--ink)}
.card:hover{border-color:var(--accent);background:var(--accent-soft)}
.card .g{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1;color:var(--accent)}
.card .g small{font-size:1rem;color:var(--muted);font-weight:400;margin-left:6px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:.95rem}
.card .go{font-weight:700;color:var(--accent)}

.stage{flex:1;position:relative;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
</style>
</head>
<body>
<header class="top">
  <button class="name" id="home">Физика олимпиадасы · тренажер</button>
  <span class="sp"></span>
  <div class="tabs" role="tablist" aria-label="Сынып">
    <button data-g="g7" role="tab">7 сынып</button><button data-g="g8" role="tab">8 сынып</button>
  </div>
</header>

<main class="home" id="pick">
  <div class="in">
    <div class="k">Жасөспірімдер олимпиадасы · физика</div>
    <h1>Сыныпты таңда</h1>
    <p>Әр сыныптың олимпиада тапсырмалары бойынша тест тапсырып, соңында әр сұрақтың жауабын көріп, қателеріңмен жұмыс жасайсың. Сыныптар арасында жоғарғы батырмалармен ауыса аласың: басталған тест жоғалмайды.</p>
    <div class="cards">
      <button class="card" data-g="g7"><span class="g">7<small>сынып</small></span>
        <ul><li>2023 жылғы ІІ кезең, 30 тапсырма</li><li>Түпнұсқа немесе жаңа сандармен нұсқа</li><li>Қатемен жұмыс және ұқсас есептер</li></ul>
        <span class="go">Бастау →</span></button>
      <button class="card" data-g="g8"><span class="g">8<small>сынып</small></span>
        <ul><li>2023 және 2025 жылғы олимпиада тапсырмалары</li><li>Қатемен жұмыс, қосымша тест, конспектілер</li><li>Қазақша / орысша</li></ul>
        <span class="go">Бастау →</span></button>
    </div>
  </div>
</main>
<div class="stage" id="stage" hidden></div>

<script>
const APPS = {"g7": "<!doctype html>\n<html lang=\"kk\"><head><title>Олимпиада тренажері 7<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap\">\n<style>\n/* Layout: олимпиада парағы — сол жақта жауап парағы (бланк), оң жақта сұрақ; миллиметрлік қағаз фоны, қатені қызыл қаламмен түзету */\n:root{\n  --paper:#f4f6f5; --sheet:#ffffff; --grid:rgba(40,110,100,.07); --grid2:rgba(40,110,100,.14);\n  --ink:#1c2840; --muted:#5d6878; --line:#d5dcdb;\n  --accent:#2452a3; --accent-soft:#e3ebf8;\n  --pen:#c4302a; --pen-soft:#fbe9e7;\n  --ok:#2c7a4b; --ok-soft:#e2f2e8;\n  --warn:#9a6a00; --warn-soft:#fbf1d6;\n  --serif:\"PT Serif\",Georgia,\"Times New Roman\",serif;\n  --sans:\"PT Sans\",\"Segoe UI\",Arial,sans-serif;\n  --mono:\"PT Mono\",Consolas,\"Courier New\",monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#111615; --sheet:#1a201f; --grid:rgba(120,200,185,.05); --grid2:rgba(120,200,185,.10);\n  --ink:#e2e8ee; --muted:#9aa5b1; --line:#2f3937;\n  --accent:#8db0ff; --accent-soft:#1f2b44;\n  --pen:#ff8075; --pen-soft:#3a1f1d;\n  --ok:#6fd096; --ok-soft:#173326;\n  --warn:#f0c35a; --warn-soft:#352b14; color-scheme:dark }}\n:root[data-theme=\"dark\"]{\n  --paper:#111615; --sheet:#1a201f; --grid:rgba(120,200,185,.05); --grid2:rgba(120,200,185,.10);\n  --ink:#e2e8ee; --muted:#9aa5b1; --line:#2f3937;\n  --accent:#8db0ff; --accent-soft:#1f2b44;\n  --pen:#ff8075; --pen-soft:#3a1f1d;\n  --ok:#6fd096; --ok-soft:#173326;\n  --warn:#f0c35a; --warn-soft:#352b14; color-scheme:dark }\n\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;\n  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),\n  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:50px 50px,50px 50px,10px 10px,10px 10px}\n.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}\nh1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}\nbutton{font:inherit;cursor:pointer}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}\nsup{font-size:.7em}\n\n/* header strip like the olympiad form */\n.form-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:20px}\n.form-head .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.form-head h1{font-size:1.45rem}\n.form-head .who{font-family:var(--serif);font-style:italic;color:var(--accent)}\n.timer{font-family:var(--mono);font-size:1.15rem;padding:4px 10px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet)}\n.timer.low{color:var(--pen);border-color:var(--pen)}\n\n.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px}\n.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);padding:9px 16px;border-radius:4px;font-weight:700}\n.btn:hover{background:var(--accent-soft)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}\n.btn.primary:hover{filter:brightness(1.08)}\n.btn.red{background:var(--pen);border-color:var(--pen);color:var(--sheet)}\n.btn.ghost{border-color:var(--line);font-weight:400}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n\n/* START */\n.start{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}\n.start h2{font-size:1.6rem;margin-bottom:10px}\n.start p{margin:0 0 12px;max-width:62ch}\n.field{display:grid;gap:6px;margin:16px 0}\n.field label{font-weight:700}\n.field input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}\n.choice{display:grid;gap:8px;margin:12px 0 18px}\n.choice label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer}\n.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}\n.choice small{display:block;color:var(--muted)}\n.rules{border-collapse:collapse;width:100%;font-size:.95rem}\n.rules td,.rules th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}\n.rules td:last-child,.rules th:last-child{text-align:right}\n.hist{margin-top:16px;font-size:.92rem}\n.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}\n.err-msg{color:var(--pen);font-size:.9rem;min-height:1.2em}\n\n/* TEST */\n.test{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}\n.bubbles{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px}\n.bubbles h3{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;font-weight:700}\n.bubbles h3:first-child{margin-top:0}\n.brow{display:grid;grid-template-columns:28px repeat(5,1fr);align-items:center;gap:3px;padding:1px 4px;border-radius:3px}\n.brow.cur{background:var(--accent-soft)}\n.brow .num{font-family:var(--mono);font-size:.85rem;color:var(--muted);cursor:pointer;text-align:right;padding-right:4px}\n.bub{width:24px;height:24px;border-radius:50%;border:1.3px solid var(--muted);background:transparent;color:var(--muted);font-size:.7rem;font-family:var(--mono);padding:0;justify-self:center;line-height:1}\n.bub.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}\n.bub.right{background:var(--ok);border-color:var(--ok);color:var(--sheet)}\n.bub.wrong{background:var(--pen);border-color:var(--pen);color:var(--sheet)}\n.bub.key{border:2px solid var(--ok);color:var(--ok);font-weight:700}\n.sheetfoot{margin-top:12px;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}\n\n.q-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px;font-size:.88rem;color:var(--muted)}\n.chip{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:.8rem}\n.chip.p1{border-color:var(--line)} .chip.p2{border-color:var(--accent);color:var(--accent)} .chip.p3{border-color:var(--pen);color:var(--pen)}\n.q-num{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--accent);font-weight:700}\n.q-text{font-family:var(--serif);font-size:1.18rem;line-height:1.55;margin:6px 0 18px;max-width:68ch}\n.opts{display:grid;gap:8px;max-width:560px}\n.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:5px;background:transparent;color:var(--ink);font-family:var(--serif);font-size:1.05rem}\n.opt:hover{border-color:var(--accent)}\n.opt .L{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:.9rem}\n.opt.on{border-color:var(--ink);background:var(--accent-soft)}\n.opt.on .L{background:var(--ink);color:var(--sheet);border-color:var(--ink)}\n.opt.bad{border-color:var(--pen);background:var(--pen-soft);text-decoration:line-through;text-decoration-color:var(--pen)}\n.opt.bad .L{border-color:var(--pen);color:var(--pen)}\n.opt.good{border-color:var(--ok);background:var(--ok-soft)}\n.opt.good .L{background:var(--ok);border-color:var(--ok);color:var(--sheet)}\n.opt:disabled{cursor:default}\n.q-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}\n.confirm{margin-top:14px;padding:12px;border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:5px}\n\n/* RESULTS */\n.score-line{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;margin-bottom:6px}\n.big{font-family:var(--serif);font-size:3.4rem;font-weight:700;line-height:1;color:var(--accent)}\n.big small{font-size:1.2rem;color:var(--muted);font-weight:400}\n.tally{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}\n.tally b{font-family:var(--mono);font-size:1.25rem}\n.t-ok b{color:var(--ok)} .t-bad b{color:var(--pen)} .t-skip b{color:var(--warn)}\n.res-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;margin-top:20px}\n.tbl-wrap{overflow-x:auto}\ntable.res{border-collapse:collapse;width:100%;font-size:.93rem}\ntable.res th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;border-bottom:1.5px solid var(--ink);padding:6px}\ntable.res td{border-bottom:1px solid var(--line);padding:5px 6px}\ntable.res td.c{text-align:center;font-family:var(--mono)}\n.mark-ok{color:var(--ok);font-weight:700} .mark-bad{color:var(--pen);font-weight:700} .mark-skip{color:var(--warn)}\n.topic{margin-bottom:12px}\n.topic .tn{display:flex;justify-content:space-between;font-size:.93rem;gap:10px}\n.bar{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:3px}\n.bar i{display:block;height:100%;background:var(--ok)}\n.bar i.mid{background:var(--warn)} .bar i.low{background:var(--pen)}\n.note{font-size:.88rem;color:var(--muted)}\n.rv{padding:16px 0;border-top:1px dashed var(--line)}\n.rv:first-of-type{border-top:0}\n.rv-opts{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--serif)}\n.rv-opts li{display:flex;gap:10px;align-items:center;padding:4px 8px;border-radius:4px}\n.rv-opts .L{width:24px;height:24px;flex:none;border-radius:50%;border:1.3px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem}\n.rv-opts li.bad{background:var(--pen-soft);color:var(--pen);text-decoration:line-through}\n.rv-opts li.bad .L{border-color:var(--pen)}\n.rv-opts li.good{background:var(--ok-soft);color:var(--ok);font-weight:700}\n.rv-opts li.good .L{background:var(--ok);border-color:var(--ok);color:var(--sheet)}\n.rv-opts em{font-family:var(--sans);font-size:.85rem;text-decoration:none;display:inline-block}\n.chip.st-bad{border-color:var(--pen);color:var(--pen)} .chip.st-ok{border-color:var(--ok);color:var(--ok)}\n\n/* ERROR WORK */\n.ew-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}\n.ew-dots{display:flex;flex-wrap:wrap;gap:5px}\n.ew-dots span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.75rem;border:1.5px solid var(--pen);color:var(--pen)}\n.ew-dots span.done{background:var(--ok);border-color:var(--ok);color:var(--sheet)}\n.ew-dots span.cur{outline:2px solid var(--ink);outline-offset:2px}\n.redpen{font-family:var(--serif);font-style:italic;color:var(--pen);margin:0 0 12px}\n.hint{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;margin:14px 0;max-width:68ch;border-radius:0 4px 4px 0}\n.hint b{font-family:var(--sans)}\n.steps{margin:14px 0;padding:12px 16px 12px 38px;background:var(--paper);border:1px dashed var(--line);border-radius:4px;max-width:70ch;font-family:var(--serif)}\n.steps li{margin:4px 0}\n.steps .ttl{font-family:var(--sans);font-weight:700;margin-left:-22px;margin-bottom:6px;font-size:.9rem;color:var(--accent)}\n.feedback{margin:12px 0;font-weight:700}\n.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--pen)}\n.twin{margin-top:22px;padding-top:18px;border-top:2px solid var(--ink)}\n.twin .tag{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}\n.copybox{width:100%;min-height:120px;font-family:var(--mono);font-size:.85rem;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px}\n\n@media (max-width:860px){\n  .test,.start,.res-grid{grid-template-columns:minmax(0,1fr)}\n  .bubbles{position:static;order:2}\n  .q-text{font-size:1.08rem}\n  .big{font-size:2.6rem}\n}\n@media (prefers-reduced-motion:no-preference){ .opt,.btn{transition:background-color .15s,border-color .15s} }\n<\/style>\n\n<\/head><body><div class=\"wrap\" id=\"app\"><\/div>\n\n<script>\n\"use strict\";\n/* ---------- көмекші функциялар ---------- */\nconst LET=\"ABCDE\";\nconst R=(a)=>a[Math.floor(Math.random()*a.length)];\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nfunction nf(x,d=3){ // сан → қазақша жазылу (үтір)\n  let r=Math.round(x*10**d)/10**d; let s=String(r);\n  if(s.includes(\"e\")) s=r.toFixed(d);\n  return s.replace(\".\",\",\");\n}\nfunction sci(x){ if(x===0) return \"0\"; const n=Math.floor(Math.log10(Math.abs(x))); const a=x/10**n; return nf(a,2)+\"·10<sup>\"+n+\"<\/sup>\"; }\n// сандық нұсқалар: дұрыс мән + алаңдатқыштар → 5 бірегей нұсқа\nfunction mk(val,dis,f){\n  const seen=new Set(),list=[];\n  const add=v=>{ if(!(isFinite(v))||v<=0) return; const s=f(v); if(!seen.has(s)){seen.add(s);list.push(s)} };\n  add(val); dis.forEach(add);\n  const k=[1.5,0.5,2,3,1.25,0.8,4,0.25,1.2,0.75]; let i=0;\n  while(list.length<5&&i<k.length) add(val*k[i++]);\n  const correct=list[0]; const o=shuffle(list.slice(0,5));\n  return {o,a:o.indexOf(correct)};\n}\nfunction mkS(correct,dis){ const set=[correct,...dis.filter((d,i,a)=>d!==correct&&a.indexOf(d)===i)].slice(0,5); const o=shuffle(set); return {o,a:o.indexOf(correct)}; }\nconst ord=k=>k+({6:\"-шы\",9:\"-шы\",10:\"-шы\"}[k]||\"-ші\");\n\n/* ---------- тақырыптар ---------- */\nconst TOPICS={\n  meas:\"Өлшеу, бірліктер\",\n  speed:\"Жылдамдық, салыстырмалы қозғалыс\",\n  avg:\"Орташа жылдамдық\",\n  dens:\"Масса және тығыздық\",\n  elast:\"Салмақ, серпімділік күші\",\n  fric:\"Үйкеліс күші\"\n};\n\n/* ---------- 30 тапсырма (2023, 7-сынып, II кезең) ---------- */\nconst Q=[\n{n:1,p:1,tp:\"meas\",\n t:\"Барлығы 40 бөлікке бөлінген, ұзындығы 20 см болатын сызғышпен өлшеу қателігі қандай?\",\n o:[\"5 мм\",\"2,5 мм\",\"1 см\",\"0,5 см\",\"0,75 см\"],a:1,\n hint:\"Өлшеу қателігі бөлік құнының жартысына тең. Бөлік құны = ұзындық : бөлік саны.\",\n sol:[\"Бөлік құны: 20 см : 40 = 0,5 см = 5 мм.\",\"Өлшеу қателігі — бөлік құнының жартысы: 5 мм : 2 = 2,5 мм.\"],\n gen(){const L=R([10,15,20,25,30]),N=R([20,25,50,100]);const div=L/N*10,err=div/2;\n  return {t:`Барлығы ${N} бөлікке бөлінген, ұзындығы ${L} см болатын сызғышпен өлшеу қателігі қандай?`,\n   ...mk(err,[div,err/2,div*2,err*10],v=>nf(v)+\" мм\"),\n   sol:[`Бөлік құны: ${L} см : ${N} = ${nf(div/10)} см = ${nf(div)} мм.`,`Қателік = ${nf(div)} мм : 2 = ${nf(err)} мм.`]}}},\n{n:2,p:1,tp:\"meas\",\n t:\"Жарық минутын километрге ауыстырыңыз. Жарық жылдамдығы 3·10<sup>8<\/sup> м/с.\",\n o:[\"3·10<sup>7<\/sup> км\",\"2·10<sup>7<\/sup> км\",\"1,8·10<sup>7<\/sup> км\",\"1,2·10<sup>7<\/sup> км\",\"1,4·10<sup>7<\/sup> м\"],a:2,\n hint:\"Жарық минуты — жарықтың 1 минутта жүретін жолы: s = c·t. Минутты секундқа, метрді километрге ауыстыруды ұмытпа.\",\n sol:[\"t = 1 мин = 60 с.\",\"s = c·t = 3·10<sup>8<\/sup> м/с · 60 с = 1,8·10<sup>10<\/sup> м.\",\"1 км = 10<sup>3<\/sup> м, сондықтан s = 1,8·10<sup>7<\/sup> км.\"],\n gen(){const c=R([{w:\"2 минутта\",s:120},{w:\"5 секундта\",s:5},{w:\"1 сағатта\",s:3600},{w:\"3 минутта\",s:180},{w:\"10 секундта\",s:10}]);const d=3e5*c.s;\n  return {t:`Жарық ${c.w} қанша километр жол жүреді? Жарық жылдамдығы 3·10<sup>8<\/sup> м/с.`,\n   ...mk(d,[d/60,d*10,d/10,d*1000],v=>sci(v)+\" км\"),\n   sol:[`t = ${c.s} с.`,`s = c·t = 3·10<sup>8<\/sup> · ${c.s} = ${sci(d*1000)} м = ${sci(d)} км.`]}}},\n{n:3,p:1,tp:\"speed\",\n t:\"Шамасы 54 км/сағ жылдамдықпен қозғалған автомобиль 1200 м қашықтықты қанша уақытта жүріп өтеді?\",\n o:[\"60 с\",\"45 с\",\"48 с\",\"80 с\",\"40 с\"],a:3,\n hint:\"Алдымен жылдамдықты м/с-қа ауыстыр: км/сағ-ты 3,6-ға бөлеміз. Содан кейін t = s / v.\",\n sol:[\"v = 54 км/сағ : 3,6 = 15 м/с.\",\"t = s / v = 1200 м : 15 м/с = 80 с.\"],\n gen(){const v=R([36,54,72,90,108]),vm=v/3.6,t=R([40,60,80,120]),s=vm*t;\n  return {t:`Шамасы ${v} км/сағ жылдамдықпен қозғалған автомобиль ${s} м қашықтықты қанша уақытта жүріп өтеді?`,\n   ...mk(t,[s/v,t/2,t+20,t*3.6/10*2],v=>nf(v,1)+\" с\"),\n   sol:[`v = ${v} : 3,6 = ${nf(vm)} м/с.`,`t = ${s} : ${nf(vm)} = ${t} с.`]}}},\n{n:4,p:1,tp:\"avg\",\n t:\"Поезд бір сағат 80 км/сағ жылдамдықпен және тағы бір сағат 110 км/сағ жылдамдықпен жүреді. Осы уақыттағы оның орташа жылдамдығы қандай?\",\n o:[\"95 км/сағ\",\"100 км/сағ\",\"85 км/сағ\",\"105 км/сағ\",\"110 км/сағ\"],a:0,\n hint:\"v<sub>орт<\/sub> = барлық жол / барлық уақыт. Уақыттар тең болса, бұл жылдамдықтардың арифметикалық ортасына тең.\",\n sol:[\"Барлық жол: 80 + 110 = 190 км.\",\"Барлық уақыт: 2 сағ.\",\"v<sub>орт<\/sub> = 190 : 2 = 95 км/сағ.\"],\n gen(){const v1=R([40,50,60,70]),v2=v1+R([20,30,40,60]);const av=(v1+v2)/2;\n  return {t:`Автобус бір сағат ${v1} км/сағ жылдамдықпен, тағы бір сағат ${v2} км/сағ жылдамдықпен жүрді. Орташа жылдамдығы қандай?`,\n   ...mk(av,[v1+v2,av+5,av-5,2*v1*v2/(v1+v2)],v=>nf(v,1)+\" км/сағ\"),\n   sol:[`Жол: ${v1} + ${v2} = ${v1+v2} км, уақыт: 2 сағ.`,`v<sub>орт<\/sub> = ${v1+v2} : 2 = ${nf(av)} км/сағ.`]}}},\n{n:5,p:1,tp:\"speed\",\n t:\"Моторлы қайық өзен ағысына қарсы 5 км жолды 30 минутта жүріп өтеді. Ағыс жылдамдығы 5 км/сағ. Суға қатысты қайықтың жылдамдығы қандай?\",\n o:[\"5 км/сағ\",\"10 км/сағ\",\"15 км/сағ\",\"20 км/сағ\",\"25 км/сағ\"],a:2,\n hint:\"Ағысқа қарсы жүргенде жағаға қатысты жылдамдық: v − u (v — қайықтың суға қатысты жылдамдығы, u — ағыс).\",\n sol:[\"Жағаға қатысты жылдамдық: 5 км : 0,5 сағ = 10 км/сағ.\",\"v − u = 10 → v = 10 + 5 = 15 км/сағ.\"],\n gen(){const c=R([[6,30],[4,20],[8,40],[5,30],[9,30],[3,15]]),u=R([2,3,4,6]);const vr=c[0]/(c[1]/60),v=vr+u;\n  return {t:`Моторлы қайық ағысқа қарсы ${c[0]} км жолды ${c[1]} минутта жүріп өтеді. Ағыс жылдамдығы ${u} км/сағ. Суға қатысты қайықтың жылдамдығы қандай?`,\n   ...mk(v,[vr,vr-u,vr+2*u,u],v=>nf(v)+\" км/сағ\"),\n   sol:[`Жағаға қатысты жылдамдық: ${c[0]} : ${nf(c[1]/60)} = ${nf(vr)} км/сағ.`,`v = ${nf(vr)} + ${u} = ${nf(v)} км/сағ.`]}}},\n{n:6,p:1,tp:\"dens\",\n t:\"Болат кубтың массасы 200 г. Қабырғасы екі есе үлкен кубтың массасы қандай болады?\",\n o:[\"1,2 кг\",\"1,6 кг\",\"0,8 кг\",\"0,4 кг\",\"3,2 кг\"],a:1,\n hint:\"Кубтың көлемі V = a³. Қабырғасы k есе өссе, көлемі (демек, массасы да) k³ есе өседі.\",\n sol:[\"Көлем 2³ = 8 есе артады.\",\"m = 200 г · 8 = 1600 г = 1,6 кг.\"],\n gen(){const m=R([100,150,250,300,50]),k=R([2,3]);const M=m*k**3/1000;\n  return {t:`Мыс кубтың массасы ${m} г. Қабырғасы ${k} есе үлкен кубтың массасы қандай болады?`,\n   ...mk(M,[m*k/1000,m*k*k/1000,m*k*2/1000,M*2],v=>nf(v)+\" кг\"),\n   sol:[`Көлем ${k}³ = ${k**3} есе артады.`,`m = ${m} г · ${k**3} = ${m*k**3} г = ${nf(M)} кг.`]}}},\n{n:7,p:1,tp:\"dens\",\n t:\"Көлемдері 45 см³ және 25 см³ болатын екі тау жыныстары үлгілерінің бірге алғандағы массасы 175 г. Жыныс материалының тығыздығы қандай?\",\n o:[\"1200 кг/м³\",\"1500 кг/м³\",\"2500 кг/м³\",\"3500 кг/м³\",\"3000 кг/м³\"],a:2,\n hint:\"ρ = m / V. Екі үлгінің көлемін қос. 1 г/см³ = 1000 кг/м³.\",\n sol:[\"V = 45 + 25 = 70 см³.\",\"ρ = 175 г : 70 см³ = 2,5 г/см³ = 2500 кг/м³.\"],\n gen(){const r=R([2000,2200,2500,3000,2600]),V1=R([15,20,30,40]),V2=R([10,25,35,50]);const m=(V1+V2)*r/1000;\n  return {t:`Көлемдері ${V1} см³ және ${V2} см³ болатын бір заттан жасалған екі үлгінің жалпы массасы ${nf(m)} г. Заттың тығыздығы қандай?`,\n   ...mk(r,[m/V1*1000,m/V2*1000,r/2,r*1.4],v=>Math.round(v)+\" кг/м³\"),\n   sol:[`V = ${V1} + ${V2} = ${V1+V2} см³.`,`ρ = ${nf(m)} : ${V1+V2} = ${nf(r/1000)} г/см³ = ${r} кг/м³.`]}}},\n{n:8,p:1,tp:\"dens\",\n t:\"Массасы 267 г болатын мыс үлгінің көлемі қандай? Мыс тығыздығының шамасы 8900 кг/м³.\",\n o:[\"30 см³\",\"1,6 см³\",\"0,8 см³\",\"0,4 см³\",\"0,2 см³\"],a:0,\n hint:\"V = m / ρ. Тығыздықты г/см³-ке ауыстыр: 8900 кг/м³ = 8,9 г/см³.\",\n sol:[\"ρ = 8900 кг/м³ = 8,9 г/см³.\",\"V = 267 г : 8,9 г/см³ = 30 см³.\"],\n gen(){const M=R([{n:\"мыс\",r:8900},{n:\"алюминий\",r:2700},{n:\"темір\",r:7800}]),V=R([10,20,30,40,50]);const m=V*M.r/1000;\n  return {t:`Массасы ${nf(m)} г болатын ${M.n} үлгінің көлемі қандай? Тығыздығы ${M.r} кг/м³.`,\n   ...mk(V,[V*10,V/10,V*2,V/2],v=>nf(v)+\" см³\"),\n   sol:[`ρ = ${nf(M.r/1000)} г/см³.`,`V = ${nf(m)} : ${nf(M.r/1000)} = ${V} см³.`]}}},\n{n:9,p:1,tp:\"dens\",\n t:\"Құрамы 30% ауа қуыстарымен толтырылған кварцтың орташа тығыздығы қандай? Кварц тығыздығы 2500 кг/м³.\",\n o:[\"2000 кг/м³\",\"1750 кг/м³\",\"1900 кг/м³\",\"1550 кг/м³\",\"1850 кг/м³\"],a:1,\n hint:\"Ауаның массасы өте аз — оны ескермейміз. Кварц көлемнің тек 70%-ын алады.\",\n sol:[\"1 м³ көлемнің 0,7 м³-і — кварц, 0,3 м³-і — ауа.\",\"Масса: 0,7 · 2500 = 1750 кг. Демек ρ = 1750 кг/м³.\"],\n gen(){const p=R([10,20,25,40]),M=R([{n:\"кварцтың\",r:2500},{n:\"граниттің\",r:2600},{n:\"мәрмәрдің\",r:2700}]);const v=M.r*(1-p/100);\n  return {t:`Көлемінің ${p}%-ы ауа қуыстары болатын ${M.n} орташа тығыздығы қандай? Таза материал тығыздығы ${M.r} кг/м³.`,\n   ...mk(v,[M.r*p/100,M.r*(1+p/100),M.r,M.r*(1-p/200)],v=>Math.round(v)+\" кг/м³\"),\n   sol:[`Материал көлемнің ${100-p}%-ын алады.`,`ρ = ${nf(1-p/100)} · ${M.r} = ${Math.round(v)} кг/м³.`]}}},\n{n:10,p:1,tp:\"elast\",\n t:\"Көлемі 100 см³ болатын алюминий үлгі астына қойылған сүйемелге қандай күшпен қысым жасайды? Алюминий тығыздығы 2700 кг/м³.\",\n o:[\"2,7 кН\",\"270 Н\",\"27 Н\",\"2,7 Н\",\"27 кН\"],a:3,\n hint:\"Тірекке әсер ететін күш — салмақ: P = mg = ρVg. Көлемді м³-ке ауыстыр: 1 см³ = 10<sup>−6<\/sup> м³.\",\n sol:[\"V = 100 см³ = 10<sup>−4<\/sup> м³.\",\"m = ρV = 2700 · 10<sup>−4<\/sup> = 0,27 кг.\",\"P = mg = 0,27 · 10 = 2,7 Н.\"],\n gen(){const M=R([{n:\"алюминий\",r:2700},{n:\"темір\",r:7800},{n:\"мыс\",r:8900}]),V=R([50,100,200,500]);const m=M.r*V/1e6,P=m*10;\n  return {t:`Көлемі ${V} см³ болатын ${M.n} дене тірекке қандай күшпен әсер етеді? Тығыздығы ${M.r} кг/м³, g = 10 Н/кг.`,\n   ...mk(P,[P*10,P/10,P*100,m],v=>nf(v)+\" Н\"),\n   sol:[`V = ${V}·10<sup>−6<\/sup> м³.`,`m = ${M.r} · ${V}·10<sup>−6<\/sup> = ${nf(m)} кг.`,`P = mg = ${nf(P)} Н.`]}}},\n{n:11,p:1,tp:\"elast\",\n t:\"Салмағы 250-граммдық жүкпен 0,5 см-ге созылған серіппенің қатаңдығы қандай?\",\n o:[\"500 Н/м\",\"250 Н/м\",\"5 кН/м\",\"2,5 кН/м\",\"25 кН/м\"],a:0,\n hint:\"Гук заңы: F = k·x, сондықтан k = F / x. Массаны кг-ға, созылуды метрге ауыстыр.\",\n sol:[\"F = mg = 0,25 · 10 = 2,5 Н.\",\"x = 0,5 см = 0,005 м.\",\"k = 2,5 : 0,005 = 500 Н/м.\"],\n gen(){const m=R([100,200,300,400,500]),x=R([0.5,1,2,4]);const F=m/100,k=F/(x/100);\n  return {t:`Массасы ${m} г жүк ілінген серіппе ${nf(x)} см-ге созылды. Серіппенің қатаңдығы қандай?`,\n   ...mk(k,[k*10,k/10,k*100,F/x],v=>nf(v)+\" Н/м\"),\n   sol:[`F = mg = ${nf(m/1000)} · 10 = ${nf(F)} Н.`,`x = ${nf(x/100)} м.`,`k = ${nf(F)} : ${nf(x/100)} = ${nf(k)} Н/м.`]}}},\n{n:12,p:1,tp:\"elast\",\n t:\"Массасы 250 г жүк серіппені 0,5 см-ге созады. Осы серіппені, салмағы 1,25 кг болатын жүк қаншаға созады?\",\n o:[\"8 см\",\"5 см\",\"1,5 см\",\"2,5 см\",\"25 см\"],a:3,\n hint:\"Бір серіппе үшін созылу жүктің массасына пропорционал: x ~ m. Масса неше есе өсті?\",\n sol:[\"1,25 кг : 0,25 кг = 5 есе.\",\"x = 0,5 см · 5 = 2,5 см.\"],\n gen(){const m1=R([200,250,400,500]),r=R([2,3,4,5]),x1=R([0.5,1,2]);const m2=m1*r/1000,x2=x1*r;\n  return {t:`Массасы ${m1} г жүк серіппені ${nf(x1)} см-ге созады. Осы серіппені массасы ${nf(m2)} кг жүк қаншаға созады?`,\n   ...mk(x2,[x1/r,x2*10,x1+r,x2/10],v=>nf(v)+\" см\"),\n   sol:[`${nf(m2)} кг : ${nf(m1/1000)} кг = ${r} есе.`,`x = ${nf(x1)} · ${r} = ${nf(x2)} см.`]}}},\n{n:13,p:1,tp:\"elast\",\n t:\"Қатаңдығы 800 Н/м болатын серіппені жүк өз салмағымен 8 мм-ге созады. Қатаңдығы 500 Н/м болатын серіппені дәл осы жүк қаншаға созады?\",\n o:[\"25 мм\",\"12,5 мм\",\"4 мм\",\"6,25 мм\",\"50 мм\"],a:1,\n hint:\"Жүктің салмағы өзгермейді: k₁x₁ = k₂x₂. Жұмсақ серіппе көбірек созылады.\",\n sol:[\"P = k₁x₁ = 800 · 0,008 = 6,4 Н.\",\"x₂ = P / k₂ = 6,4 : 500 = 0,0128 м ≈ 12,8 мм.\",\"Нұсқалардың ең жақыны — 12,5 мм.\"],\n gen(){const k1=R([600,800,1000,1200]),x1=R([5,6,10]),k2=R([200,300,400,500]);const x2=k1*x1/k2;\n  return {t:`Қатаңдығы ${k1} Н/м серіппені жүк ${x1} мм-ге созады. Қатаңдығы ${k2} Н/м серіппені дәл осы жүк қаншаға созады?`,\n   ...mk(x2,[k2*x1/k1,x1,x2*2,x1*(k1-k2)/100],v=>nf(v,2)+\" мм\"),\n   sol:[`P = ${k1} · ${nf(x1/1000)} = ${nf(k1*x1/1000)} Н.`,`x₂ = ${nf(k1*x1/1000)} : ${k2} = ${nf(x2,2)} мм.`]}}},\n{n:14,p:1,tp:\"fric\",\n t:\"Қандай-да бір ғаламшарда, массасы 15 кг жүктің, үйкеліс коэффициенті 0,3 болатын кедір-бұдырлы бет бойымен орнын ауыстыру үшін 27 Н күш қажет. Осы ғаламшардың G гравитациялық тұрақтысының мәні қандай?\",\n o:[\"10 Н/кг\",\"3 Н/кг\",\"6 Н/кг\",\"8 Н/кг\",\"18 Н/кг\"],a:2,\n hint:\"Бірқалыпты сүйрегенде тарту күші үйкеліс күшіне тең: F = μ·m·g. Мұндағы g — сол ғаламшардың G-сы.\",\n sol:[\"F = μ·m·G → G = F / (μ·m).\",\"G = 27 : (0,3 · 15) = 27 : 4,5 = 6 Н/кг.\"],\n gen(){const m=R([10,20,25,40]),mu=R([0.2,0.25,0.4,0.5]),G=R([2,4,6,8,12]);const F=mu*m*G;\n  return {t:`Бір ғаламшарда массасы ${m} кг жүкті үйкеліс коэффициенті ${nf(mu)} бет бойымен бірқалыпты сүйреу үшін ${nf(F)} Н күш қажет. Ғаламшардағы G қандай?`,\n   ...mk(G,[F/m,G*2,G/2,F*mu/m],v=>nf(v)+\" Н/кг\"),\n   sol:[`G = F / (μ·m) = ${nf(F)} : (${nf(mu)} · ${m}) = ${G} Н/кг.`]}}},\n{n:15,p:1,tp:\"fric\",\n t:\"Үстел бетімен білікшенің орнын ауыстыру үшін 30 Н күш қажет болатын болса, онда білікше мен үстел бетінің арасындағы үйкеліс коэффициентінің мәні қандай? Білікше массасы 5 кг.\",\n o:[\"0,3\",\"0,5\",\"0,6\",\"0,9\",\"0,2\"],a:2,\n hint:\"F = μ·m·g → μ = F / (m·g). g = 10 Н/кг.\",\n sol:[\"mg = 5 · 10 = 50 Н.\",\"μ = 30 : 50 = 0,6.\"],\n gen(){const m=R([2,4,5,8,10]),mu=R([0.2,0.3,0.4,0.5]);const F=mu*m*10;\n  return {t:`Массасы ${m} кг білікшені үстел бетімен бірқалыпты сүйреу үшін ${nf(F)} Н күш қажет. Үйкеліс коэффициенті қандай?`,\n   ...mk(mu,[F/m,mu/2,mu+0.3,mu*3],v=>nf(v,2)),\n   sol:[`mg = ${m*10} Н.`,`μ = ${nf(F)} : ${m*10} = ${nf(mu)}.`]}}},\n{n:16,p:2,tp:\"avg\",\n t:\"Сағат 14:00-де жүрге автобус белгіленген пунктке 17:00 мен 17:30 арасында жетеді. Ол жүрген жол 210 км-ден көп, бірақ 240 км-ден аз. Автобустың орташа жылдамдығы қандай болуы мүмкін?\",\n o:[\"60 км/сағ\",\"85 км/сағ\",\"75 км/сағ\",\"80 км/сағ\",\"50 км/сағ\"],a:2,\n hint:\"Жылдамдықтың ең кіші мүмкін мәні = ең қысқа жол / ең ұзақ уақыт. Ең үлкені = ең ұзын жол / ең қысқа уақыт.\",\n sol:[\"Уақыт: 3 сағ пен 3,5 сағ аралығы.\",\"v > 210 : 3,5 = 60 км/сағ.\",\"v < 240 : 3 = 80 км/сағ.\",\"60 < v < 80 → тек 75 км/сағ сәйкес келеді.\"],\n gen(){const c=R([{T1:2,T2:3,d1:150,d2:180,ok:70,d:[45,95,100,40]},{T1:3,T2:4,d1:200,d2:270,ok:60,d:[45,95,48,100]},{T1:4,T2:5,d1:300,d2:360,ok:80,d:[55,95,100,60]},{T1:2,T2:2.5,d1:100,d2:180,ok:60,d:[35,95,100,30]}]);\n  const S=R([8,9,10]);const hm=h=>`${String(Math.floor(h)).padStart(2,\"0\")}:${h%1?\"30\":\"00\"}`;\n  const r=mkS(c.ok+\" км/сағ\",c.d.map(x=>x+\" км/сағ\"));\n  return {t:`Сағат ${hm(S)}-де шыққан автобус пунктке ${hm(S+c.T1)} мен ${hm(S+c.T2)} арасында жетеді. Жол ${c.d1} км-ден көп, ${c.d2} км-ден аз. Орташа жылдамдығы қандай болуы мүмкін?`,...r,\n   sol:[`Уақыт: ${nf(c.T1)} сағ пен ${nf(c.T2)} сағ аралығы.`,`v > ${c.d1} : ${nf(c.T2)} = ${nf(c.d1/c.T2,1)} км/сағ.`,`v < ${c.d2} : ${nf(c.T1)} = ${nf(c.d2/c.T1,1)} км/сағ.`,`Аралыққа тек ${c.ok} км/сағ кіреді.`]}}},\n{n:17,p:2,tp:\"avg\",\n t:\"Жолдың жартысын 3 км/сағ жылдамдықпен жүріп, екінші жартысын 7 км/сағ жылдамдықпен жүгіріп өткен адамның орташа жылдамдығы қандай?\",\n o:[\"4,5 км/сағ\",\"4,2 км/сағ\",\"4 км/сағ\",\"5 км/сағ\",\"9 км/сағ\"],a:1,\n hint:\"Арифметикалық орта (3+7)/2 мұнда ЖАРАМАЙДЫ: жолдар тең, уақыттар тең емес. Барлық жол / барлық уақыт.\",\n sol:[\"Жолдың әр жартысы s болсын. t₁ = s/3, t₂ = s/7.\",\"v<sub>орт<\/sub> = 2s / (s/3 + s/7) = 2·3·7 / (3+7).\",\"v<sub>орт<\/sub> = 42 : 10 = 4,2 км/сағ.\"],\n gen(){const c=R([[3,6],[4,12],[6,12],[2,6],[10,15],[20,30],[40,60]]);const v=2*c[0]*c[1]/(c[0]+c[1]);\n  return {t:`Велосипедші жолдың жартысын ${c[0]} км/сағ, қалған жартысын ${c[1]} км/сағ жылдамдықпен жүрді. Орташа жылдамдығы қандай?`,\n   ...mk(v,[(c[0]+c[1])/2,c[0]+c[1],c[1]-c[0],v+1],v=>nf(v,1)+\" км/сағ\"),\n   sol:[`v<sub>орт<\/sub> = 2v₁v₂ / (v₁+v₂) = 2·${c[0]}·${c[1]} / ${c[0]+c[1]}.`,`v<sub>орт<\/sub> = ${nf(v)} км/сағ.`]}}},\n{n:18,p:2,tp:\"avg\",\n t:\"Поездың 10 минутқа кестеден қалып келе жатқан кешігуін жою үшін, машинист келу пунктіне 30 км қалған кезде жылдамдығын арттырады. Бастапқыда 80 км/сағ болған жылдамдық қаншаға өсті?\",\n o:[\"60 км/сағ-қа\",\"45 км/сағ-қа\",\"40 км/сағ-қа\",\"64 км/сағ-қа\",\"30 км/сағ-қа\"],a:3,\n hint:\"Кесте бойынша 30 км-ге қанша уақыт кетуі керек еді? Енді сол жолды 10 минут ерте жүру керек. Сұрақ — жылдамдық ҚАНШАҒА өсті (айырма).\",\n sol:[\"Кесте бойынша: t₀ = 30 : 80 = 0,375 сағ = 22,5 мин.\",\"Жаңа уақыт: 22,5 − 10 = 12,5 мин = 5/24 сағ.\",\"Жаңа жылдамдық: 30 : (5/24) = 144 км/сағ.\",\"Өсімі: 144 − 80 = 64 км/сағ.\"],\n gen(){const c=R([{s:20,v:60,t:4,d:15},{s:30,v:60,t:5,d:12},{s:12,v:40,t:6,d:20},{s:30,v:80,t:10,d:64}]);const t0=c.s/c.v*60,v1=c.v+c.d;\n  return {t:`Поезд ${c.t} минутқа кешігіп келеді. Пунктке ${c.s} км қалғанда машинист жылдамдықты арттырып, кестеге уақытында жетті. Бастапқы жылдамдық ${c.v} км/сағ болса, ол қаншаға өсті?`,\n   ...mk(c.d,[v1,c.d/2,c.s,c.v/2],v=>nf(v)+\" км/сағ-қа\"),\n   sol:[`Кесте бойынша: ${c.s} : ${c.v} сағ = ${nf(t0)} мин.`,`Жаңа уақыт: ${nf(t0-c.t)} мин.`,`Жаңа жылдамдық: ${c.s} : ${nf((t0-c.t)/60,4)} = ${v1} км/сағ.`,`Өсімі: ${v1} − ${c.v} = ${c.d} км/сағ.`]}}},\n{n:19,p:2,tp:\"dens\",\n t:\"Түбі мен қабырғалары өлшемдері 20×20×0,5 см болатын квадратты шыны табақтарынан жасалған, қақпағы жоқ бос аквариумның массасы қандай? Шыны тығыздығы 2500 кг/м³.\",\n o:[\"2,5 кг\",\"0,8 кг\",\"1 кг\",\"1,2 кг\",\"2,4 кг\"],a:0,\n hint:\"Қақпағы жоқ куб тәрізді аквариумда неше табақ бар? (түбі + бүйір қабырғалары). Шыны: 2,5 г/см³.\",\n sol:[\"Табақ саны: 1 түбі + 4 қабырға = 5.\",\"Бір табақ: V = 20·20·0,5 = 200 см³; барлығы 1000 см³.\",\"m = 1000 · 2,5 = 2500 г = 2,5 кг.\"],\n gen(){const a=R([20,30,40]),d=R([0.4,0.5,0.6]);const V=5*a*a*d,m=V*2.5/1000;\n  return {t:`Түбі мен қабырғалары ${a}×${a}×${nf(d)} см шыны табақтардан жасалған қақпақсыз аквариумның массасы қандай? Шыны тығыздығы 2500 кг/м³.`,\n   ...mk(m,[m*6/5,m*4/5,m/5,m*10],v=>nf(v,2)+\" кг\"),\n   sol:[`Табақ саны 5. Бір табақ: ${a}·${a}·${nf(d)} = ${nf(a*a*d)} см³.`,`V = ${nf(V)} см³; m = ${nf(V)} · 2,5 = ${nf(V*2.5)} г = ${nf(m,2)} кг.`]}}},\n{n:20,p:2,tp:\"dens\",\n t:\"Салмағы 3,12 кг болатын және 500 см³ көлемді алып тұратын болат бұйымдағы қуыстардың көлемі қандай? Болат тығыздығы 7800 кг/м³.\",\n o:[\"30 см³\",\"80 см³\",\"100 см³\",\"40 см³\",\"50 см³\"],a:2,\n hint:\"Болаттың өзінің көлемін тап: V = m / ρ. Қуыс = сыртқы көлем − болат көлемі.\",\n sol:[\"Болат көлемі: 3120 г : 7,8 г/см³ = 400 см³.\",\"Қуыс: 500 − 400 = 100 см³.\"],\n gen(){const Vs=R([200,300,400,500]),cav=R([50,100,150]);const V=Vs+cav,m=Vs*7.8/1000;\n  return {t:`Массасы ${nf(m)} кг, сыртқы көлемі ${V} см³ болат бұйымның ішіндегі қуыстың көлемі қандай? Болат тығыздығы 7800 кг/м³.`,\n   ...mk(cav,[Vs,V,cav*2,cav/2],v=>nf(v)+\" см³\"),\n   sol:[`Болат көлемі: ${nf(m*1000)} : 7,8 = ${Vs} см³.`,`Қуыс: ${V} − ${Vs} = ${cav} см³.`]}}},\n{n:21,p:2,tp:\"dens\",\n t:\"Тығыздықтары 400 кг/м³ және 600 кг/м³ болатын, бірдей массада алынған тынайтқыш ұнтақтары қоспасының тығыздығы қандай? Қоспа көлемі, оның құраушылары көлемдерінің қосындысына тең деп алыңыз.\",\n o:[\"480 кг/м³\",\"500 кг/м³\",\"540 кг/м³\",\"450 кг/м³\",\"900 кг/м³\"],a:0,\n hint:\"Массалар тең (m), көлемдер әртүрлі: V₁ = m/ρ₁, V₂ = m/ρ₂. ρ = 2m / (V₁+V₂). Арифметикалық орта (500) емес!\",\n sol:[\"ρ = 2m / (m/ρ₁ + m/ρ₂) = 2ρ₁ρ₂ / (ρ₁+ρ₂).\",\"ρ = 2·400·600 / 1000 = 480 кг/м³.\"],\n gen(){const c=R([[300,600],[600,900],[800,1200],[1000,1500],[400,1600]]);const r=2*c[0]*c[1]/(c[0]+c[1]);\n  return {t:`Тығыздықтары ${c[0]} кг/м³ және ${c[1]} кг/м³ екі сұйық бірдей массада араластырылды. Қоспа тығыздығы қандай? (көлемдер қосылады)`,\n   ...mk(r,[(c[0]+c[1])/2,c[0]+c[1],c[1]-c[0],r+20],v=>Math.round(v)+\" кг/м³\"),\n   sol:[`ρ = 2ρ₁ρ₂ / (ρ₁+ρ₂) = 2·${c[0]}·${c[1]} / ${c[0]+c[1]}.`,`ρ = ${Math.round(r)} кг/м³.`]}}},\n{n:22,p:2,tp:\"elast\",\n t:\"Қабырғасы 5 см болат куб, қатаңдығы 1,56 кН/м болатын серіппеге ілінген. Куб серіппені қандай шамаға созады? Болат тығыздығы 7800 кг/м³.\",\n o:[\"5 мм\",\"2,5 мм\",\"6,25 мм\",\"3,75 мм\",\"7,5 мм\"],a:2,\n hint:\"m = ρ·a³, P = mg, x = P / k. кН/м-ді Н/м-ге ауыстыр: 1,56 кН/м = 1560 Н/м.\",\n sol:[\"V = 5³ = 125 см³; m = 125 · 7,8 = 975 г = 0,975 кг.\",\"P = 9,75 Н.\",\"x = 9,75 : 1560 = 0,00625 м = 6,25 мм.\"],\n gen(){const a=R([2,3,4,5]),M=R([{n:\"алюминий\",r:2700},{n:\"болат\",r:7800}]),k=R([500,1000,2000]);const m=a**3*M.r/1e6,x=m*10/k*1000;\n  return {t:`Қабырғасы ${a} см ${M.n} куб қатаңдығы ${nf(k/1000)} кН/м серіппеге ілінген. Серіппе қаншаға созылады? Тығыздық ${M.r} кг/м³.`,\n   ...mk(x,[x*10,x/10,x*2,x/2],v=>nf(v,2)+\" мм\"),\n   sol:[`m = ${a**3} см³ · ${nf(M.r/1000)} = ${nf(m*1000)} г.`,`P = ${nf(m*10)} Н; x = ${nf(m*10)} : ${k} м = ${nf(x,2)} мм.`]}}},\n{n:23,p:2,tp:\"elast\",\n t:\"Қатаңдықтары 15 кН/м және 25 кН/м болатын екі серіппе тізбектей жалғанған. Жүйені қандай-да бір күшпен созады. Бірінші серіппенің ұзаруы 5 мм. Жүйені қандай күшпен созады және екінші серіппенің ұзаруы қандай?\",\n o:[\"50 Н, 5 мм\",\"75 Н, 5 мм\",\"50 Н, 3 мм\",\"75 Н, 3 мм\",\"50 Н, 15 мм\"],a:3,\n hint:\"Тізбектей жалғанған серіппелердің әрқайсысына бірдей күш әсер етеді: F = k₁x₁ = k₂x₂.\",\n sol:[\"F = k₁x₁ = 15000 · 0,005 = 75 Н.\",\"x₂ = F / k₂ = 75 : 25000 = 0,003 м = 3 мм.\"],\n gen(){let k1=R([10,20,30,40]),k2=R([15,25,50,60]);const x1=R([2,4,6]);const F=k1*x1,x2=F/k2,s=(a,b)=>`${nf(a)} Н, ${nf(b,2)} мм`;\n  return {t:`Қатаңдықтары ${k1} кН/м және ${k2} кН/м екі серіппе тізбектей жалғанған. Бірінші серіппенің ұзаруы ${x1} мм. Жүйені қандай күшпен созады және екінші серіппе қаншаға ұзарады?`,\n   ...mkS(s(F,x2),[s(F,x1),s(k2*x1,x1),s(k2*x1,x2),s(F*2,x2),s(F,x1+x2)]),\n   sol:[`F = ${k1}000 · ${nf(x1/1000)} = ${F} Н.`,`x₂ = ${F} : ${k2}000 = ${nf(x2,2)} мм.`]}}},\n{n:24,p:2,tp:\"fric\",\n t:\"Массасы 5 кг білікше кедір-бұдырлы бетте орналасқан. Білікше мен бет арасындағы үйкеліс коэффициенті 0,3. Денені 10 Н және 20 Н күшпен орнынан қозғалтуға тырысқан кезде, оған қандай үйкеліс күші әсер етеді? g = 10 м/с².\",\n o:[\"10 Н, 20 Н\",\"15 Н, 15 Н\",\"10 Н, 15 Н\",\"15 Н, 20 Н\",\"15 Н, 30 Н\"],a:2,\n hint:\"Тыныштық үйкеліс күші сыртқы күшке тең, бірақ μmg-дан аспайды. Дене қозғалғанда үйкеліс = μmg.\",\n sol:[\"Ең үлкен үйкеліс: μmg = 0,3 · 5 · 10 = 15 Н.\",\"10 Н < 15 Н → дене қозғалмайды, тыныштық үйкелісі = 10 Н.\",\"20 Н > 15 Н → дене сырғанайды, үйкеліс = 15 Н.\",\"Жауап: 10 Н және 15 Н. (Ресми кілтте B берілген, бірақ физикалық тұрғыдан дұрысы — C.)\"],\n gen(){const m=R([2,4,5,8]),mu=R([0.2,0.3,0.5]);const Fm=mu*m*10,F1=Math.round(Fm*0.6),F2=Math.round(Fm*1.5),s=(a,b)=>`${nf(a)} Н, ${nf(b)} Н`;\n  return {t:`Массасы ${m} кг білікше үйкеліс коэффициенті ${nf(mu)} бетте жатыр. Оны ${F1} Н, содан кейін ${F2} Н күшпен итерді. Әр жағдайда үйкеліс күші қандай?`,\n   ...mkS(s(F1,Fm),[s(F1,F2),s(Fm,Fm),s(Fm,F2),s(F1,F1)]),\n   sol:[`μmg = ${nf(Fm)} Н.`,`${F1} Н < ${nf(Fm)} Н → тыныштық үйкелісі ${F1} Н.`,`${F2} Н > ${nf(Fm)} Н → сырғанау үйкелісі ${nf(Fm)} Н.`]}}},\n{n:25,p:2,tp:\"fric\",\n t:\"Қатаңдығы 600 Н/м серіппенің көмегімен, массасы 1 кг білікшені кедір-бұдырлы бет бойымен бір қалыпты тартады. Білікше мен бет арасындағы үйкеліс коэффициенті 0,3. Серіппе қаншаға созылды?\",\n o:[\"5 см\",\"2,5 мм\",\"7,5 мм\",\"0,5 см\",\"0,75 см\"],a:3,\n hint:\"Бірқалыпты қозғалыста серпімділік күші үйкеліс күшіне тең: kx = μmg.\",\n sol:[\"μmg = 0,3 · 1 · 10 = 3 Н.\",\"x = 3 : 600 = 0,005 м = 0,5 см.\"],\n gen(){const k=R([200,400,500,600,800]),m=R([1,2,3]),mu=R([0.2,0.3,0.4]);const x=mu*m*10/k*100;\n  return {t:`Қатаңдығы ${k} Н/м серіппемен массасы ${m} кг білікшені бет бойымен бірқалыпты тартады. Үйкеліс коэффициенті ${nf(mu)}. Серіппе қаншаға созылды?`,\n   ...mk(x,[x*10,x/10,x*2,x/2],v=>nf(v,3)+\" см\"),\n   sol:[`F = μmg = ${nf(mu*m*10)} Н.`,`x = ${nf(mu*m*10)} : ${k} = ${nf(x/100,4)} м = ${nf(x,3)} см.`]}}},\n{n:26,p:3,tp:\"avg\",\n t:\"Жолдың қандай-да бір бөлігіндегі автомобильдың орташа жылдамдығының шамасы 60 км/сағ. Бастапқы үштен бір бөлігін 40 км/сағ жылдамдықпен өткен. Қалған үштен екі бөлігі қандай жылдамдықпен жүріп өтті?\",\n o:[\"80 км/сағ\",\"70 км/сағ\",\"72 км/сағ\",\"64 км/сағ\",\"128 км/сағ\"],a:0,\n hint:\"Барлық жолды L деп ал. Уақыттарды қос: L/v<sub>орт<\/sub> = (L/3)/v₁ + (2L/3)/v₂.\",\n sol:[\"L/60 = L/(3·40) + 2L/(3v₂).\",\"1/60 − 1/120 = 2/(3v₂) → 1/120 = 2/(3v₂).\",\"3v₂ = 240 → v₂ = 80 км/сағ.\"],\n gen(){const c=R([[60,30,120],[40,24,60],[45,30,60],[60,40,80]]);\n  return {t:`Автомобильдің бүкіл жолдағы орташа жылдамдығы ${c[0]} км/сағ. Жолдың алғашқы үштен бірін ${c[1]} км/сағ жылдамдықпен жүрді. Қалған бөлігін қандай жылдамдықпен жүрді?`,\n   ...mk(c[2],[(3*c[0]-c[1])/2,2*c[0]-c[1],c[0]+c[1],c[2]*1.6],v=>nf(v,1)+\" км/сағ\"),\n   sol:[`L/${c[0]} = L/(3·${c[1]}) + 2L/(3v₂).`,`2/(3v₂) = 1/${c[0]} − 1/${3*c[1]}.`,`v₂ = ${c[2]} км/сағ.`]}}},\n{n:27,p:3,tp:\"speed\",\n t:\"Моторлы қайық бірдей жолды өзен ағысымен 20 минутта, ал екі еселенген жылдамдықпен (суға қатысты) 12 минутта жүріп өтеді. Ағыс жылдамдығы 5 км/сағ. Бірінші жағдайдағы қайықтың жылдамдығы қандай?\",\n o:[\"20 км/сағ\",\"10 км/сағ\",\"12 км/сағ\",\"6 км/сағ\",\"24 км/сағ\"],a:1,\n hint:\"Екі жағдайда да қайық АҒЫСПЕН жүреді, жол бірдей: (v + u)·t₁ = (2v + u)·t₂.\",\n sol:[\"(v + 5)·20 = (2v + 5)·12.\",\"20v + 100 = 24v + 60.\",\"4v = 40 → v = 10 км/сағ.\"],\n gen(){const c=R([[3,30,18,6],[4,15,9,8],[2,25,15,4],[5,20,12,10],[6,20,12,12]]);\n  return {t:`Моторлы қайық бірдей жолды ағыспен ${c[1]} минутта, ал суға қатысты жылдамдығын екі есе арттырып ${c[2]} минутта жүреді. Ағыс жылдамдығы ${c[0]} км/сағ. Бірінші жағдайдағы суға қатысты жылдамдық қандай?`,\n   ...mk(c[3],[c[3]+c[0],2*c[3],c[3]*2+c[0],c[0]],v=>nf(v)+\" км/сағ\"),\n   sol:[`(v + ${c[0]})·${c[1]} = (2v + ${c[0]})·${c[2]}.`,`${c[1]}v + ${c[0]*c[1]} = ${2*c[2]}v + ${c[0]*c[2]}.`,`v = ${c[3]} км/сағ.`]}}},\n{n:28,p:3,tp:\"dens\",\n t:\"Тығыздығы 7800 кг/м³ болатын қоладағы (мыс пен қалайының қоспасы) мыстың мөлшері қандай? Мыс пен қалайының тығыздықтары сәйкесінше 8900 кг/м³ және 7300 кг/м³.\",\n o:[\"50%\",\"60%\",\"45%\",\"35%\",\"70%\"],a:3,\n hint:\"Мыстың массалық үлесі w болсын. Көлемдер қосылады: 1/ρ = w/ρ<sub>мыс<\/sub> + (1−w)/ρ<sub>қал<\/sub>.\",\n sol:[\"1/7800 = w/8900 + (1 − w)/7300.\",\"w = (1/7300 − 1/7800) / (1/7300 − 1/8900).\",\"w ≈ 0,36 → шамамен 35% (массасы бойынша).\"],\n gen(){const w=R([0.2,0.4,0.6,0.8]);const r=Math.round(1/(w/8900+(1-w)/7300)/10)*10,p=w*100;\n  return {t:`Тығыздығы ${r} кг/м³ қоладағы мыстың массалық үлесі қандай? Мыс — 8900 кг/м³, қалайы — 7300 кг/м³.`,\n   ...mk(p,[p+15,p-15,100-p,50],v=>Math.round(v)+\"%\"),\n   sol:[`1/${r} = w/8900 + (1 − w)/7300.`,`w = (1/7300 − 1/${r}) / (1/7300 − 1/8900) ≈ ${nf(w,2)} → ${p}%.`]}}},\n{n:29,p:3,tp:\"elast\",\n t:\"Қатаңдықтары 10 кН/м және 20 кН/м болатын серіппелер жүктердің әсерінен сәйкесінше 5 мм және 4 мм созылады. Егер жүктердің орнын ауыстыратын болсақ, серіппелердің созылуы қандай болады?\",\n o:[\"4 мм, 5 мм\",\"8 мм, 2,5 мм\",\"8 мм, 10 мм\",\"6 мм, 3 мм\",\"4 мм, 7,5 мм\"],a:1,\n hint:\"Алдымен әр жүктің салмағын тап: P = kx. Содан соң салмақтарды ауыстырып, x = P / k есепте.\",\n sol:[\"P₁ = 10000 · 0,005 = 50 Н; P₂ = 20000 · 0,004 = 80 Н.\",\"Ауыстырғанда: x₁ = 80 : 10000 = 0,008 м = 8 мм.\",\"x₂ = 50 : 20000 = 0,0025 м = 2,5 мм.\"],\n gen(){const k1=R([10,20,40]),k2=R([5,25,50]),x1=R([2,4,6]),x2=R([3,5,8]);const P1=k1*x1,P2=k2*x2,s=(a,b)=>`${nf(a,2)} мм, ${nf(b,2)} мм`;\n  return {t:`Қатаңдықтары ${k1} кН/м және ${k2} кН/м серіппелер жүктердің әсерінен сәйкесінше ${x1} мм және ${x2} мм созылады. Жүктердің орнын ауыстырса, созылулар қандай болады?`,\n   ...mkS(s(P2/k1,P1/k2),[s(x2,x1),s(P1/k2,P2/k1),s(P2/k2,P1/k1),s(x1*2,x2/2),s(x1,x2),s(P2/k1*2,P1/k2*2),s(P2/k1/2,P1/k2/2)]),\n   sol:[`P₁ = ${P1} Н, P₂ = ${P2} Н.`,`x₁′ = ${P2} : ${k1}000 = ${nf(P2/k1,2)} мм.`,`x₂′ = ${P1} : ${k2}000 = ${nf(P1/k2,2)} мм.`]}}},\n{n:30,p:3,tp:\"fric\",\n t:\"Бес ағаш білікшелер бумасы ағаш үстел үстінде орналасқан. Білікшелер мен үстел арасындағы және білікшелер арасындағы үйкеліс коэффициенті 0,2. Әр бір білікшенің массасы 200 г. Басқа білікшелерді ұстап тұрып, ортаңғы білікшені суырып алу үшін қандай күшпен әсер ету қажет?\",\n o:[\"1 Н\",\"2 Н\",\"3 Н\",\"4 Н\",\"7 Н\"],a:1,\n hint:\"Ортаңғы білікшеге ЕКІ беттен үйкеліс әсер етеді: үстіңгі бетіне 2 білікше, астыңғы бетіне 3 білікше (өзі де) қысады.\",\n sol:[\"Бір білікше салмағы: 0,2 · 10 = 2 Н.\",\"Үстіңгі бет: N = 2·2 = 4 Н → F₁ = 0,2 · 4 = 0,8 Н.\",\"Астыңғы бет: N = 3·2 = 6 Н → F₂ = 0,2 · 6 = 1,2 Н.\",\"F = 0,8 + 1,2 = 2 Н. (Ресми кілтте A берілген, бірақ есептеу бойынша дұрысы — B.)\"],\n gen(){const n=R([4,5,6,7]),k=R([2,3]),m=R([100,200,500]),mu=R([0.2,0.3,0.5]);const P=m/100,F=mu*P*(2*k-1);\n  return {t:`Бір-бірінің үстіне қойылған ${n} бірдей білікше бар. Әр білікшенің массасы ${m} г, барлық беттер арасындағы үйкеліс коэффициенті ${nf(mu)}. Басқаларын ұстап тұрып, үстінен санағанда ${ord(k)} білікшені суырып алу үшін қандай күш керек?`,\n   ...mk(F,[mu*P*k,mu*P*n,mu*P*(k-1),mu*P*2*k],v=>nf(v,2)+\" Н\"),\n   sol:[`Бір білікше салмағы P = ${nf(P)} Н.`,`Үстіңгі бет: ${k-1} білікше → ${nf(mu*P*(k-1),2)} Н.`,`Астыңғы бет: ${k} білікше → ${nf(mu*P*k,2)} Н.`,`F = ${nf(F,2)} Н.`]}}}\n];\nconst MAX=Q.reduce((s,q)=>s+q.p,0);\nfunction gen(q){let g;for(let k=0;k<30;k++){g=q.gen();if(g.o.length===5&&new Set(g.o).size===5)break}return g}\n\n/* ---------- күй ---------- */\nconst S={rvf:\"all\",screen:\"start\",name:\"\",variant:\"orig\",timed:true,items:[],ans:[],cur:0,endAt:0,ask:false,ew:null,res:null};\nlet tick=null;\nconst store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};\n\nfunction buildItems(variant){\n  return Q.map(q=>{ if(variant===\"orig\") return {n:q.n,p:q.p,tp:q.tp,t:q.t,o:q.o,a:q.a,sol:q.sol};\n    const g=gen(q); return {n:q.n,p:q.p,tp:q.tp,...g}; });\n}\n\n/* ---------- рендер ---------- */\nconst app=document.getElementById(\"app\");\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nfunction head(extra=\"\"){\n  return `<header class=\"form-head\"><div><div class=\"k\">Жасөспірімдер олимпиадасы · 7 сынып · Физика · ІІ кезең (2023)<\/div><h1>Олимпиадалық тренажер<\/h1><\/div>\n  <div class=\"row\">${S.name?`<span class=\"who\">${esc(S.name)}<\/span>`:\"\"}${extra}<\/div><\/header>`;\n}\nfunction render(){ ({start:rStart,test:rTest,result:rResult,ew:rEW,final:rFinal})[S.screen](); }\n\nfunction rStart(){\n  const h=store.get(\"olimp7_hist\",[]);\n  app.innerHTML=head()+`<div class=\"start\">\n  <section class=\"sheet\">\n    <h2>Тестті тапсыр, содан кейін қателеріңмен жұмыс жаса<\/h2>\n    <p>30 тапсырма, нұсқадан біреуін таңда. Тест соңында әр қате сұраққа қайта ораласың: алдымен еске салу, керек болса шешудің келесі қадамы, дұрыс тапқан соң — сандары басқа ұқсас есеп. Ұқсас есепті де шығарғанда ғана қате «түзетілді» деп белгіленеді.<\/p>\n    <form id=\"f\">\n      <div class=\"field\"><label for=\"nm\">Аты-жөнің<\/label><input id=\"nm\" autocomplete=\"off\" placeholder=\"мысалы: Әлібек Сәрсенов\" value=\"${esc(S.name)}\"><\/div>\n      <div class=\"choice\">\n        <label><input type=\"radio\" name=\"v\" value=\"orig\" ${S.variant===\"orig\"?\"checked\":\"\"}><span><b>Түпнұсқа олимпиада<\/b><small>2023 жылғы аудандық кезеңнің 30 тапсырмасы өз сандарымен<\/small><\/span><\/label>\n        <label><input type=\"radio\" name=\"v\" value=\"twin\" ${S.variant===\"twin\"?\"checked\":\"\"}><span><b>Жаңа сандармен нұсқа<\/b><small>Сол 30 тапсырма, бірақ сандар әр жолы жаңадан шығады<\/small><\/span><\/label>\n      <\/div>\n      <div class=\"choice\"><label><input type=\"checkbox\" id=\"tm\" ${S.timed?\"checked\":\"\"}><span><b>Уақытпен — 90 минут<\/b><small>Олимпиададағыдай: уақыт біткенде тест өздігінен тапсырылады<\/small><\/span><\/label><\/div>\n      <div class=\"err-msg\" id=\"em\"><\/div>\n      <button class=\"btn primary\" type=\"submit\">Тестті бастау<\/button>\n    <\/form>\n  <\/section>\n  <aside class=\"sheet\">\n    <h3 style=\"font-size:1.15rem;margin-bottom:8px\">Бағалау ережесі<\/h3>\n    <table class=\"rules\"><thead><tr><th>Сұрақтар<\/th><th>Дұрыс жауап<\/th><\/tr><\/thead><tbody>\n      <tr><td>1–15<\/td><td class=\"mono\">+1<\/td><\/tr><tr><td>16–25<\/td><td class=\"mono\">+2<\/td><\/tr><tr><td>26–30<\/td><td class=\"mono\">+3<\/td><\/tr>\n      <tr><td>Қате жауап<\/td><td class=\"mono\" style=\"color:var(--pen)\">−1<\/td><\/tr><tr><td>Белгіленбеген сұрақ<\/td><td class=\"mono\">0<\/td><\/tr>\n      <tr><th>Ең көп ұпай<\/th><th class=\"mono\">${MAX}<\/th><\/tr><\/tbody><\/table>\n    <p class=\"note\" style=\"margin-top:10px\">Қате жауап ұпай шегереді, сондықтан білмеген сұрақты бос қалдырған тиімдірек.<\/p>\n    ${h.length?`<div class=\"hist\"><b>Осы құрылғыдағы соңғы нәтижелер<\/b>${h.slice(-6).reverse().map(x=>`<div><span>${esc(x.name)} · ${x.date}<\/span><span class=\"mono\">${x.score}/${MAX}<\/span><\/div>`).join(\"\")}<\/div>`:\"\"}\n  <\/aside><\/div>`;\n  document.getElementById(\"f\").onsubmit=e=>{e.preventDefault();\n    const nm=document.getElementById(\"nm\").value.trim();\n    if(!nm){document.getElementById(\"em\").textContent=\"Аты-жөніңді жаз — нәтиже соған жазылады.\";return}\n    S.name=nm;S.variant=app.querySelector('input[name=v]:checked').value;S.timed=document.getElementById(\"tm\").checked;\n    S.items=buildItems(S.variant);S.ans=Array(30).fill(null);S.cur=0;S.ask=false;\n    S.endAt=S.timed?Date.now()+90*60e3:0;S.screen=\"test\";startTimer();render();window.scrollTo(0,0);};\n}\n\nfunction startTimer(){ clearInterval(tick); if(!S.timed) return;\n  tick=setInterval(()=>{const el=document.getElementById(\"tmr\"); const left=S.endAt-Date.now();\n    if(left<=0){clearInterval(tick);finish();return}\n    if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=`${String(m).padStart(2,\"0\")}:${String(s).padStart(2,\"0\")}`;el.classList.toggle(\"low\",left<5*60e3)}},500);\n}\n\nfunction bubbleSheet(mode){ // mode: \"test\" | \"review\"\n  const grp=[[0,15,\"1 ұпайлық · 1–15\"],[15,25,\"2 ұпайлық · 16–25\"],[25,30,\"3 ұпайлық · 26–30\"]];\n  let h=\"\";\n  for(const [a,b,t] of grp){ h+=`<h3>${t}<\/h3>`;\n    for(let i=a;i<b;i++){ const it=S.items[i],an=S.ans[i];\n      h+=`<div class=\"brow ${mode===\"test\"&&i===S.cur?\"cur\":\"\"}\"><span class=\"num\" data-go=\"${i}\">${i+1}<\/span>`;\n      for(let j=0;j<5;j++){ let c=\"\";\n        if(mode===\"test\") c=an===j?\"on\":\"\";\n        else { if(j===it.a) c=an===j?\"right\":\"key\"; else if(an===j) c=\"wrong\"; }\n        h+=`<button class=\"bub ${c}\" ${mode===\"test\"?`data-q=\"${i}\" data-o=\"${j}\"`:\"disabled\"} aria-label=\"${i+1}-сұрақ, ${LET[j]}\">${LET[j]}<\/button>`;}\n      h+=\"<\/div>\"; } }\n  const done=S.ans.filter(x=>x!==null).length;\n  return `<div class=\"sheet bubbles\">${h}<div class=\"sheetfoot\"><span>Белгіленді: <b class=\"mono\">${done}/30<\/b><\/span>${mode===\"test\"?`<span>Бланк<\/span>`:\"\"}<\/div><\/div>`;\n}\n\nfunction rTest(){\n  const it=S.items[S.cur],an=S.ans[S.cur];\n  const timer=S.timed?`<span class=\"timer\" id=\"tmr\">90:00<\/span>`:\"\";\n  const blank=S.ans.filter(x=>x===null).length;\n  app.innerHTML=head(timer)+`<div class=\"test\">${bubbleSheet(\"test\")}\n  <section class=\"sheet\">\n    <div class=\"q-meta\"><span class=\"q-num\">${it.n}<\/span><span class=\"chip p${it.p}\">${it.p} ұпай<\/span><span>${TOPICS[it.tp]}<\/span><\/div>\n    <div class=\"q-text\">${it.t}<\/div>\n    <div class=\"opts\">${it.o.map((o,j)=>`<button class=\"opt ${an===j?\"on\":\"\"}\" data-o=\"${j}\"><span class=\"L\">${LET[j]}<\/span><span>${o}<\/span><\/button>`).join(\"\")}<\/div>\n    ${an!==null?`<p class=\"note\" style=\"margin-top:10px\">Жауапты өшіру үшін таңдалған нұсқаны қайта бас.<\/p>`:\"\"}\n    <div class=\"q-nav\">\n      <div class=\"row\"><button class=\"btn ghost\" id=\"prev\" ${S.cur===0?\"disabled\":\"\"}>← Алдыңғы<\/button><button class=\"btn\" id=\"next\" ${S.cur===29?\"disabled\":\"\"}>Келесі →<\/button><\/div>\n      <button class=\"btn red\" id=\"sub\">Тестті тапсыру<\/button>\n    <\/div>\n    ${S.ask?`<div class=\"confirm\"><b>Тестті тапсырасың ба?<\/b> ${blank?`Белгіленбеген сұрақ: <b>${blank}<\/b>.`:\"Барлық сұраққа жауап бердің.\"} Тапсырғаннан кейін жауапты өзгерту мүмкін емес.\n      <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn red\" id=\"yes\">Иә, тапсырамын<\/button><button class=\"btn ghost\" id=\"no\">Жоқ, жалғастырамын<\/button><\/div><\/div>`:\"\"}\n  <\/section><\/div>`;\n  if(S.timed){const left=S.endAt-Date.now(),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const el=document.getElementById(\"tmr\");el.textContent=`${String(m).padStart(2,\"0\")}:${String(s).padStart(2,\"0\")}`;el.classList.toggle(\"low\",left<5*60e3)}\n  app.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>{const j=+b.dataset.o;S.ans[S.cur]=S.ans[S.cur]===j?null:j;render()});\n  app.querySelectorAll(\".bub[data-q]\").forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.o;S.ans[i]=S.ans[i]===j?null:j;S.cur=i;render()});\n  app.querySelectorAll(\"[data-go]\").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;render()});\n  document.getElementById(\"prev\").onclick=()=>{S.cur--;S.ask=false;render()};\n  document.getElementById(\"next\").onclick=()=>{S.cur++;S.ask=false;render()};\n  document.getElementById(\"sub\").onclick=()=>{S.ask=true;render();const c=app.querySelector(\".confirm\");if(c)c.scrollIntoView({block:\"center\"})};\n  if(S.ask){document.getElementById(\"yes\").onclick=finish;document.getElementById(\"no\").onclick=()=>{S.ask=false;render()}}\n}\n\nfunction finish(){\n  clearInterval(tick);\n  let score=0,ok=0,bad=0,skip=0;const tp={};\n  S.items.forEach((it,i)=>{const an=S.ans[i];tp[it.tp]=tp[it.tp]||{got:0,max:0,miss:0};tp[it.tp].max+=it.p;\n    if(an===null){skip++;tp[it.tp].miss++}else if(an===it.a){ok++;score+=it.p;tp[it.tp].got+=it.p}else{bad++;score-=1;tp[it.tp].miss++}});\n  const wrong=S.items.map((it,i)=>i).filter(i=>S.ans[i]!==S.items[i].a);\n  S.res={score,ok,bad,skip,tp,wrong,date:new Date().toLocaleDateString(\"ru-RU\")};\n  const h=store.get(\"olimp7_hist\",[]);h.push({name:S.name,date:S.res.date,score});store.set(\"olimp7_hist\",h.slice(-30));\n  S.ew={list:wrong.map(i=>({i,stage:0,tries:0,solved:false,twin:null,twinPick:null,twinTries:0,fixed:false,pick:null})),pos:0};\n  S.screen=\"result\";S.ask=false;S.rvf=\"all\";render();window.scrollTo(0,0);\n}\n\nfunction topicBars(){\n  return Object.keys(TOPICS).map(k=>{const t=S.res.tp[k];if(!t)return\"\";const pc=Math.max(0,Math.round(t.got/t.max*100));\n    return `<div class=\"topic\"><div class=\"tn\"><span>${TOPICS[k]}<\/span><span class=\"mono\">${t.got}/${t.max}<\/span><\/div><div class=\"bar\"><i class=\"${pc<50?\"low\":pc<80?\"mid\":\"\"}\" style=\"width:${pc}%\"><\/i><\/div><\/div>`}).join(\"\");\n}\nfunction resultText(){\n  const r=S.res;\n  return `Олимпиадалық тренажер, 7 сынып (физика)\\nОқушы: ${S.name}\\nКүні: ${r.date}\\nНұсқа: ${S.variant===\"orig\"?\"түпнұсқа\":\"жаңа сандармен\"}\\nҰпай: ${r.score} / ${MAX}\\nДұрыс: ${r.ok}, қате: ${r.bad}, бос: ${r.skip}\\nҚате/бос сұрақтар: ${r.wrong.map(i=>i+1).join(\", \")||\"жоқ\"}\\n`+\n   Object.keys(TOPICS).map(k=>r.tp[k]?`${TOPICS[k]}: ${r.tp[k].got}/${r.tp[k].max}`:\"\").filter(Boolean).join(\"\\n\");\n}\nfunction rResult(){\n  const r=S.res,pc=Math.round(Math.max(0,r.score)/MAX*100);\n  app.innerHTML=head()+`<section class=\"sheet\">\n    <div class=\"score-line\"><div><div class=\"note\">Жиналған ұпай<\/div><div class=\"big\">${r.score}<small> / ${MAX}<\/small><\/div><\/div>\n    <div class=\"tally\"><span class=\"t-ok\">Дұрыс <b>${r.ok}<\/b><\/span><span class=\"t-bad\">Қате <b>${r.bad}<\/b><\/span><span class=\"t-skip\">Бос <b>${r.skip}<\/b><\/span><span>Нәтиже <b class=\"mono\">${pc}%<\/b><\/span><\/div><\/div>\n    ${r.wrong.length?`<p style=\"margin:14px 0 0\">Қатемен жұмыс жасайтын сұрақтар: <b>${r.wrong.length}<\/b>. Әрқайсысын түзетіп, ұқсас есеппен бекіт.<\/p>\n      <div class=\"row\" style=\"margin-top:12px\"><button class=\"btn red\" id=\"go\">Қатемен жұмысты бастау<\/button><\/div>`\n      :`<p style=\"margin:14px 0 0;color:var(--ok);font-weight:700\">Барлық 30 сұраққа дұрыс жауап бердің. Тамаша!<\/p><div class=\"row\" style=\"margin-top:12px\"><button class=\"btn primary\" id=\"again\">Жаңа сандармен қайта шығару<\/button><\/div>`}\n  <\/section>\n  <section class=\"sheet\" style=\"margin-top:20px\">\n    <h3 style=\"font-size:1.25rem;margin-bottom:4px\">Тест жауаптары: барлық 30 сұрақ<\/h3>\n    <p class=\"note\" style=\"margin:0 0 10px\">Жасыл — дұрыс жауап. Қызылмен сызылғаны — сенің қате жауабың. Дұрыс шығарған сұрақтарыңда сенің жауабың жасылмен «сенің жауабың — дұрыс» деп белгіленген.<\/p>\n    <div class=\"row rv-filter\">\n      <button class=\"btn ${S.rvf===\"all\"?\"primary\":\"ghost\"}\" data-f=\"all\">Барлығы (30)<\/button>\n      <button class=\"btn ${S.rvf===\"bad\"?\"primary\":\"ghost\"}\" data-f=\"bad\">Қате және бос (${r.wrong.length})<\/button>\n      <button class=\"btn ${S.rvf===\"ok\"?\"primary\":\"ghost\"}\" data-f=\"ok\">Дұрыс (${r.ok})<\/button>\n    <\/div>\n    ${S.items.map((it,i)=>{const an=S.ans[i],st=an===null?\"skip\":an===it.a?\"ok\":\"bad\";\n      if(S.rvf===\"bad\"&&st===\"ok\"||S.rvf===\"ok\"&&st!==\"ok\") return \"\";\n      const k=S.ew.list.findIndex(x=>x.i===i),e=S.ew.list[k];\n      const chip=st===\"ok\"?`<span class=\"chip st-ok\">Дұрыс · +${it.p}<\/span>`:(e&&e.fixed?`<span class=\"chip st-ok\">Түзетілді<\/span> `:\"\")+`<span class=\"chip st-bad\">${st===\"skip\"?\"Бос қалды · 0\":\"Қате · −1\"}<\/span>`;\n      return `<article class=\"rv\">\n        <div class=\"q-meta\"><span class=\"q-num\" style=\"font-size:1.6rem\">${it.n}<\/span><span class=\"chip p${it.p}\">${it.p} ұпай<\/span><span>${TOPICS[it.tp]}<\/span>${chip}<\/div>\n        <div class=\"q-text\" style=\"margin-bottom:10px\">${it.t}<\/div>\n        <ul class=\"rv-opts\">${it.o.map((o,j)=>{const c=j===it.a?\"good\":(j===an?\"bad\":\"\");\n          const lbl=j===it.a&&j===an?\"сенің жауабың — дұрыс\":j===it.a?\"дұрыс жауап\":j===an?\"сенің жауабың\":\"\";\n          return `<li class=\"${c}\"><span class=\"L\">${LET[j]}<\/span><span>${o}${lbl?` <em>— ${lbl}<\/em>`:\"\"}<\/span><\/li>`}).join(\"\")}<\/ul>\n        ${st===\"skip\"?`<p class=\"note\" style=\"margin:6px 0 0\">Бұл сұраққа жауап белгіленбеген.<\/p>`:\"\"}\n        ${e&&!e.fixed?`<button class=\"btn\" data-ew=\"${k}\" style=\"margin-top:10px\">Осы қатемен жұмыс жасау →<\/button>`:\"\"}\n      <\/article>`}).join(\"\")}\n  <\/section>\n  <div class=\"res-grid\">\n    <section class=\"sheet\"><h3 style=\"font-size:1.1rem;margin-bottom:10px\">Сұрақтар бойынша<\/h3><div class=\"tbl-wrap\"><table class=\"res\">\n      <thead><tr><th>№<\/th><th>Тақырып<\/th><th>Сенің<\/th><th>Дұрыс<\/th><th>Ұпай<\/th><\/tr><\/thead><tbody>\n      ${S.items.map((it,i)=>{const an=S.ans[i],st=an===null?\"skip\":an===it.a?\"ok\":\"bad\";\n        return `<tr><td class=\"mono\">${i+1}<\/td><td>${TOPICS[it.tp]}<\/td><td class=\"c\">${an===null?\"—\":LET[an]}<\/td><td class=\"c\">${LET[it.a]}<\/td><td class=\"c mark-${st}\">${st===\"ok\"?\"+\"+it.p:st===\"bad\"?\"−1\":\"0\"}<\/td><\/tr>`}).join(\"\")}\n      <\/tbody><\/table><\/div><\/section>\n    <div style=\"display:grid;gap:20px;align-content:start\">\n      <section class=\"sheet\"><h3 style=\"font-size:1.1rem;margin-bottom:12px\">Тақырыптар бойынша<\/h3>${topicBars()}<p class=\"note\">Қызыл жолақ — қайталау керек тақырып.<\/p><\/section>\n      <section class=\"sheet\"><h3 style=\"font-size:1.1rem;margin-bottom:8px\">Мұғалімге жіберу<\/h3>\n        <textarea class=\"copybox\" id=\"cb\" readonly>${esc(resultText())}<\/textarea>\n        <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn\" id=\"cp\">Нәтижені көшіру<\/button><span class=\"note\" id=\"cpm\"><\/span><\/div><\/section>\n    <\/div><\/div>`;\n  const go=document.getElementById(\"go\");if(go)go.onclick=()=>{S.screen=\"ew\";render();window.scrollTo(0,0)};\n  app.querySelectorAll(\"[data-f]\").forEach(b=>b.onclick=()=>{S.rvf=b.dataset.f;const y=app.querySelector(\".rv-filter\").getBoundingClientRect().top;render();const f=app.querySelector(\".rv-filter\");window.scrollBy(0,f.getBoundingClientRect().top-y)});\n  app.querySelectorAll(\"[data-ew]\").forEach(b=>b.onclick=()=>{S.ew.pos=+b.dataset.ew;S.screen=\"ew\";render();window.scrollTo(0,0)});\n  const ag=document.getElementById(\"again\");if(ag)ag.onclick=()=>{S.variant=\"twin\";S.screen=\"start\";render()};\n  document.getElementById(\"cp\").onclick=()=>{const t=document.getElementById(\"cb\");const m=document.getElementById(\"cpm\");\n    const fb=()=>{t.focus();t.select();m.textContent=\"Мәтін белгіленді — Ctrl+C бас.\"};\n    try{navigator.clipboard.writeText(t.value).then(()=>m.textContent=\"Көшірілді.\",fb)}catch(e){fb()}};\n}\n\n/* ---------- қатемен жұмыс ---------- */\nfunction rEW(){\n  const E=S.ew,e=E.list[E.pos],it=S.items[e.i],q=Q[e.i];\n  const fixedN=E.list.filter(x=>x.fixed).length;\n  const prevAns=S.ans[e.i];\n  const stepsShown=e.solved?it.sol.length:Math.min(e.stage,it.sol.length-1);\n  let h=head()+`<section class=\"sheet\">\n  <div class=\"ew-top\"><div><div class=\"note\">Қатемен жұмыс · түзетілді <b class=\"mono\">${fixedN}/${E.list.length}<\/b><\/div><\/div>\n    <div class=\"ew-dots\">${E.list.map((x,k)=>`<span class=\"${x.fixed?\"done\":\"\"} ${k===E.pos?\"cur\":\"\"}\" title=\"${x.i+1}-сұрақ\">${x.i+1}<\/span>`).join(\"\")}<\/div><\/div>\n  <div class=\"q-meta\"><span class=\"q-num\">${it.n}<\/span><span class=\"chip p${it.p}\">${it.p} ұпай<\/span><span>${TOPICS[it.tp]}<\/span><\/div>\n  <p class=\"redpen\">${prevAns===null?\"Тестте бұл сұрақ бос қалды.\":`Тестте сен «${LET[prevAns]}» деп белгіледің — бұл қате.`}${e.solved?\"\":\" Қайта ойлан.\"}<\/p>\n  <div class=\"q-text\">${it.t}<\/div>`;\n  if(!e.solved) h+=`<div class=\"hint\"><b>Еске түсір.<\/b> ${q.hint}<\/div>`;\n  if(stepsShown>0) h+=`<ol class=\"steps\"><div class=\"ttl\">${e.solved?\"Толық шешуі\":\"Шешудің басы\"}<\/div>${it.sol.slice(0,stepsShown).map(s=>`<li>${s}<\/li>`).join(\"\")}<\/ol>`;\n  h+=`<div class=\"opts\">${it.o.map((o,j)=>{let c=\"\";\n      if(e.solved&&j===it.a)c=\"good\";else if(j===prevAns||(e.bad&&e.bad.includes(j)))c=\"bad\";\n      return `<button class=\"opt ${c}\" data-o=\"${j}\" ${e.solved||c===\"bad\"?\"disabled\":\"\"}><span class=\"L\">${LET[j]}<\/span><span>${o}<\/span><\/button>`}).join(\"\")}<\/div>`;\n  if(e.msg) h+=`<div class=\"feedback ${e.msgOk?\"ok\":\"bad\"}\">${e.msg}<\/div>`;\n\n  if(e.solved){\n    if(!e.twin) e.twin=gen(q);\n    const tw=e.twin;\n    h+=`<div class=\"twin\"><div class=\"tag\">Бекіту: ұқсас есеп<\/div>\n      <div class=\"q-text\" style=\"margin-top:6px\">${tw.t}<\/div>\n      <div class=\"opts\">${tw.o.map((o,j)=>{let c=\"\";if(e.twinPick!==null){if(j===tw.a&&e.twinPick===j)c=\"good\";else if(j===e.twinPick)c=\"bad\";}\n        return `<button class=\"opt ${c}\" data-t=\"${j}\" ${e.twinPick!==null?\"disabled\":\"\"}><span class=\"L\">${LET[j]}<\/span><span>${o}<\/span><\/button>`}).join(\"\")}<\/div>`;\n    if(e.twinPick!==null){\n      if(e.twinPick===tw.a) h+=`<div class=\"feedback ok\">Дұрыс! ${it.n}-сұрақтағы қате түзетілді.<\/div>`;\n      else h+=`<div class=\"feedback bad\">Әзірге қате. Шешуін қара да, тағы бір ұқсас есепті шығар.<\/div><ol class=\"steps\"><div class=\"ttl\">Осы есептің шешуі<\/div>${tw.sol.map(s=>`<li>${s}<\/li>`).join(\"\")}<li>Дұрыс жауап: <b>${LET[tw.a]}) ${tw.o[tw.a]}<\/b><\/li><\/ol>`;\n    }\n    h+=`<\/div>`;\n  }\n  const allFixed=E.list.every(x=>x.fixed);\n  h+=`<div class=\"q-nav\"><div class=\"row\">\n      <button class=\"btn ghost\" id=\"back\">Қате сұрақтар тізімі<\/button>\n      <button class=\"btn ghost\" id=\"ep\" ${E.pos===0?\"disabled\":\"\"}>← Алдыңғы қате<\/button>\n      <button class=\"btn ghost\" id=\"en\" ${E.pos===E.list.length-1?\"disabled\":\"\"}>Келесі қате →<\/button><\/div>\n      <div class=\"row\">${e.solved&&e.twinPick!==null&&e.twinPick!==e.twin.a?`<button class=\"btn primary\" id=\"nt\">Тағы бір ұқсас есеп<\/button>`:\"\"}\n      ${e.fixed&&!allFixed?`<button class=\"btn primary\" id=\"nx\">Келесі түзетілмеген қате →<\/button>`:\"\"}\n      ${allFixed?`<button class=\"btn primary\" id=\"fin\">Қорытынды<\/button>`:\"\"}<\/div><\/div><\/section>`;\n  app.innerHTML=h;\n\n  app.querySelectorAll(\".opt[data-o]\").forEach(b=>b.onclick=()=>{const j=+b.dataset.o;e.tries++;\n    if(j===it.a){e.solved=true;e.msg=e.tries===1?\"Дұрыс! Енді толық шешуін қарап шық.\":\"Дұрыс! Шешуін тағы бір рет оқып шық.\";e.msgOk=true;}\n    else{e.bad=(e.bad||[]).concat(j);e.stage=Math.min(e.stage+1,it.sol.length-1);e.msg=e.stage>0?\"Қате. Төменде шешудің бір қадамы ашылды — соны жалғастыр.\":\"Қате. Кеңесті қайта оқы.\";e.msgOk=false;}\n    render()});\n  app.querySelectorAll(\".opt[data-t]\").forEach(b=>b.onclick=()=>{const j=+b.dataset.t;e.twinPick=j;e.twinTries++;if(j===e.twin.a)e.fixed=true;render()});\n  const on=(id,f)=>{const x=document.getElementById(id);if(x)x.onclick=f};\n  on(\"back\",()=>{S.screen=\"result\";render();const x=app.querySelector(\".rv\");if(x)x.scrollIntoView()});\n  on(\"ep\",()=>{E.pos--;render();window.scrollTo(0,0)});\n  on(\"en\",()=>{E.pos++;render();window.scrollTo(0,0)});\n  on(\"nt\",()=>{e.twin=gen(q);e.twinPick=null;render()});\n  on(\"nx\",()=>{const k=E.list.findIndex((x,ix)=>!x.fixed&&ix>E.pos);E.pos=k>=0?k:E.list.findIndex(x=>!x.fixed);render();window.scrollTo(0,0)});\n  on(\"fin\",()=>{S.screen=\"final\";render();window.scrollTo(0,0)});\n}\n\nfunction rFinal(){\n  const E=S.ew;\n  const easy=E.list.filter(x=>x.tries===1&&x.twinTries===1).length;\n  app.innerHTML=head()+`<section class=\"sheet\">\n    <h2 style=\"font-size:1.5rem;margin-bottom:8px\">Қатемен жұмыс аяқталды<\/h2>\n    <p style=\"max-width:62ch\">${E.list.length} қатенің бәрі түзетіліп, ұқсас есеппен бекітілді. Оның ${easy}-і бірінші әрекеттен шықты. Көп әрекет кеткен сұрақтардың тақырыбын оқулықтан тағы бір рет қарап шық.<\/p>\n    <div class=\"tbl-wrap\"><table class=\"res\" style=\"max-width:640px\"><thead><tr><th>№<\/th><th>Тақырып<\/th><th>Қайта шешу әрекеті<\/th><th>Ұқсас есеп әрекеті<\/th><\/tr><\/thead><tbody>\n    ${E.list.map(x=>`<tr><td class=\"mono\">${x.i+1}<\/td><td>${TOPICS[S.items[x.i].tp]}<\/td><td class=\"c\">${x.tries}<\/td><td class=\"c\">${x.twinTries}<\/td><\/tr>`).join(\"\")}<\/tbody><\/table><\/div>\n    <div class=\"row\" style=\"margin-top:18px\"><button class=\"btn primary\" id=\"a1\">Жаңа сандармен қайта тест<\/button><button class=\"btn\" id=\"a2\">Нәтижеге оралу<\/button><button class=\"btn ghost\" id=\"a3\">Басты бет<\/button><\/div>\n  <\/section>`;\n  document.getElementById(\"a1\").onclick=()=>{S.variant=\"twin\";S.screen=\"start\";render()};\n  document.getElementById(\"a2\").onclick=()=>{S.screen=\"result\";render()};\n  document.getElementById(\"a3\").onclick=()=>{S.screen=\"start\";render()};\n}\n\nrender();\n<\/script>\n<\/body><\/html>", "g8": "<!doctype html>\n<html lang=\"kk\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Олимпиада тренажері · Физика 8<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap\">\n<style>\n/* Торкөз дәптер: қағаз, көк сия, мұғалімнің қызыл қаламы */\n:root{\n  --paper:#f6f1e4; --sheet:#fffdf6; --grid:rgba(70,110,170,.13); --ink:#1f3a68; --ink2:#4b5d7d;\n  --red:#c8352b; --green:#2f7d4f; --amber:#c98a1b; --line:#d9cfb6; --margin:#e9a19a;\n  --serif:\"PT Serif\",Georgia,serif; --sans:\"PT Sans\",\"Segoe UI\",system-ui,sans-serif; --hand:\"Caveat\",\"Segoe Print\",cursive;\n}\n*{box-sizing:border-box}\nhtml{background:var(--paper)}\nbody{margin:0;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;min-height:100vh;\n  background:\n    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,\n    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,\n    var(--paper)}\n[hidden]{display:none!important}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}\n\n/* жоғарғы жолақ */\n.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}\n.logo{font-family:var(--serif);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;cursor:pointer}\n.logo b{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;font-size:18px;transform:rotate(-8deg)}\n.bar .sp{flex:1}\n.lang{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}\n.lang button{border:0;background:none;padding:4px 12px;font-weight:700;font-size:14px}\n.lang button.on{background:var(--ink);color:#fff}\n.chip{font-size:14px;color:var(--ink2);border:1.5px dashed var(--line);padding:3px 10px;border-radius:20px;background:var(--sheet)}\n\n/* парақ */\n.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.05),0 12px 30px -18px rgba(30,40,70,.35);padding:26px 26px 26px 64px;position:relative}\n.sheet::before{content:\"\";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}\n.sheet + .sheet{margin-top:18px}\nh1,h2,h3{font-family:var(--serif);line-height:1.2}\nh1{font-size:clamp(28px,4.5vw,42px);margin:0 0 6px}\nh2{font-size:24px;margin:0 0 10px}\nh3{font-size:19px;margin:18px 0 8px}\n.muted{color:var(--ink2)}\n.hand{font-family:var(--hand);color:var(--red);font-weight:700}\n\n/* батырмалар */\n.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:10px 18px;font-weight:700;box-shadow:3px 3px 0 rgba(31,58,104,.25);transition:transform .08s}\n.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(31,58,104,.25)}\n.btn.ghost{background:var(--sheet);color:var(--ink)}\n.btn.red{background:var(--red);border-color:var(--red);box-shadow:3px 3px 0 rgba(200,53,43,.25)}\n.btn.green{background:var(--green);border-color:var(--green)}\n.btn:disabled{opacity:.45;cursor:default}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n\n/* басты бет */\n.start{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}\n.field{display:block;margin:14px 0}\n.field span{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}\n.field input{width:100%;font:inherit;font-size:18px;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:6px 2px;color:var(--ink);outline:none;font-family:var(--serif)}\n.modes{display:grid;gap:10px;margin-top:14px}\n.mode{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px}\n.mode:hover{border-color:var(--ink)}\n.mode .num{font-family:var(--hand);font-size:34px;color:var(--red);min-width:44px;text-align:center;line-height:1}\n.mode b{display:block}\n.mode small{color:var(--ink2)}\n.log{font-size:15px;width:100%;border-collapse:collapse}\n.log td{padding:5px 4px;border-bottom:1px dashed var(--line)}\n.log td:last-child{text-align:right;font-family:var(--hand);font-size:20px;color:var(--red)}\n@media (max-width:760px){.start{grid-template-columns:1fr}.sheet{padding:20px 16px 20px 40px}.sheet::before{left:26px}}\n\n/* тест */\n.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}\n.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}\n.dot.ans{border-color:var(--ink);background:#e8eefa}\n.dot.cur{background:var(--ink);color:#fff;border-color:var(--ink)}\n.dot.ok{background:#e3f2e8;border-color:var(--green);color:var(--green)}\n.dot.bad{background:#fbe6e3;border-color:var(--red);color:var(--red)}\n.qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}\n.qnum{font-family:var(--hand);font-size:44px;color:var(--red);line-height:1}\n.lvl{font-size:13px;color:var(--ink2);border:1.5px solid var(--line);border-radius:4px;padding:1px 8px}\n.qtext{font-family:var(--serif);font-size:19px;line-height:1.55}\n.qbody{display:flex;gap:20px;align-items:flex-start}\n.qbody .qtext{flex:1}\n.fig{background:#fff;border:1px solid var(--line);padding:8px;border-radius:4px;max-width:46%;transform:rotate(.6deg);box-shadow:0 3px 10px -6px rgba(0,0,0,.4)}\n.fig img,.fig svg{display:block;max-width:100%;height:auto}\n@media (max-width:760px){.qbody{flex-direction:column}.fig{max-width:100%}}\n.opts{display:grid;gap:9px;margin-top:18px}\n.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-family:var(--serif);font-size:18px;min-height:52px}\n.opt:hover{border-color:var(--ink2)}\n.opt .L{font-family:var(--sans);font-weight:700;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none;font-size:15px}\n.opt.sel{border-color:var(--ink);background:#eef3fc}\n.opt.sel .L{background:var(--ink);color:#fff}\n.opt.right{border-color:var(--green);background:#eaf6ee}\n.opt.right .L{background:var(--green);border-color:var(--green);color:#fff}\n.opt.wrong{border-color:var(--red);background:#fdeceb}\n.opt.wrong .L{background:var(--red);border-color:var(--red);color:#fff}\n.opt.wrong .t{text-decoration:line-through;text-decoration-color:var(--red)}\n.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}\n.timer{font-variant-numeric:tabular-nums;font-weight:700}\n\n/* математика */\n.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15}\n.fr > span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}\n.fr > span:last-child{padding:0 3px}\n.sq{white-space:nowrap}\n.sq > span{border-top:1.5px solid currentColor;padding:0 2px}\n.f{font-family:var(--serif);font-style:italic}\n.fbox{font-family:var(--serif);font-size:19px;background:#fff8e6;border:1.5px solid #ecd9a6;border-radius:6px;padding:8px 14px;margin:8px 0;display:inline-block}\n\n/* нәтиже */\n.score{display:flex;align-items:center;gap:26px;flex-wrap:wrap}\n.big{font-family:var(--hand);font-size:96px;line-height:.9;color:var(--red);transform:rotate(-6deg);padding:6px 18px;border:3px solid var(--red);border-radius:50%}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}\n.gq{border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:15px;text-align:left}\n.gq.ok{border-color:#9fcfb1}\n.gq.bad{border-color:#eab0aa;background:#fff6f5}\n.gq b{font-family:var(--hand);font-size:22px;margin-right:4px}\n.gq.ok b{color:var(--green)} .gq.bad b{color:var(--red)}\n.topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}\n.tp{border:1.5px solid var(--red);color:var(--red);border-radius:20px;padding:2px 12px;font-size:15px;background:#fff}\n\n/* қатемен жұмыс */\n.ans-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}\n.pill{border-radius:8px;padding:6px 12px;font-family:var(--serif);border:2px solid}\n.pill.r{border-color:var(--red);color:var(--red);background:#fff6f5}\n.pill.g{border-color:var(--green);color:var(--green);background:#f1faf4}\n.sol{border-left:4px solid var(--green);background:#f4faf6;padding:10px 16px;margin:12px 0;border-radius:0 8px 8px 0;font-family:var(--serif)}\n.sol ol{margin:6px 0;padding-left:22px}\n.sol li{margin:3px 0}\ndetails.consp{border:2px dashed #b9c6de;border-radius:10px;padding:10px 16px;margin:14px 0;background:#fbfcff}\ndetails.consp summary{cursor:pointer;font-weight:700;font-family:var(--serif);font-size:18px}\n.consp .warn{border-left:4px solid var(--red);background:#fff5f4;padding:6px 12px;margin:8px 0;border-radius:0 6px 6px 0}\n.consp .ex{border-left:4px solid var(--amber);background:#fffaee;padding:6px 12px;margin:8px 0;border-radius:0 6px 6px 0}\n.try{border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin-top:16px;background:#fff;position:relative}\n.try .tag{position:absolute;top:-13px;left:14px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:2px 10px;border-radius:12px}\n.fb{margin-top:10px;font-weight:700}\n.fb.ok{color:var(--green)} .fb.bad{color:var(--red)}\n.progress{height:8px;background:#e5dfcf;border-radius:4px;overflow:hidden;margin:8px 0 16px}\n.progress i{display:block;height:100%;background:var(--red)}\n\n/* конспектілер кітапханасы */\n.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}\n.lib button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px}\n.lib button:hover{border-color:var(--ink)}\n.lib small{display:block;color:var(--ink2)}\n\n.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:grid;place-items:center;padding:16px;z-index:10}\n.modal .sheet{max-width:460px;width:100%}\n\n@media print{\n  body{background:#fff} .bar,.nav,.btn,.no-print{display:none!important}\n
