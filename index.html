e.score}/${e.total}<\/td><\/tr>`).join('')}<\/table>\n        <p><button class=\"btn ghost\" id=\"clrLog\" style=\"font-size:14px;padding:6px 12px\">Журналды тазалау<\/button><\/p>` : '<p class=\"muted\">Әзірге тест тапсырылмаған. Нәтижелер осы компьютерде сақталады.<\/p>'}\n    <\/div>\n  <\/section><\/div>`;\n}\n\n/* ─────────────── тест (олимпиада және қосымша) ─────────────── */\nfunction startTest(mode) {\n  const nm = $('nm') ? $('nm').value.trim() : S.name;\n  S.name = nm; try { localStorage.setItem('olymp8_name', nm); } catch (e) {}\n  const [set, lv] = mode.split('-');\n  const list = Q.filter(q => q.set === set && (lv === 'all' || String(q.lvl) === lv));\n  const label = (set === '2025' ? '2025–2026' : '2023') + ' · ' + (lv === 'all' ? 'толық олимпиада' : lv + ' ұпайлық');\n  S.test = { kind: 'olymp', mode, label, items: list, ans: {}, cur: 0, t0: Date.now(), phase: 'run' };\n  S.screen = 'test'; render(); scrollTo(0, 0);\n}\nfunction curRun() { return S.screen === 'extra' ? S.extra : S.test; }\nfunction viewTest() {\n  const R_ = curRun(), q = R_.items[R_.cur], n = R_.items.length;\n  const isOl = R_.kind === 'olymp';\n  const done = Object.keys(R_.ans).length;\n  return `<section class=\"sheet\">\n    <div class=\"row\" style=\"justify-content:space-between;margin-bottom:10px\">\n      <b>${isOl ? R_.label : 'Қосымша тест · қатемен жұмыс'}<\/b>\n      <span class=\"muted\">Жауап берілді: ${done}/${n} · <span class=\"timer\" id=\"tm\">${clock(R_)}<\/span><\/span>\n    <\/div>\n    <div class=\"dots\">${R_.items.map((_, i) => `<button class=\"dot ${i === R_.cur ? 'cur' : ''} ${R_.ans[i] != null ? 'ans' : ''}\" data-go=\"${i}\">${isOl ? R_.items[i].n : i + 1}<\/button>`).join('')}<\/div>\n    <div class=\"qhead\"><span class=\"qnum\">${isOl ? q.n : R_.cur + 1}.<\/span>${isOl ? `<span class=\"lvl\">${q.lvl} ұпай · ${q.set === '2025' ? '2025–2026' : '2023'}<\/span>` : `<span class=\"lvl\">${T[q.t].title}<\/span>`}<\/div>\n    <div class=\"qbody\"><div class=\"qtext\">${isOl ? qText(q) : q.q}<\/div>${figHtml(q)}<\/div>\n    <div class=\"opts\">${q.opts.map((o, i) => `<button class=\"opt ${R_.ans[R_.cur] === i ? 'sel' : ''}\" data-a=\"${i}\"><span class=\"L\">${LET[i]}<\/span><span class=\"t\">${o}<\/span><\/button>`).join('')}<\/div>\n    <div class=\"nav\">\n      <button class=\"btn ghost\" id=\"prev\" ${R_.cur === 0 ? 'disabled' : ''}>← Алдыңғы<\/button>\n      <span class=\"row\">${R_.cur < n - 1 ? '<button class=\"btn\" id=\"next\">Келесі →<\/button>' : ''}<button class=\"btn red\" id=\"finish\">Тапсыру<\/button><\/span>\n    <\/div>\n  <\/section>`;\n}\nfunction clock(r) { const s = Math.floor((Date.now() - r.t0) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }\nfunction tick() { const r = curRun(); if (r && $('tm')) $('tm').textContent = clock(r); }\nfunction finishRun() {\n  const r = curRun(), n = r.items.length, miss = n - Object.keys(r.ans).length;\n  const doIt = () => {\n    r.phase = 'done'; r.time = clock(r);\n    r.right = r.items.map((q, i) => r.ans[i] === (r.kind === 'olymp' ? q.a : q.a));\n    r.score = r.right.filter(Boolean).length;\n    if (r.kind === 'olymp') {\n      r.wrong = r.items.map((q, i) => i).filter(i => !r.right[i]);\n      r.pts = r.items.reduce((a, q, i) => a + (r.right[i] ? q.pts : 0), 0); r.maxPts = r.items.reduce((a, q) => a + q.pts, 0);\n      saveLog({ name: S.name, date: new Date().toLocaleDateString('ru-RU') + ' ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), mode: r.label + ' · ' + r.pts + '/' + r.maxPts + ' ұпай', score: r.score, total: n });\n      S.screen = 'result';\n    } else {\n      saveLog({ name: S.name, date: new Date().toLocaleDateString('ru-RU') + ' ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), mode: 'Қосымша тест', score: r.score, total: n });\n      S.screen = 'result';\n    }\n    render(); scrollTo(0, 0);\n  };\n  if (miss) modal(`<h2>Тапсырасың ба?<\/h2><p>${miss} сұраққа жауап берілмеді. Олар қате деп есептеледі.<\/p><div class=\"row\"><button class=\"btn red\" id=\"mYes\">Иә, тапсырамын<\/button><button class=\"btn ghost\" id=\"mNo\">Оралу<\/button><\/div>`, { mYes: doIt });\n  else doIt();\n}\n\n/* ─────────────── нәтиже ─────────────── */\nfunction viewResult() {\n  const r = S.extra && S.extra.phase === 'done' && S.screen === 'result' && S.lastWasExtra ? S.extra : S.test;\n  const isOl = r.kind === 'olymp', n = r.items.length, pct = Math.round(r.score / n * 100);\n  const mark = pct >= 85 ? 'Тамаша!' : pct >= 65 ? 'Жақсы' : pct >= 40 ? 'Орташа — қатемен жұмыс істейік' : 'Тақырыптарды қайталау керек';\n  const wrongTopics = [...new Set(r.items.filter((q, i) => !r.right[i]).map(q => q.t))];\n  return `<section class=\"sheet\">\n    <div class=\"score\"><div class=\"big\">${r.score}/${n}<\/div>\n      <div><h2>${isOl ? r.label : 'Қосымша тест'}: ${pct} %<\/h2><p class=\"hand\" style=\"font-size:28px;margin:0\">${mark}<\/p><p class=\"muted\">${esc(S.name || 'Оқушы')} · уақыты ${r.time}${isOl ? ` · <b>ұпай: ${r.pts} / ${r.maxPts}<\/b>` : ''}<\/p><\/div><\/div>\n    <h3>${isOl ? 'Есептер' : 'Сұрақтар'}<\/h3>\n    <div class=\"grid\">${r.items.map((q, i) => `<div class=\"gq ${r.right[i] ? 'ok' : 'bad'}\"><b>${r.right[i] ? '✓' : '✗'}<\/b>${isOl ? q.n + '-есеп' : (i + 1) + '-сұрақ'} <small class=\"muted\">· ${r.ans[i] != null ? LET[r.ans[i]] : '—'}${r.right[i] ? '' : ' → ' + LET[q.a]}<\/small><br><small class=\"muted\">${T[q.t].title}<\/small><\/div>`).join('')}<\/div>\n    ${wrongTopics.length ? `<h3>Қайталау керек тақырыптар<\/h3><div class=\"topics\">${wrongTopics.map(t => `<span class=\"tp\">${T[t].title}<\/span>`).join('')}<\/div>` : ''}\n    <div class=\"nav\">\n      <button class=\"btn ghost\" id=\"home2\">Басты бет<\/button>\n      <span class=\"row\">\n        <button class=\"btn ghost\" onclick=\"print()\">Басып шығару<\/button>\n        ${wrongTopics.length ? `<button class=\"btn red\" id=\"toReview\">${isOl ? 'Қатемен жұмыс' : 'Қателерді талдау'} →<\/button><button class=\"btn\" id=\"toExtra\">${isOl ? 'Қосымша тест' : 'Жаңа қосымша тест'}<\/button>` : `<button class=\"btn green\" id=\"toExtraAll\">Барлық тақырыптан аралас тест<\/button>`}\n      <\/span>\n    <\/div>\n  <\/section>`;\n}\n\n/* ─────────────── қатемен жұмыс ─────────────── */\nfunction startReview() {\n  const r = S.lastWasExtra ? S.extra : S.test;\n  const wrong = r.items.map((q, i) => i).filter(i => !r.right[i]);\n  S.review = { src: r, list: wrong, i: 0, tries: {} };\n  S.screen = 'review'; render(); scrollTo(0, 0);\n}\nfunction viewReview() {\n  const V = S.review, r = V.src, idx = V.list[V.i], q = r.items[idx], isOl = r.kind === 'olymp', top = T[q.t];\n  const my = r.ans[idx];\n  if (!V.tries[V.i]) V.tries[V.i] = { q: genFor(q.t), ans: null };\n  const tr = V.tries[V.i];\n  const solHtml = (isOl ? q.sol : q.sol).map(s => `<li>${s}<\/li>`).join('');\n  return `<section class=\"sheet\">\n    <div class=\"row\" style=\"justify-content:space-between\"><b class=\"hand\" style=\"font-size:26px\">Қатемен жұмыс<\/b><span class=\"muted\">${V.i + 1} / ${V.list.length}<\/span><\/div>\n    <div class=\"progress\"><i style=\"width:${(V.i + 1) / V.list.length * 100}%\"><\/i><\/div>\n    <div class=\"qhead\"><span class=\"qnum\">${isOl ? q.n : idx + 1}.<\/span><span class=\"lvl\">${top.title}<\/span><\/div>\n    <div class=\"qbody\"><div class=\"qtext\">${isOl ? qText(q) : q.q}<\/div>${figHtml(q)}<\/div>\n    <div class=\"ans-row\">\n      <span class=\"pill r\">Сенің жауабың: ${my != null ? LET[my] + ') ' + q.opts[my] : 'жауап жоқ'}<\/span>\n      <span class=\"pill g\">Дұрыс жауап: ${LET[q.a]}) ${q.opts[q.a]}<\/span>\n    <\/div>\n    <div class=\"sol\"><b>Шешуі<\/b><ol>${solHtml}<\/ol><\/div>\n    <details class=\"consp\" ${V.i === 0 ? 'open' : ''}><summary>📒 Конспект: ${top.title}<\/summary>${top.c}<\/details>\n    <div class=\"try\"><span class=\"tag\">Өзіңді тексер — ұқсас есеп<\/span>\n      <div class=\"qbody\"><div class=\"qtext\">${tr.q.q}<\/div>${figHtml(tr.q)}<\/div>\n      <div class=\"opts\">${tr.q.opts.map((o, i) => { let c = ''; if (tr.ans != null) { if (i === tr.q.a) c = 'right'; else if (i === tr.ans) c = 'wrong'; } return `<button class=\"opt ${c}\" data-try=\"${i}\" ${tr.ans != null ? 'disabled' : ''}><span class=\"L\">${LET[i]}<\/span><span class=\"t\">${o}<\/span><\/button>`; }).join('')}<\/div>\n      ${tr.ans != null ? `<div class=\"fb ${tr.ans === tr.q.a ? 'ok' : 'bad'}\">${tr.ans === tr.q.a ? '✓ Дұрыс! Тақырыпты түсіндің.' : '✗ Әлі қате. Шешуін оқып, жаңа есеппен тағы байқа.'}<\/div>\n        <div class=\"sol\"><ol>${tr.q.sol.map(s => `<li>${s}<\/li>`).join('')}<\/ol><\/div>\n        <button class=\"btn ghost\" id=\"again\">Тағы бір ұқсас есеп<\/button>` : ''}\n    <\/div>\n    <div class=\"nav\">\n      <button class=\"btn ghost\" id=\"rPrev\" ${V.i === 0 ? 'disabled' : ''}>← Алдыңғы қате<\/button>\n      ${V.i < V.list.length - 1 ? '<button class=\"btn\" id=\"rNext\">Келесі қате →<\/button>' : '<button class=\"btn red\" id=\"toExtra\">Қосымша тестке өту →<\/button>'}\n    <\/div>\n  <\/section>`;\n}\nfunction genFor(t) { const q = pick(T[t].g)(); q.t = t; return q; }\n\n/* ─────────────── қосымша тест ─────────────── */\nfunction startExtra(all) {\n  const src = S.lastWasExtra ? S.extra : S.test;\n  let topics = all ? Object.keys(T) : [...new Set(src.items.filter((q, i) => !src.right[i]).map(q => q.t))];\n  let per = all ? 1 : Math.min(4, Math.max(2, Math.ceil(8 / topics.length)));\n  let items = [];\n  topics.forEach(t => { const used = new Set(); for (let k = 0; k < per; k++) { let q, tries = 0; do { q = genFor(t); tries++; } while (used.has(q.q) && tries < 8); used.add(q.q); items.push(q); } });\n  items = shuffle(items).slice(0, 20);\n  S.extra = { kind: 'extra', items, ans: {}, cur: 0, t0: Date.now(), phase: 'run' };\n  S.lastWasExtra = false;\n  S.screen = 'extra'; render(); scrollTo(0, 0);\n}\n\n/* ─────────────── конспектілер ─────────────── */\nfunction viewLib() {\n  return `<section class=\"sheet\"><h2>Конспектілер<\/h2><p class=\"muted\">Тақырыпты таңда: теория, формулалар, олимпиаданың сол тақырыптағы есептері және жаттығу.<\/p>\n  <div class=\"lib\">${Object.entries(T).map(([k, t]) => `<button data-topic=\"${k}\"><b>${t.title}<\/b><small>Олимпиадада: ${Q.filter(q => q.t === k).length} есеп<\/small><\/button>`).join('')}<\/div>\n  <div class=\"nav\"><button class=\"btn ghost\" id=\"home2\">← Басты бет<\/button><\/div><\/section>`;\n}\nlet topicTry = null;\nfunction viewTopic() {\n  const t = T[S.topic];\n  if (!topicTry || topicTry.t !== S.topic) topicTry = { t: S.topic, q: genFor(S.topic), ans: null };\n  const tr = topicTry;\n  return `<section class=\"sheet\"><h2>📒 ${t.title}<\/h2>${t.c}\n   <h3>Олимпиададағы есептер<\/h3><p>${Q.filter(q => q.t === S.topic).map(q => `<b>${q.set === '2025' ? '2025–26' : '2023'}, ${q.n}-есеп<\/b> (жауабы ${LET[q.a]})`).join(' · ')}<\/p>\n   <div class=\"try\"><span class=\"tag\">Жаттығу<\/span>\n     <div class=\"qbody\"><div class=\"qtext\">${tr.q.q}<\/div>${figHtml(tr.q)}<\/div>\n     <div class=\"opts\">${tr.q.opts.map((o, i) => { let c = ''; if (tr.ans != null) { if (i === tr.q.a) c = 'right'; else if (i === tr.ans) c = 'wrong'; } return `<button class=\"opt ${c}\" data-ttry=\"${i}\" ${tr.ans != null ? 'disabled' : ''}><span class=\"L\">${LET[i]}<\/span><span class=\"t\">${o}<\/span><\/button>`; }).join('')}<\/div>\n     ${tr.ans != null ? `<div class=\"fb ${tr.ans === tr.q.a ? 'ok' : 'bad'}\">${tr.ans === tr.q.a ? '✓ Дұрыс!' : '✗ Қате.'}<\/div><div class=\"sol\"><ol>${tr.q.sol.map(s => `<li>${s}<\/li>`).join('')}<\/ol><\/div><button class=\"btn ghost\" id=\"tAgain\">Жаңа есеп<\/button>` : ''}\n   <\/div>\n   <div class=\"nav\"><button class=\"btn ghost\" id=\"toLib\">← Барлық конспект<\/button><\/div><\/section>`;\n}\n\n/* ─────────────── оқиғалар ─────────────── */\nfunction modal(html, actions) {\n  $('modalBox').innerHTML = html; $('modal').hidden = false;\n  Object.entries(actions || {}).forEach(([id, fn]) => { const b = $(id); if (b) b.onclick = () => { $('modal').hidden = true; fn(); }; });\n  const no = $('mNo'); if (no) no.onclick = () => $('modal').hidden = true;\n}\nfunction on(id, fn) { const e = $(id); if (e) e.onclick = fn; }\nfunction bind() {\n  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => startTest(b.dataset.m));\n  on('toLib', () => go('lib'));\n  on('home2', () => go('home'));\n  on('clrLog', () => { if (confirm('Журналды толық тазалау керек пе?')) { try { localStorage.removeItem(LOGKEY); } catch (e) {} render(); } });\n  const nm = $('nm'); if (nm) nm.oninput = () => { S.name = nm.value.trim(); try { localStorage.setItem('olymp8_name', S.name); } catch (e) {} };\n  /* тест */\n  const r = curRun();\n  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { r.ans[r.cur] = +b.dataset.a; render(); });\n  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { r.cur = +b.dataset.go; render(); });\n  on('prev', () => { r.cur--; render(); });\n  on('next', () => { r.cur++; render(); });\n  on('finish', () => { S.lastWasExtra = S.screen === 'extra'; finishRun(); });\n  /* нәтиже */\n  on('toReview', startReview);\n  on('toExtra', () => startExtra(false));\n  on('toExtraAll', () => startExtra(true));\n  /* қатемен жұмыс */\n  if (S.screen === 'review') {\n    const V = S.review;\n    document.querySelectorAll('[data-try]').forEach(b => b.onclick = () => { V.tries[V.i].ans = +b.dataset.try; render(); });\n    on('again', () => { V.tries[V.i] = { q: genFor(V.src.items[V.list[V.i]].t), ans: null }; render(); });\n    on('rPrev', () => { V.i--; render(); scrollTo(0, 0); });\n    on('rNext', () => { V.i++; render(); scrollTo(0, 0); });\n  }\n  /* конспектілер */\n  document.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { S.topic = b.dataset.topic; topicTry = null; S.screen = 'topic'; render(); scrollTo(0, 0); });\n  document.querySelectorAll('[data-ttry]').forEach(b => b.onclick = () => { topicTry.ans = +b.dataset.ttry; render(); });\n  on('tAgain', () => { topicTry = null; render(); });\n}\n/* пернетақта: 1–5 немесе A–E жауап, ← → ауысу */\naddEventListener('keydown', e => {\n  if (!(S.screen === 'test' || S.screen === 'extra') || e.target.tagName === 'INPUT' || !$('modal').hidden) return;\n  const r = curRun(); const k = e.key.toUpperCase();\n  const i = '12345'.indexOf(k) >= 0 ? '12345'.indexOf(k) : 'ABCDE'.indexOf(k);\n  if (i >= 0 && k.length === 1) { r.ans[r.cur] = i; render(); }\n  else if (e.key === 'ArrowRight' && r.cur < r.items.length - 1) { r.cur++; render(); }\n  else if (e.key === 'ArrowLeft' && r.cur > 0) { r.cur--; render(); }\n});\naddEventListener('beforeunload', e => { const r = curRun(); if (r && r.phase === 'run' && Object.keys(r.ans).length) { e.preventDefault(); e.returnValue = ''; } });\nrender();\nwindow.__t = { Q, T, S, genFor, startTest };\n<\/script>\n<\/body>\n<\/html>\n"};
